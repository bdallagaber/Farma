<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>سجل الطلبيات - نظام إدارة الصيدلية</title><script src="supabase-lib.js"></script><link rel="stylesheet" href="style.css"></head>
<body class="has-sidebar"><header><button id="menuToggle">☰</button><h1>📦 نظام إدارة الصيدلية</h1><div><span class="userinfo" id="userinfo"></span><button id="logoutBtn" style="margin-right:8px">خروج</button></div></header>
<nav><a href="inventory.html">المخزون</a><a href="shortages.html">النواقص</a><a href="order-history.html" class="active">سجل الطلبيات</a><a href="sales.html">المبيعات</a><a href="invoices.html">🧾 الفواتير</a><a href="customers.html">👥 العملاء</a><a href="expenses.html">المصروفات</a><a href="profit.html">الأرباح</a><a href="search.html">🔍 بحث الأدوية</a><a href="users.html">الإعدادات</a></nav><div id="sidebarOverlay" class="sidebar-overlay"></div>
<main class="main-content"><div class="card"><h2>📋 سجل الطلبيات</h2><p class="sub">كل طلبية محفوظة حسب المورد والتاريخ، ولا تُضاف للمخزون إلا بعد الضغط على «تم الاستلام».</p><div id="ordersWrap"><p class="loading">جاري تحميل سجل الطلبيات...</p></div></div></main>
<script src="config.js"></script><script>
const labels={ordered:'تم الطلب',received:'تم الاستلام',cancelled:'ملغاة'};let isAdmin=false;
(async()=>{const a=await requireAuth();if(!a)return;if(!guardPageAccess(a.profile,'shortages'))return;isAdmin=a.profile.role==='admin';document.getElementById('userinfo').textContent=a.profile.full_name+' ('+(isAdmin?'أدمن':'موظف')+')';await loadOrders()})();
document.getElementById('logoutBtn').onclick=async()=>{await sb.auth.signOut();location.href='index.html'};
function esc(v){const d=document.createElement('div');d.textContent=v==null?'':String(v);return d.innerHTML}function egyptDate(v){return new Date(v).toLocaleString('ar-EG',{timeZone:'Africa/Cairo',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})}
async function loadOrders(){const w=document.getElementById('ordersWrap');const [{data:orders,error},{data:items}]=await Promise.all([sb.from('purchase_orders').select('id,order_number,supplier_name,status,notes,created_at,received_at,profiles(full_name)').order('created_at',{ascending:false}).limit(500),sb.from('purchase_order_items').select('order_id,product_name_snapshot,boxes,quantity_smallest_unit,unit_large,unit_medium,unit_small').limit(5000)]);if(error){w.innerHTML='<p class="msg error">تعذر تحميل السجل: '+esc(error.message)+'</p>';return}const by={};(items||[]).forEach(i=>(by[i.order_id]??=[]).push(i));if(!orders?.length){w.innerHTML='<p class="empty-ok">لا توجد طلبيات محفوظة حتى الآن</p>';return}w.innerHTML=orders.map(o=>{const its=by[o.id]||[];return '<details class="order-card" style="border:1px solid var(--border);border-radius:10px;padding:12px;margin:10px 0;background:var(--surface)"><summary style="cursor:pointer;font-weight:700;display:flex;gap:10px;flex-wrap:wrap;align-items:center"><span>🔽 طلبية #'+o.order_number+'</span><span>— '+esc(o.supplier_name)+'</span><span style="color:var(--text-muted);font-size:12px">'+egyptDate(o.created_at)+'</span><span class="tag">'+labels[o.status]+'</span></summary><div style="margin-top:12px"><div style="font-size:12px;color:var(--text-muted);margin-bottom:8px">أنشأها: '+esc(o.profiles?.full_name||'—')+(o.received_at?' — استُلمت: '+egyptDate(o.received_at):'')+'</div><table style="min-width:0"><thead><tr><th>الصنف</th><th>الكمية المطلوبة</th><th>أصغر وحدة</th></tr></thead><tbody>'+its.map(i=>'<tr><td>'+esc(i.product_name_snapshot)+'</td><td>'+Number(i.boxes).toLocaleString('ar-EG')+' علبة</td><td>'+Number(i.quantity_smallest_unit).toLocaleString('ar-EG')+'</td></tr>').join('')+'</tbody></table>'+(isAdmin&&o.status==='ordered'?'<div style="display:flex;gap:8px;margin-top:12px"><button type="button" onclick="receiveOrder(\''+o.id+'\')">✅ تم الاستلام</button><button type="button" class="danger" onclick="cancelOrder(\''+o.id+'\')">إلغاء الطلبية</button></div>':'')+'</div></details>'}).join('')}
async function receiveOrder(id){if(!confirm('سيتم إضافة كميات الطلبية إلى المخزون وتغيير حالتها إلى تم الاستلام. هل تريد المتابعة؟'))return;const {error}=await sb.rpc('receive_purchase_order',{p_order_id:id});if(error){alert('تعذر استلام الطلبية: '+error.message);return}await loadOrders()}
async function cancelOrder(id){if(!confirm('هل تريد إلغاء هذه الطلبية؟ لن يتم تعديل المخزون.'))return;const {error}=await sb.rpc('cancel_purchase_order',{p_order_id:id});if(error){alert('تعذر إلغاء الطلبية: '+error.message);return}await loadOrders()}
</script></body></html>
