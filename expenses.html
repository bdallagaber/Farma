<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المصروفات - نظام إدارة الصيدلية</title>
<script src="supabase-lib.js"></script>
<script src="xlsx-lib.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #0f1b16; color: #eef2ef; padding: 16px; padding-bottom: 60px; }
  header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
  header h1 { font-size: 18px; color: #6fcf97; }
  header .userinfo { font-size: 12px; color: #9fb3a8; }
  nav { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
  nav a { padding: 8px 14px; background: #16261e; border: 1px solid #23392c; border-radius: 8px; color: #eef2ef; text-decoration: none; font-size: 13px; }
  nav a.active { background: #6fcf97; color: #0f1b16; font-weight: 600; }
  .card { background: #16261e; border: 1px solid #23392c; border-radius: 14px; padding: 20px; margin-bottom: 20px; }
  .card h2 { font-size: 16px; margin-bottom: 16px; color: #6fcf97; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  label { display: block; font-size: 12px; color: #b7c9be; margin-bottom: 4px; }
  input, select { width: 100%; padding: 10px 12px; background: #0f1b16; border: 1px solid #2a4536; border-radius: 8px; color: #eef2ef; font-size: 14px; margin-bottom: 12px; }
  input:focus, select:focus { outline: none; border-color: #6fcf97; }
  button { padding: 12px 20px; background: #6fcf97; color: #0f1b16; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: 0.6; }
  .msg { margin-top: 10px; font-size: 13px; }
  .msg.error { color: #f28b82; }
  .msg.ok { color: #6fcf97; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { padding: 10px 8px; text-align: right; border-bottom: 1px solid #23392c; }
  th { color: #9fb3a8; font-weight: 600; }
  .hidden { display: none !important; }
  .full-width { grid-column: 1 / -1; }
  .loading { text-align: center; color: #9fb3a8; padding: 20px; }
  .total-box { background: #0f1b16; border: 1px solid #2a4536; border-radius: 10px; padding: 16px; text-align: center; margin-bottom: 16px; }
  .total-box .amount { font-size: 26px; color: #f28b82; font-weight: 700; }
  .denied { text-align: center; padding: 40px; color: #9fb3a8; }
</style>
</head>
<body>

<header>
  <h1>📦 نظام إدارة الصيدلية</h1>
  <div>
    <span class="userinfo" id="userinfo"></span>
    <button id="logoutBtn" style="margin-right:8px;background:#23392c;color:#eef2ef;padding:6px 12px;font-size:12px;border-radius:8px;border:none;">خروج</button>
  </div>
</header>

<nav>
  <a href="inventory.html">المخزون</a>
  <a href="sales.html">المبيعات</a>
  <a href="shortages.html">النواقص</a>
  <a href="expenses.html" class="active">المصروفات</a>
  <a href="profit.html">الأرباح</a>
  <a href="search.html">🔍 بحث الأدوية</a>
  <a href="users.html">الإعدادات</a>
</nav>

<div id="content" class="hidden">
  <div class="card">
    <h2 id="expFormTitle">➕ إضافة مصروف</h2>
    <div class="grid">
      <div>
        <label>النوع</label>
        <select id="e_category">
          <option value="salaries">مرتبات</option>
          <option value="bills">فواتير</option>
          <option value="maintenance">صيانة</option>
          <option value="other">أخرى</option>
        </select>
      </div>
      <div>
        <label>المبلغ (جنيه)</label>
        <input type="number" id="e_amount" step="0.01" min="0">
      </div>
      <div>
        <label>تاريخ المصروف</label>
        <input type="date" id="e_date">
      </div>
      <div class="full-width">
        <label>وصف المصروف (مين، إيه بالظبط)</label>
        <input type="text" id="e_description" placeholder="مثال: مرتب محمد، فاتورة كهرباء شهر 8، صيانة تكييف">
      </div>
    </div>
    <button id="addExpenseBtn">حفظ المصروف</button>
    <button id="cancelExpEditBtn" class="hidden" style="margin-right:8px;background:#23392c;color:#eef2ef;">إلغاء التعديل</button>
    <div class="msg" id="expMsg"></div>
  </div>

  <div class="card">
    <h2 id="expTitle">📊 إجمالي المصروفات</h2>
    <div class="toolbar" style="display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;">
      <button type="button" class="small secondary rangeBtn" data-range="today">اليوم</button>
      <button type="button" class="small secondary rangeBtn" data-range="week">آخر أسبوع</button>
      <button type="button" class="small secondary rangeBtn active" data-range="month">آخر شهر</button>
      <button type="button" class="small secondary rangeBtn" data-range="all">الكل</button>
      <input type="date" id="customFrom" class="hidden" style="width:auto;margin-bottom:0;">
      <input type="date" id="customTo" class="hidden" style="width:auto;margin-bottom:0;">
      <button type="button" id="customRangeBtn" class="small secondary">مدة مخصصة</button>
      <button type="button" id="exportExpBtn" class="small secondary">⬇️ تصدير إكسيل</button>
    </div>
    <div class="total-box">
      <div class="amount" id="totalAmount">—</div>
    </div>
    <div id="expensesTableWrap"><p class="loading">جاري التحميل...</p></div>
  </div>
</div>

<div id="deniedBox" class="hidden denied">هذا القسم مخصص للأدمن فقط</div>

<script src="config.js"></script>
<script>
  window.onerror = function(msg, url, line) {
    document.body.insertAdjacentHTML('beforeend',
      '<div style="position:fixed;bottom:0;left:0;right:0;background:#f28b82;color:#000;padding:12px;font-size:12px;direction:ltr;text-align:left;">JS Error: ' + msg + ' (line ' + line + ')</div>');
  };
  window.onunhandledrejection = function(e) {
    document.body.insertAdjacentHTML('beforeend',
      '<div style="position:fixed;bottom:0;left:0;right:0;background:#f28b82;color:#000;padding:12px;font-size:12px;direction:ltr;text-align:left;">Promise Error: ' + (e.reason && e.reason.message ? e.reason.message : e.reason) + '</div>');
  };

  const CATEGORY_LABELS = { salaries: 'مرتبات', bills: 'فواتير', maintenance: 'صيانة', other: 'أخرى' };

  (async () => {
    const auth = await requireAuth();
    if (!auth) return;

    document.getElementById('userinfo').textContent =
      auth.profile.full_name + ' (' + (auth.profile.role === 'admin' ? 'أدمن' : 'موظف') + ')';

    if (!guardPageAccess(auth.profile, 'expenses')) return;
    document.getElementById('content').classList.remove('hidden');
    document.getElementById('e_date').value = new Date().toISOString().split('T')[0];
    await loadExpenses();
  })();

  document.getElementById('logoutBtn').addEventListener('click', async () => {
    await sb.auth.signOut();
    window.location.href = 'index.html';
  });

  let editingExpenseId = null;

  document.getElementById('addExpenseBtn').addEventListener('click', async () => {
    const btn = document.getElementById('addExpenseBtn');
    const category = document.getElementById('e_category').value;
    const amount = parseFloat(document.getElementById('e_amount').value);
    const description = document.getElementById('e_description').value.trim();
    const chosenDate = document.getElementById('e_date').value;

    if (!amount || amount <= 0) {
      showMsg('اكتب مبلغ صحيح', 'error');
      return;
    }
    if (!description) {
      showMsg('لازم تكتب وصف المصروف (مين المرتب ده، أو الفاتورة بتاعة إيه)', 'error');
      return;
    }
    if (!chosenDate) {
      showMsg('اختار تاريخ المصروف', 'error');
      return;
    }

    btn.disabled = true;
    btn.textContent = 'جاري الحفظ...';

    const { data: { session } } = await sb.auth.getSession();
    const createdAt = new Date(chosenDate + 'T12:00:00').toISOString();

    let error;
    if (editingExpenseId) {
      const { data, error: updateError } = await sb.from('expenses')
        .update({ category, amount, other_note: description, created_at: createdAt })
        .eq('id', editingExpenseId)
        .select();
      error = updateError;
      if (!error && (!data || data.length === 0)) {
        error = { message: 'التعديل لم يُحفظ فعليًا، جرّب تسجّل خروج ودخول تاني' };
      }
    } else {
      const { error: insertError } = await sb.from('expenses').insert({
        category, amount, other_note: description,
        created_by: session.user.id, created_at: createdAt
      });
      error = insertError;
    }

    if (error) {
      showMsg('حصل خطأ: ' + error.message, 'error');
    } else {
      showMsg(editingExpenseId ? 'تم تعديل المصروف بنجاح ✅' : 'تم حفظ المصروف بنجاح ✅', 'ok');
      resetExpenseForm();
      await loadExpenses();
    }
    btn.disabled = false;
    btn.textContent = editingExpenseId ? 'حفظ التعديل' : 'حفظ المصروف';
  });

  function resetExpenseForm() {
    editingExpenseId = null;
    document.getElementById('expFormTitle').textContent = '➕ إضافة مصروف';
    document.getElementById('addExpenseBtn').textContent = 'حفظ المصروف';
    document.getElementById('cancelExpEditBtn').classList.add('hidden');
    document.getElementById('e_category').value = 'salaries';
    document.getElementById('e_amount').value = '';
    document.getElementById('e_description').value = '';
    document.getElementById('e_date').value = new Date().toISOString().split('T')[0];
  }

  document.getElementById('cancelExpEditBtn').addEventListener('click', resetExpenseForm);

  function showMsg(text, type) {
    const el = document.getElementById('expMsg');
    el.textContent = text;
    el.className = 'msg ' + type;
  }

  let currentExpRange = 'month';
  let expCustomFrom = null;
  let expCustomTo = null;

  function getExpRangeStart(range) {
    const now = new Date();
    if (range === 'today') return new Date(now.getFullYear(), now.getMonth(), now.getDate()).toISOString();
    if (range === 'week') { const d = new Date(now); d.setDate(d.getDate() - 7); return d.toISOString(); }
    if (range === 'month') { const d = new Date(now); d.setMonth(d.getMonth() - 1); return d.toISOString(); }
    return null;
  }

  document.querySelectorAll('.rangeBtn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.rangeBtn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('customFrom').classList.add('hidden');
      document.getElementById('customTo').classList.add('hidden');
      currentExpRange = btn.dataset.range;
      expCustomFrom = null;
      expCustomTo = null;
      loadExpenses();
    });
  });

  document.getElementById('customRangeBtn').addEventListener('click', () => {
    const fromEl = document.getElementById('customFrom');
    const toEl = document.getElementById('customTo');
    if (fromEl.classList.contains('hidden')) {
      fromEl.classList.remove('hidden');
      toEl.classList.remove('hidden');
      return;
    }
    document.querySelectorAll('.rangeBtn').forEach(b => b.classList.remove('active'));
    currentExpRange = 'custom';
    expCustomFrom = fromEl.value || null;
    expCustomTo = toEl.value || null;
    loadExpenses();
  });

  async function loadExpenses() {
    const wrap = document.getElementById('expensesTableWrap');

    let query = sb.from('expenses').select('id, category, amount, other_note, created_at').order('created_at', { ascending: false });

    if (currentExpRange === 'custom') {
      if (expCustomFrom) query = query.gte('created_at', expCustomFrom);
      if (expCustomTo) { const d = new Date(expCustomTo); d.setDate(d.getDate() + 1); query = query.lt('created_at', d.toISOString()); }
    } else {
      const start = getExpRangeStart(currentExpRange);
      if (start) query = query.gte('created_at', start);
    }

    const { data, error } = await query;

    if (error) {
      wrap.innerHTML = '<p class="msg error">تعذّر تحميل المصروفات: ' + error.message + '</p>';
      return;
    }

    window._expensesCache = data || [];
    const total = (data || []).reduce((sum, e) => sum + Number(e.amount), 0);
    document.getElementById('totalAmount').textContent = total.toLocaleString('ar-EG') + ' ج';

    if (!data || data.length === 0) {
      wrap.innerHTML = '<p class="loading">لا توجد مصروفات في المدة دي</p>';
      return;
    }

    let html = '<table><thead><tr><th>النوع</th><th>التفاصيل</th><th>المبلغ</th><th>التاريخ</th><th>إجراءات</th></tr></thead><tbody>';
    for (const e of data) {
      html += '<tr>' +
        '<td>' + CATEGORY_LABELS[e.category] + '</td>' +
        '<td>' + (e.other_note ? escapeHtml(e.other_note) : '—') + '</td>' +
        '<td>' + Number(e.amount).toLocaleString('ar-EG') + ' ج</td>' +
        '<td>' + new Date(e.created_at).toLocaleDateString('ar-EG') + '</td>' +
        '<td>' +
          '<button class="small secondary" onclick="editExpense(\'' + e.id + '\')" style="padding:6px 10px;font-size:12px;">تعديل</button> ' +
          '<button class="small" onclick="deleteExpense(\'' + e.id + '\')" style="padding:6px 10px;font-size:12px;background:#a63a3a;color:#fff;">حذف</button>' +
        '</td>' +
        '</tr>';
    }
    html += '</tbody></table>';
    wrap.innerHTML = html;
  }

  window.editExpense = function(id) {
    const e = (window._expensesCache || []).find(x => x.id === id);
    if (!e) return;

    editingExpenseId = id;
    document.getElementById('expFormTitle').textContent = '✏️ تعديل مصروف';
    document.getElementById('addExpenseBtn').textContent = 'حفظ التعديل';
    document.getElementById('cancelExpEditBtn').classList.remove('hidden');

    document.getElementById('e_category').value = e.category;
    document.getElementById('e_amount').value = e.amount;
    document.getElementById('e_description').value = e.other_note || '';
    document.getElementById('e_date').value = e.created_at.split('T')[0];

    window.scrollTo({ top: 0, behavior: 'smooth' });
  };

  window.deleteExpense = async function(id) {
    if (!confirm('متأكد إنك عايز تمسح المصروف ده؟')) return;
    const { error } = await sb.from('expenses').delete().eq('id', id);
    if (error) { alert('تعذّر الحذف: ' + error.message); return; }
    if (editingExpenseId === id) resetExpenseForm();
    await loadExpenses();
  };

  document.getElementById('exportExpBtn').addEventListener('click', () => {
    const data = window._expensesCache || [];
    if (data.length === 0) { alert('مفيش بيانات للتصدير في المدة المختارة'); return; }

    const rows = data.map(e => ({
      'النوع': CATEGORY_LABELS[e.category],
      'التفاصيل': e.other_note || '',
      'المبلغ': e.amount,
      'التاريخ': new Date(e.created_at).toLocaleDateString('ar-EG')
    }));

    const ws = XLSX.utils.json_to_sheet(rows);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'المصروفات');
    XLSX.writeFile(wb, 'مصروفات_الصيدلية.xlsx');
  });

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }
</script>

</body>
</html>
