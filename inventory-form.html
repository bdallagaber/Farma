<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>إضافة منتج - نظام إدارة الصيدلية</title>
<script src="supabase-lib.js"></script><link rel="stylesheet" href="style.css">
<style>
.form-actions{display:flex;gap:8px;flex-wrap:wrap}.form-actions button{min-width:140px}
.scan-modal{z-index:9999}
</style>
</head>
<body class="has-sidebar">
<header><button id="menuToggle">☰</button><h1>📦 نظام إدارة الصيدلية</h1><div><span class="userinfo" id="userinfo"></span><button id="logoutBtn" class="small secondary">خروج</button></div></header>
<nav>
<a href="inventory.html">المخزون</a><a href="inventory-form.html" class="active">➕ إضافة منتج</a><a href="sales.html">المبيعات</a><a href="invoices.html">🧾 الفواتير</a><a href="shortages.html">النواقص</a><a href="expenses.html">المصروفات</a><a href="profit.html">الأرباح</a><a href="search.html">🔍 بحث الأدوية</a><a href="users.html">الإعدادات</a>
</nav><div id="sidebarOverlay" class="sidebar-overlay"></div>
<main class="main-content">
<div class="card">
<h2 id="formTitle">➕ إضافة منتج جديد</h2>
<div class="grid">
<div class="full-width"><label>اسم المنتج بالعربي</label><input id="p_name" placeholder="مثال: أوجمنتين"></div>
<div class="full-width"><label>الاسم بالإنجليزي</label><input id="p_name_en" placeholder="مثال: Augmentin"></div>
<div><label>نوع الصنف</label><div style="display:flex;gap:6px"><select id="p_drug_type"></select><button type="button" id="addTypeBtn" class="secondary small">+ جديد</button></div></div>
<div><label>الشكل الدوائي</label><div style="display:flex;gap:6px"><select id="p_shape"></select><button type="button" id="addShapeBtn" class="secondary small">+ جديد</button></div></div>
<div id="other_shape_wrap" class="hidden"><label>وضّح الشكل</label><input id="p_other_shape_note" placeholder="مثال: بخاخ"></div>
<div><label>التصنيف</label><div style="display:flex;gap:6px"><select id="p_classification"><option value="">-- بدون --</option></select><button type="button" id="addClassBtn" class="secondary small">+ جديد</button></div></div>
<div><label>المورد</label><select id="p_supplier"><option value="">-- بدون --</option></select><button type="button" id="addSupplierBtn" class="secondary small">+ إضافة مورد</button></div>
<div><label>المادة الفعالة</label><input id="p_active_ingredient"></div>
<div><label>التركيز</label><input id="p_concentration"></div>
<div><label>قابل للبيع بالتجزئة؟</label><select id="p_retail_allowed"><option value="no">لا</option><option value="yes">أيوه</option></select></div>
<div id="has_strip_wrap" class="hidden"><label>يُباع بالوحدة الأصغر؟</label><select id="p_has_strip"><option value="no">لا — علبة فقط</option><option value="yes">أيوه — علبة ← وسط ← فردي</option></select></div>
<div id="field3_wrap"><label id="field3_label">العلبة فيها كام شريط؟</label><input type="number" id="p_field3" value="1" min="1"></div>
<div id="field4_wrap" class="hidden"><label id="field4_label">الشريط فيه كام حبة؟</label><input type="number" id="p_field4" value="1" min="1"></div>
<div><label>سعر العلبة</label><input type="number" id="p_box_price" step="0.01"></div>
<div><label>عدد العلب المتاحة</label><input type="number" id="p_boxes_qty" value="0" min="0"></div>
<div id="leftover_medium_wrap" class="hidden"><label id="leftover_medium_label">زيادة خارج العلب</label><input type="number" id="p_leftover_medium" value="0" min="0"></div>
<div id="leftover_small_wrap" class="hidden"><label id="leftover_small_label">زيادة فردية</label><input type="number" id="p_leftover_small" value="0" min="0"></div>
<div class="full-width hidden" id="sellUnitsWrap"><label>✅ وحدات البيع المسموحة</label><div id="sellUnitsBox" style="display:flex;gap:16px;flex-wrap:wrap"></div></div>
<div class="section-label">بيانات إضافية</div>
<div><label>تاريخ انتهاء الصلاحية</label><input type="date" id="p_expiry_date"></div>
<div><label>الحد الأدنى للتنبيه (بالعلب)</label><input type="number" id="p_min_threshold" value="0" min="0" step="0.5"></div>
<div id="purchase_price_wrap" class="hidden"><label>🛒 سعر شراء العلبة (أدمن فقط)</label><input type="number" id="p_purchase_price" step="0.01"></div>
<div class="full-width"><label>كود QR / باركود</label><div style="display:flex;gap:8px"><input id="p_qr" style="margin-bottom:0"><button type="button" id="scanBtn" class="secondary">📷 مسح</button></div></div>
<div class="full-width hidden" id="extraBarcodesWrap"><label>باركودات إضافية لنفس المنتج</label><div id="extraBarcodesList" style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px"></div><div style="display:flex;gap:8px"><input id="p_extra_qr" style="margin-bottom:0"><button type="button" id="addExtraBarcodeBtn">+ جديد</button></div></div>
</div>
<div class="form-actions"><button id="saveBtn">حفظ المنتج</button><button id="cancelEditBtn" class="secondary hidden">إلغاء التعديل</button></div><div class="msg" id="addMsg"></div>
</div>
<div class="card" id="manageOptionsCard"><details><summary style="cursor:pointer;color:#0d9488;font-weight:600">⚙️ إدارة الاختيارات</summary><input id="manageOptionsSearch" placeholder="🔍 ابحث في الاختيارات..." style="margin-top:12px"><div id="manageOptionsWrap"></div></details></div>
</main>
<div id="scanModal" class="scan-modal hidden"><div class="scan-box"><button id="scanCloseX" class="scan-close-x">✕</button><p>وجّه الكاميرا على الباركود</p><video id="scanVideo"></video><p id="scanStatus"></p><button id="closeScanBtn" class="secondary full-width">إلغاء</button></div></div>
<script src="config.js"></script>
<script>
let currentUser=null,isAdmin=false,editingProductId=null,customOptions={drug_shape:[],drug_type:[],classification:[],supplier:[]};
const $=id=>document.getElementById(id);const esc=s=>{const d=document.createElement('div');d.textContent=s??'';return d.innerHTML};const num=v=>{const n=Number(String(v??'').replace(/,/g,'').trim());return Number.isFinite(n)?n:null};const pos=(v,f=1)=>{const n=num(v);return n!==null&&n>0?n:f};
const rules=[{keys:['قرص','أقراص','اقراص','برشام','كبسول','كبسولات','لبوس','تحاميل'],medium:'strip',finest:true,retail:true,allowed:['large','medium']},{keys:['فوار','كيس','أكياس','اكياس'],medium:'sachet',finest:false,retail:true,allowed:['medium','small']},{keys:['حقن','امبول','أمبول','ampoule','Ampoule','vial','Vial'],medium:'ampoule',finest:false,retail:true,allowed:['medium','small']}];
const labels={box:'علبة',strip:'شريط',piece:'قطعة',ampoule:'أمبولة',sachet:'كيس',vial:'فيال',syringe:'سرنجة',suppository:'لبوس',bottle:'زجاجة',tube:'أنبوبة',dropper:'قطّارة',pack:'عبوة',other:'أخرى'};
function rule(shape){return rules.find(r=>r.keys.some(k=>(shape||'').includes(k)))||{medium:'piece',finest:false,retail:false,allowed:['small']}}
function mediumUnit(){return rule($('p_shape').value).medium||'piece'}
function shapeOptions(){const type=$('p_drug_type').value;const keep=$('p_shape').value;const arr=customOptions.drug_shape.filter(o=>o.parent===type);$('p_shape').innerHTML=arr.map(o=>`<option value="${esc(o.value)}">${esc(o.value)}</option>`).join('')||'<option value="أخرى">أخرى</option>';if(arr.some(o=>o.value===keep))$('p_shape').value=keep;updateFields(true)}
async function loadOptions(){const {data,error}=await sb.from('custom_options').select('category,parent,value').order('value');if(error)throw error;customOptions={drug_shape:[],drug_type:[],classification:[],supplier:[]};(data||[]).forEach(o=>{if(customOptions[o.category])customOptions[o.category].push(o)});$('p_drug_type').innerHTML=customOptions.drug_type.map(o=>`<option value="${esc(o.value)}">${esc(o.value)}</option>`).join('');$('p_classification').innerHTML='<option value="">-- بدون --</option>'+customOptions.classification.map(o=>`<option value="${esc(o.value)}">${esc(o.value)}</option>`).join('');$('p_supplier').innerHTML='<option value="">-- بدون --</option>'+customOptions.supplier.map(o=>`<option value="${esc(o.value)}">${esc(o.value)}</option>`).join('');shapeOptions();renderOptions()}
function renderOptions(){if(!$('manageOptionsWrap'))return;const t=($('manageOptionsSearch').value||'').toLowerCase();const names={drug_shape:'الأشكال',drug_type:'الأنواع',classification:'التصنيفات',supplier:'الموردين'};$('manageOptionsWrap').innerHTML=Object.keys(names).map(cat=>{const a=customOptions[cat].filter(o=>!t||o.value.toLowerCase().includes(t));return `<div style="margin:12px 0"><b>${names[cat]}</b><div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px">${a.map(o=>`<span class="tag">${esc(o.value)}</span>`).join('')||'<small>لا يوجد</small>'}</div></div>`}).join('')}
async function addOption(cat,parent){const names={drug_shape:'الشكل',drug_type:'النوع',classification:'التصنيف',supplier:'المورد'};const v=prompt('اكتب '+names[cat]+' الجديد:');if(!v?.trim())return;const {error}=await sb.from('custom_options').insert({category:cat,parent:parent||null,value:v.trim()});if(error){alert(error.message);return}await loadOptions();if(cat==='drug_type')$('p_drug_type').value=v.trim();if(cat==='drug_shape')$('p_shape').value=v.trim();if(cat==='classification')$('p_classification').value=v.trim();if(cat==='supplier')$('p_supplier').value=v.trim();updateFields(true)}
$('addTypeBtn').onclick=()=>addOption('drug_type');$('addShapeBtn').onclick=()=>addOption('drug_shape',$('p_drug_type').value);$('addClassBtn').onclick=()=>addOption('classification');$('addSupplierBtn').onclick=()=>addOption('supplier');$('manageOptionsSearch').oninput=renderOptions;$('p_drug_type').onchange=shapeOptions;
function levels(){if($('p_retail_allowed').value!=='yes')return ['small'];return $('p_has_strip').value==='yes'?['large','medium','small']:['medium','small']}
function levelLabel(l){if(l==='large')return'علبة';if(l==='medium')return $('p_has_strip').value==='yes'?(labels[mediumUnit()]||'وحدة'):'علبة';return $('p_shape').value==='أخرى'?'وحدة فردية':'قطعة'}
function updateUnits(r,force){const ls=levels();if(ls.length<2){$('sellUnitsWrap').classList.add('hidden');$('sellUnitsBox').innerHTML='';return}$('sellUnitsWrap').classList.remove('hidden');const old=[...document.querySelectorAll('.sellUnitChk:checked')].map(x=>x.value);const chosen=old.length?old:(r?.sale_allowed_units||r?.allowed||ls);$('sellUnitsBox').innerHTML=ls.map(l=>`<label><input type="checkbox" class="sellUnitChk" value="${l}" ${chosen.includes(l)?'checked':''}> ${levelLabel(l)}</label>`).join('')}
function updateFields(force){const s=$('p_shape').value,rr=rule(s);$('other_shape_wrap').classList.toggle('hidden',s!=='أخرى');const retail=$('p_retail_allowed').value==='yes';if(!retail){$('has_strip_wrap').classList.add('hidden');$('field3_wrap').classList.add('hidden');$('field4_wrap').classList.add('hidden');$('leftover_medium_wrap').classList.add('hidden');$('leftover_small_wrap').classList.add('hidden');updateUnits(rr,force);return}$('has_strip_wrap').classList.remove('hidden');$('leftover_small_wrap').classList.remove('hidden');const fine=$('p_has_strip').value==='yes';if(fine){$('field3_wrap').classList.remove('hidden');$('field3_label').textContent='العلبة فيها كام '+(labels[mediumUnit()]||'وحدة')+'؟';$('field4_wrap').classList.remove('hidden');$('field4_label').textContent='الوحدة المتوسطة فيها كام قطعة؟';$('leftover_medium_wrap').classList.remove('hidden');$('leftover_medium_label').textContent='زيادة برّه العلب: كام '+(labels[mediumUnit()]||'وحدة')+'؟';$('leftover_small_label').textContent='زيادة فردية: كام قطعة؟'}else{$('field3_wrap').classList.add('hidden');$('leftover_medium_wrap').classList.add('hidden');$('field4_wrap').classList.remove('hidden');$('field4_label').textContent='العلبة فيها كام '+(labels[mediumUnit()]||'وحدة')+'؟';$('leftover_small_label').textContent='زيادة برّه العلب: كام '+(labels[mediumUnit()]||'وحدة')+'؟'}updateUnits(rr,force)}
$('p_shape').onchange=()=>{if(!editingProductId){const r=rule($('p_shape').value);$('p_retail_allowed').value=r.retail?'yes':'no';$('p_has_strip').value=r.finest?'yes':'no'}updateFields(true)};$('p_retail_allowed').onchange=()=>updateFields(true);$('p_has_strip').onchange=()=>updateFields(true);
function payload(){const retail=$('p_retail_allowed').value==='yes',fine=retail&&$('p_has_strip').value==='yes',f3=retail?pos($('p_field3').value):1,f4=retail?pos($('p_field4').value):1;const structure=retail?(fine?['large','medium','small']:['medium','small']):['small'];const allowed=structure.length<2?structure:[...document.querySelectorAll('.sellUnitChk:checked')].map(x=>x.value).filter(x=>structure.includes(x));if(structure.length>1&&!allowed.length)throw Error('حدد وحدة بيع واحدة على الأقل');const mu=mediumUnit();return {data:{name:$('p_name').value.trim(),name_en:$('p_name_en').value.trim()||null,drug_type:$('p_drug_type').value,shape:$('p_shape').value,other_note:$('p_shape').value==='أخرى'?$('p_other_shape_note').value.trim():null,classification:$('p_classification').value||null,supplier:$('p_supplier').value||null,active_ingredient:$('p_active_ingredient').value.trim()||null,concentration:$('p_concentration').value.trim()||null,retail_allowed:retail,unit_large:fine?'box':null,unit_large_to_medium:fine?f3:null,unit_medium:fine?mu:'box',unit_medium_to_small:f4,unit_small:fine?($('p_shape').value==='أخرى'?'other':'piece'):mu,expiry_date:$('p_expiry_date').value||null,min_stock_threshold:(num($('p_min_threshold').value)||0)*(fine?f3*f4:f4),default_sale_price:num($('p_box_price').value),qr_code:$('p_qr').value.trim()||null,sale_allowed_units:allowed},perBox:fine?f3*f4:f4,total:(num($('p_boxes_qty').value)||0)*(fine?f3*f4:f4)+(retail?(num($('p_leftover_medium').value)||0)*f4+(num($('p_leftover_small').value)||0):0)}}
async function loadEdit(id){const {data,error}=await sb.from('products').select('*,inventory(quantity_smallest_unit)').eq('id',id).single();if(error||!data){alert('تعذر تحميل المنتج');return}editingProductId=id;$('formTitle').textContent='✏️ تعديل: '+data.name;$('saveBtn').textContent='حفظ التعديل';$('cancelEditBtn').classList.remove('hidden');$('p_name').value=data.name||'';$('p_name_en').value=data.name_en||'';$('p_drug_type').value=data.drug_type||'';shapeOptions();$('p_shape').value=data.shape||'';$('p_classification').value=data.classification||'';$('p_supplier').value=data.supplier||'';$('p_active_ingredient').value=data.active_ingredient||'';$('p_concentration').value=data.concentration||'';$('p_retail_allowed').value=data.retail_allowed?'yes':'no';$('p_has_strip').value=data.unit_large?'yes':'no';$('p_other_shape_note').value=data.other_note||'';$('p_field3').value=Number(data.unit_large_to_medium)||1;$('p_field4').value=Number(data.unit_medium_to_small)||1;$('p_box_price').value=data.default_sale_price??'';$('p_expiry_date').value=data.expiry_date||'';$('p_qr').value=data.qr_code||'';const qty=Number(data.inventory?.[0]?.quantity_smallest_unit||0),per=data.unit_large?(Number(data.unit_large_to_medium)||1)*(Number(data.unit_medium_to_small)||1):(Number(data.unit_medium_to_small)||1);$('p_boxes_qty').value=Math.floor(qty/per);$('p_leftover_medium').value=data.unit_large?Math.floor((qty%per)/(Number(data.unit_medium_to_small)||1)):0;$('p_leftover_small').value=data.unit_large?(qty%per)% (Number(data.unit_medium_to_small)||1):qty%per;updateFields(true);$('extraBarcodesWrap').classList.remove('hidden');await loadExtra(id);window.scrollTo({top:0,behavior:'smooth'})}
async function loadExtra(id){const {data}=await sb.from('product_barcodes').select('id,barcode').eq('product_id',id).order('created_at');$('extraBarcodesList').innerHTML=(data||[]).map(x=>`<span class="tag">${esc(x.barcode)} <button type="button" onclick="removeExtra('${x.id}')">✕</button></span>`).join('')||'<small>لا توجد باركودات إضافية</small>'}
window.removeExtra=async id=>{if(!confirm('مسح الباركود؟'))return;await sb.from('product_barcodes').delete().eq('id',id);await loadExtra(editingProductId)};
$('addExtraBarcodeBtn').onclick=async()=>{if(!editingProductId)return;const v=$('p_extra_qr').value.trim();if(!v)return alert('اكتب الباركود');const {error}=await sb.from('product_barcodes').insert({product_id:editingProductId,barcode:v});if(error)return alert(error.message);$('p_extra_qr').value='';await loadExtra(editingProductId)};
$('saveBtn').onclick=async()=>{try{if(!$('p_name').value.trim())throw Error('لازم تكتب اسم المنتج');const {data:p,perBox,total}=payload();const btn=$('saveBtn');btn.disabled=true;btn.textContent='جاري الحفظ...';let id=editingProductId;if(id){const {error}=await sb.from('products').update(p).eq('id',id);if(error)throw error;const {data:iv,error:ie}=await sb.from('inventory').update({quantity_smallest_unit:total}).eq('product_id',id).select();if(ie)throw ie;if(!iv?.length)await sb.from('inventory').insert({product_id:id,quantity_smallest_unit:total})}else{p.created_by=currentUser.id;const {data:row,error:pe}=await sb.from('products').insert(p).select().single();if(pe)throw pe;id=row.id;const {error:ie}=await sb.from('inventory').insert({product_id:id,quantity_smallest_unit:total});if(ie){await sb.from('products').delete().eq('id',id);throw ie}}if(isAdmin&&$('p_purchase_price').value!=='')await sb.from('product_costs').upsert({product_id:id,purchase_price:num($('p_purchase_price').value),updated_by:currentUser.id});$('addMsg').textContent=editingProductId?'تم تعديل المنتج بنجاح ✅':'تم حفظ المنتج بنجاح ✅';$('addMsg').className='msg ok';if(!editingProductId)reset();else await loadEdit(id)}catch(e){$('addMsg').textContent='حصل خطأ: '+e.message;$('addMsg').className='msg error'}finally{$('saveBtn').disabled=false;$('saveBtn').textContent=editingProductId?'حفظ التعديل':'حفظ المنتج'}};
function reset(){editingProductId=null;$('formTitle').textContent='➕ إضافة منتج جديد';$('cancelEditBtn').classList.add('hidden');['p_name','p_name_en','p_active_ingredient','p_concentration','p_other_shape_note','p_box_price','p_expiry_date','p_qr'].forEach(id=>$(id).value='');$('p_boxes_qty').value=0;$('p_leftover_medium').value=0;$('p_leftover_small').value=0;$('p_min_threshold').value=0;$('p_retail_allowed').value='no';$('p_has_strip').value='no';shapeOptions();updateFields(true)}$('cancelEditBtn').onclick=reset;
async function startScan(){if(!window.BarcodeDetector){const s=document.createElement('script');s.src='zxing-lib.js';document.head.appendChild(s);await new Promise((res,rej)=>{s.onload=res;s.onerror=rej})}const m=$('scanModal'),v=$('scanVideo');m.classList.remove('hidden');$('scanStatus').textContent='جاري تشغيل الكاميرا...';if('BarcodeDetector' in window){try{const d=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','code_128','qr_code']});const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});v.srcObject=stream;await v.play();const loop=async()=>{if(m.classList.contains('hidden'))return;try{const b=await d.detect(v);if(b[0]){$('p_qr').value=b[0].rawValue;stopScan()}}catch(e){}requestAnimationFrame(loop)};loop();return}catch(e){}}if(window.ZXing){const r=new ZXing.BrowserMultiFormatReader();window._reader=r;await r.decodeFromVideoDevice(null,v,(res)=>{if(res){$('p_qr').value=res.getText();stopScan()}})}}function stopScan(){const m=$('scanModal'),v=$('scanVideo');if(v.srcObject){v.srcObject.getTracks().forEach(t=>t.stop());v.srcObject=null}if(window._reader){window._reader.reset();window._reader=null}m.classList.add('hidden')}$('scanBtn').onclick=startScan;$('closeScanBtn').onclick=stopScan;$('scanCloseX').onclick=stopScan;
$('logoutBtn').onclick=async()=>{await sb.auth.signOut();location.href='index.html'};
(async()=>{const a=await requireAuth();if(!a)return;if(!guardPageAccess(a.profile,'inventory'))return;currentUser=a.user;isAdmin=a.profile.role==='admin';$('userinfo').textContent=a.profile.full_name+' ('+(isAdmin?'أدمن':'موظف')+')';if(isAdmin)$('purchase_price_wrap').classList.remove('hidden');await loadOptions();const id=new URLSearchParams(location.search).get('id');if(id)await loadEdit(id);else updateFields(true)})();
</script></body></html>
