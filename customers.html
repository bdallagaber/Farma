<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>العملاء - نظام إدارة الصيدلية</title><script src="supabase-lib.js"></script><link rel="stylesheet" href="style.css">
<style>
.cust-toolbar{display:flex;align-items:center;gap:8px;margin:18px 0 14px;flex-wrap:wrap}.cust-search{flex:1;min-width:230px}.cust-search input{width:100%;height:44px;margin:0}
.summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}.summary-card{background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:13px 15px}.summary-label{font-size:11px;color:var(--text-muted);margin-bottom:4px}.summary-value{font-size:20px;font-weight:800;color:var(--primary-dark)}.summary-value.money{font-size:21px}
.cust-row{cursor:pointer;transition:background-color .16s ease,transform .16s ease}.cust-row:hover{background:var(--bg)}.cust-row:active{transform:scale(.998)}.debt-pos{color:var(--danger);font-weight:700}.debt-zero{color:var(--text-muted)}
.cust-modal{position:fixed;inset:0;background:rgba(15,23,27,.5);display:flex;align-items:flex-start;justify-content:center;z-index:1100;padding:20px;overflow-y:auto}.cust-paper{background:#fff;border-radius:10px;padding:24px;max-width:520px;width:100%;margin-top:20px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.cust-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;padding-bottom:12px;border-bottom:2px solid var(--border)}.cust-header h2{font-size:18px;color:var(--primary-dark)}.cust-close{width:32px;height:32px;border:0;background:transparent;color:var(--text-muted);font-size:22px;line-height:1;cursor:pointer;padding:0;margin:0}
.tabs{display:flex;gap:6px;margin-bottom:14px;border-bottom:1px solid var(--border)}.tab-btn{background:transparent;color:var(--text-muted);border:0;border-radius:0;padding:9px 4px;margin:0 8px 0 0;font-size:13px;font-weight:700;cursor:pointer;border-bottom:2px solid transparent}.tab-btn.active{color:var(--primary-dark);border-bottom-color:var(--primary)}
.tab-pane{display:none}.tab-pane.active{display:block}
.ledger-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--border);font-size:13px}.ledger-row:last-child{border-bottom:0}.ledger-note{color:var(--text-muted);font-size:11px;margin-top:2px}.ledger-amt.debt{color:var(--danger);font-weight:700}.ledger-amt.pay{color:var(--primary-dark);font-weight:700}
.balance-box{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:14px 16px;text-align:center;margin-bottom:14px}.balance-box .amount{font-size:24px;font-weight:800}.balance-box .amount.zero{color:var(--text-muted)}.balance-box .amount.pos{color:var(--danger)}
.purchase-row{padding:9px 0;border-bottom:1px solid var(--border);font-size:13px;display:flex;justify-content:space-between}.purchase-row:last-child{border-bottom:0}
.msg{margin-top:8px}
.followup-row{padding:10px 0;border-bottom:1px solid var(--border);font-size:13px}.followup-row:last-child{border-bottom:0}.followup-row.done{opacity:.55}.followup-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}.followup-type{font-weight:700}.followup-type.call{color:var(--primary-dark)}.followup-type.complaint{color:var(--danger)}.followup-type.chronic_medication{color:var(--warning)}.followup-type.note{color:var(--text)}.followup-meta{font-size:11px;color:var(--text-muted);margin-top:3px}.followup-actions{display:flex;gap:6px}.followup-actions button{padding:4px 9px;font-size:11px;margin:0}.followup-next{font-size:11px;font-weight:700;margin-top:4px}.followup-next.overdue{color:var(--danger)}.followup-next.soon{color:var(--warning)}
.followup-form{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:14px}.followup-form label{margin-top:0}
.badge-alert{display:inline-block;width:8px;height:8px;border-radius:50%;margin-left:6px}.badge-alert.overdue{background:var(--danger)}.badge-alert.soon{background:var(--warning)}
/* إصلاح نافذة العميل وتخطيط جدول العملاء على الهاتف */
.cust-modal{z-index:3000!important;isolation:isolate}.cust-modal:not(.hidden){animation:custFadeIn .16s ease-out}.cust-modal:not(.hidden) .cust-paper{animation:custSlideIn .2s ease-out}.tab-pane.active{animation:custPaneIn .16s ease-out}@keyframes custFadeIn{from{opacity:0}to{opacity:1}}@keyframes custSlideIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}@keyframes custPaneIn{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:translateY(0)}}.tab-btn{transition:color .15s ease,border-color .15s ease}
.cust-paper{max-height:calc(100dvh - 24px);overflow-y:auto;overscroll-behavior:contain}
.tab-btn,.tab-btn:hover,.tab-btn:focus,.tab-btn:active{outline:none;box-shadow:none;-webkit-tap-highlight-color:transparent}
.tab-btn.active{color:#4b5563!important;border-bottom-color:var(--primary)!important;box-shadow:none!important;background:transparent!important}.tab-btn:focus,.tab-btn:active{color:#4b5563!important;background:transparent!important;box-shadow:none!important;outline:none!important;border-bottom-color:var(--primary)!important}.tab-btn:hover{color:#4b5563!important;background:transparent!important;box-shadow:none!important;outline:none!important}.tab-btn{-webkit-tap-highlight-color:transparent}
@media(max-width:700px){
  .main-content{min-width:0;overflow-x:hidden}
  #customersWrap{width:100%;overflow-x:hidden}
  #customersWrap table{width:100%;min-width:0!important;table-layout:fixed;border-collapse:collapse}
  #customersWrap th,#customersWrap td{padding:9px 6px;font-size:12px;white-space:normal;overflow-wrap:anywhere;word-break:break-word;vertical-align:middle}
  #customersWrap th:first-child,#customersWrap td:first-child{width:42%}
  #customersWrap th:nth-child(2),#customersWrap td:nth-child(2){width:30%}
  #customersWrap th:nth-child(3),#customersWrap td:nth-child(3){width:23%;text-align:center}#customersWrap th:nth-child(4),#customersWrap td:nth-child(4){width:25%;text-align:center}.customer-actions{white-space:nowrap}.customer-actions button{margin:2px 1px}
  .cust-toolbar{gap:7px}
  .cust-search{min-width:100%;flex-basis:100%}
  .cust-toolbar select{flex:1;min-width:0;height:40px}
  .cust-toolbar button{flex:0 0 auto}
  .cust-modal{padding:12px;align-items:flex-start}
  .cust-paper{width:100%;max-width:none;margin:0;padding:16px;border-radius:12px}
  .cust-header{position:sticky;top:-16px;background:#fff;z-index:2;padding-top:4px}
  .tabs{overflow-x:auto;white-space:nowrap;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab-btn{flex:0 0 auto;padding:10px 6px;font-size:12px}
}
@media(prefers-reduced-motion:reduce){.cust-modal:not(.hidden),.cust-modal:not(.hidden) .cust-paper,.tab-pane.active{animation:none!important}.cust-row,.tab-btn{transition:none!important}}
</style></head>
<body class="has-sidebar">
<header><button id="menuToggle">☰</button><h1>📦 نظام إدارة الصيدلية</h1><div><span class="userinfo" id="userinfo"></span><button id="logoutBtn" style="margin-right:8px">خروج</button></div></header>
<nav><a href="inventory.html">المخزون</a><a href="sales.html">المبيعات</a><a href="invoices.html">🧾 الفواتير</a><a href="customers.html" class="active">👥 العملاء</a><a href="shortages.html">النواقص</a><a href="expenses.html">المصروفات</a><a href="profit.html">الأرباح</a><a href="search.html">🔍 بحث الأدوية</a><a href="users.html">الإعدادات</a></nav><div id="sidebarOverlay" class="sidebar-overlay"></div>
<div class="main-content"><div class="card"><h2>👥 العملاء</h2>
<div class="cust-toolbar"><div class="cust-search"><input id="searchBox" type="text" placeholder="ابحث بالاسم أو التليفون أو واتساب..."></div><select id="customerFilter"><option value="all">كل العملاء النشطين</option><option value="inactive">العملاء المؤرشفون</option><option value="debt">عليهم مديونية</option><option value="vip">VIP</option><option value="overdue">متابعة متأخرة</option></select><button type="button" id="addCustomerBtn">+ عميل جديد</button></div>
<div class="summary-grid"><div class="summary-card"><div class="summary-label">عدد العملاء</div><div class="summary-value" id="custCount">0</div></div><div class="summary-card"><div class="summary-label">إجمالي المديونية</div><div class="summary-value money" id="totalDebt">0.00 ج.م</div></div><div class="summary-card"><div class="summary-label">متابعات اليوم</div><div class="summary-value" id="todayFollowups">0</div></div><div class="summary-card"><div class="summary-label">أعلى مديونية</div><div class="summary-value money" id="topDebt">0.00 ج.م</div></div></div>
<div id="customersWrap"><p class="loading">جاري التحميل...</p></div><details class="card collapsible" style="margin-top:14px"><summary><h2>📊 تقارير CRM</h2></summary><div id="crmReports"><p class="loading">جاري إعداد التقارير...</p></div></details>
</div></div>
<div id="customerModal" class="cust-modal hidden"><div class="cust-paper" id="customerPaperContent"></div></div>
<script src="config.js"></script><script>
let currentUser,customersCache=[],salesCache=[],ledgerCache=[],followupsCache=[],productsCache=[],invoicesCache=[],employeesCache=[];
const FOLLOWUP_LABELS={call:'📞 مكالمة',complaint:'⚠️ شكوى',note:'📝 ملاحظة',chronic_medication:'💊 دواء مزمن'};
function todayStr(){return new Date().toLocaleDateString('en-CA',{timeZone:'Africa/Cairo'})}
function followupUrgency(d){if(!d)return'';if(d<todayStr())return'overdue';const in7=new Date();in7.setDate(in7.getDate()+7);if(d<=in7.toLocaleDateString('en-CA'))return'soon';return''}
(async()=>{const auth=await requireAuth();if(!auth)return;if(!guardPageAccess(auth.profile,'customers'))return;currentUser=auth.user;document.getElementById('userinfo').textContent=auth.profile.full_name+' ('+(auth.profile.role==='admin'?'أدمن':'موظف')+')';await loadCustomers()})();
document.getElementById('logoutBtn').addEventListener('click',async()=>{await sb.auth.signOut();location.href='index.html'});
function esc(s){const d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML}
function dFormat(v){return new Date(v).toLocaleString('ar-EG',{timeZone:'Africa/Cairo',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})}

async function loadCustomers(){
  const wrap=document.getElementById('customersWrap');
  const [{data:custs,error},{data:ledger},{data:sales},{data:followups},{data:products},{data:invoices},{data:employees}]=await Promise.all([
    sb.from('customers').select('id,name,phone,whatsapp,area,address,location,notes,category,status,credit_limit,created_at').order('name'),
    sb.from('customer_ledger').select('id,customer_id,amount,note,created_at,created_by,profiles(full_name)'),
    sb.from('sales').select('id,sale_group_id,customer_id,product_id,quantity,unit_sold,sale_price,created_at,products(name)').not('customer_id','is',null).order('created_at',{ascending:false}),
    sb.from('customer_followups').select('id,customer_id,followup_type,product_id,note,next_followup_date,status,created_at,created_by,products(name),profiles(full_name)').order('created_at',{ascending:false}),
    sb.from('products').select('id,name').order('name'),sb.from('invoices').select('sale_group_id,invoice_number,customer_id,total,paid_amount,remaining_amount,payment_status,created_at').order('created_at',{ascending:false}),sb.from('profiles').select('id,full_name').order('full_name')
  ]);
  if(error){wrap.innerHTML='<p style="color:#dc2626">تعذّر تحميل العملاء: '+esc(error.message)+'</p>';return}
  ledgerCache=ledger||[];salesCache=sales||[];followupsCache=followups||[];productsCache=products||[];invoicesCache=invoices||[];employeesCache=employees||[];
  customersCache=(custs||[]).map(c=>{
    const bal=ledgerCache.filter(l=>l.customer_id===c.id).reduce((s,l)=>s+Number(l.amount||0),0);
    return {...c,balance:bal};
  });
  renderCustomers();renderCrmReports();
}
function balanceFor(id){const c=customersCache.find(x=>x.id===id);return c?c.balance:0}
function renderCrmReports(){const el=document.getElementById('crmReports');if(!el)return;const by={};salesCache.forEach(x=>{if(!x.customer_id)return;const c=customersCache.find(y=>y.id===x.customer_id);if(!c)return;if(!by[c.id])by[c.id]={name:c.name,total:0,count:0,balance:c.balance||0,last:x.created_at};by[c.id].total+=Number(x.sale_price||0)*Number(x.quantity||1);by[c.id].count++;if(new Date(x.created_at)>new Date(by[c.id].last))by[c.id].last=x.created_at});const rows=Object.values(by);const top=[...rows].sort((a,b)=>b.total-a.total).slice(0,10);const debt=[...customersCache].filter(c=>c.balance>0).sort((a,b)=>b.balance-a.balance).slice(0,10);const dormant=rows.filter(r=>(Date.now()-new Date(r.last).getTime())>30*86400000).sort((a,b)=>new Date(a.last)-new Date(b.last)).slice(0,10);const overdue=followupsCache.filter(f=>f.status==='open'&&f.next_followup_date&&f.next_followup_date<todayStr());el.innerHTML='<div class="summary-grid"><div class="summary-card"><div class="summary-label">متابعات متأخرة</div><div class="summary-value">'+overdue.length+'</div></div><div class="summary-card"><div class="summary-label">عملاء بمديونية</div><div class="summary-value">'+customersCache.filter(c=>c.balance>0).length+'</div></div></div><h3>الأكثر شراءً</h3>'+reportRows(top,r=>r.name+' — '+r.total.toFixed(2)+' ج.م')+'<h3>أعلى المديونيات</h3>'+reportRows(debt,c=>c.name+' — '+Number(c.balance||0).toFixed(2)+' ج.م')+'<h3>لم يشتروا منذ أكثر من 30 يومًا</h3>'+reportRows(dormant,r=>r.name+' — آخر شراء '+dFormat(r.last));}
function reportRows(rows,fn){return rows.length?'<div>'+rows.map(r=>'<div class="purchase-row">'+esc(fn(r))+'</div>').join('')+'</div>':'<p class="loading">لا توجد بيانات</p>'}
function renderCustomers(){
  const wrap=document.getElementById('customersWrap');
  const term=document.getElementById('searchBox').value.trim().toLowerCase();
  const filter=document.getElementById('customerFilter').value;const filtered=customersCache.filter(c=>{if(filter==='inactive'&&c.status!=='inactive')return false;if(filter!=='inactive'&&c.status==='inactive')return false;const hay=((c.name||'')+' '+(c.phone||'')+' '+(c.whatsapp||'')).toLowerCase();if(term&&!hay.includes(term))return false;if(filter==='debt'&&c.balance<=0)return false;if(filter==='vip'&&c.category!=='vip')return false;if(filter==='overdue'&&!followupsCache.some(f=>f.customer_id===c.id&&f.status==='open'&&f.next_followup_date<todayStr()))return false;return true});
  document.getElementById('custCount').textContent=customersCache.length.toLocaleString('ar-EG');
  const totalDebt=customersCache.reduce((s,c)=>s+Math.max(c.balance,0),0);
  document.getElementById('totalDebt').textContent=totalDebt.toLocaleString('ar-EG',{minimumFractionDigits:2,maximumFractionDigits:2})+' ج.م';document.getElementById('todayFollowups').textContent=followupsCache.filter(f=>f.status==='open'&&f.next_followup_date===todayStr()).length.toLocaleString('ar-EG');document.getElementById('topDebt').textContent=Math.max(0,...customersCache.map(c=>Number(c.balance||0))).toLocaleString('ar-EG',{minimumFractionDigits:2,maximumFractionDigits:2})+' ج.م';
  if(!filtered.length){wrap.innerHTML='<p class="loading">مفيش عملاء مطابقين</p>';return}
  let h='<table><thead><tr><th>الاسم</th><th>التليفون</th><th>الرصيد</th><th>إجراءات</th></tr></thead><tbody>';
  filtered.sort((a,b)=>b.balance-a.balance).forEach(c=>{
    const openFollowups=followupsCache.filter(f=>f.customer_id===c.id&&f.status==='open'&&f.next_followup_date);
    let urgency='';
    openFollowups.forEach(f=>{const u=followupUrgency(f.next_followup_date);if(u==='overdue')urgency='overdue';else if(u==='soon'&&urgency!=='overdue')urgency='soon'});
    const alertDot=urgency?'<span class="badge-alert '+urgency+'" title="'+(urgency==='overdue'?'متابعة متأخرة':'متابعة قريبة')+'"></span>':'';
    h+='<tr class="cust-row" data-id="'+esc(c.id)+'"><td>'+esc(c.name)+alertDot+'</td><td>'+esc(c.phone||'—')+'</td><td class="'+(c.balance>0?'debt-pos':'debt-zero')+'">'+c.balance.toFixed(2)+' ج</td><td class="customer-actions"><button type="button" class="secondary small customer-edit-btn" data-id="'+esc(c.id)+'">تعديل</button><button type="button" class="danger small customer-delete-btn" data-id="'+esc(c.id)+'">حذف</button></td></tr>';
  });
  h+='</tbody></table>';
  wrap.innerHTML=h;
  wrap.querySelectorAll('.cust-row').forEach(r=>r.addEventListener('click',e=>{if(e.target.closest('button'))return;openCustomer(r.dataset.id)}));wrap.querySelectorAll('.customer-edit-btn').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();openCustomer(b.dataset.id);const c=customersCache.find(x=>x.id===b.dataset.id);if(c)renderCustomerModal(c,'info',true)}));wrap.querySelectorAll('.customer-delete-btn').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();const c=customersCache.find(x=>x.id===b.dataset.id);if(c)deleteCustomer(c)}));
}
document.getElementById('searchBox').addEventListener('input',renderCustomers);document.getElementById('customerFilter').addEventListener('change',renderCustomers);

function openCustomer(id){
  const c=customersCache.find(x=>x.id===id);
  if(!c)return;
  renderCustomerModal(c,'info');
  document.getElementById('customerModal').classList.remove('hidden');
}
function closeCustomer(){document.getElementById('customerModal').classList.add('hidden')}
document.getElementById('customerModal').addEventListener('click',e=>{if(e.target.id==='customerModal')closeCustomer()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeCustomer()});

function renderCustomerModal(c,activeTab,editMode=false){
  const p=document.getElementById('customerPaperContent');
  p.innerHTML=
    '<div class="cust-header"><h2>'+esc(c.name)+'</h2><button type="button" class="cust-close" id="custClose">×</button></div>'+
    '<div class="tabs">'+
      '<button type="button" class="tab-btn" data-tab="info">البيانات</button>'+
      '<button type="button" class="tab-btn" data-tab="ledger">الرصيد</button>'+
      '<button type="button" class="tab-btn" data-tab="history">المشتريات</button>'+
      '<button type="button" class="tab-btn" data-tab="followups">المتابعات</button>'+ '<button type="button" class="tab-btn" data-tab="timeline">النشاط</button>'+
    '</div>'+
    '<div class="tab-pane" id="paneInfo"></div>'+
    '<div class="tab-pane" id="paneLedger"></div>'+
    '<div class="tab-pane" id="paneHistory"></div>'+
    '<div class="tab-pane" id="paneFollowups"></div><div class="tab-pane" id="paneTimeline"></div>';
  document.getElementById('custClose').onclick=closeCustomer;
  p.querySelectorAll('.tab-btn').forEach(b=>b.addEventListener('click',()=>{switchTab(c,b.dataset.tab);b.blur()}));
  renderInfoTab(c,editMode);
  renderLedgerTab(c);
  renderHistoryTab(c);
  renderFollowupsTab(c);renderTimelineTab(c);
  switchTab(c,activeTab||'info');
}
function switchTab(c,tab){
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));
  document.getElementById('paneInfo').classList.toggle('active',tab==='info');
  document.getElementById('paneLedger').classList.toggle('active',tab==='ledger');
  document.getElementById('paneHistory').classList.toggle('active',tab==='history');
  document.getElementById('paneFollowups').classList.toggle('active',tab==='followups');document.getElementById('paneTimeline').classList.toggle('active',tab==='timeline');
}

function renderInfoTab(c,editable=false){
  const pane=document.getElementById('paneInfo');
  pane.innerHTML=
    '<div class="summary-grid"><div class="summary-card"><div class="summary-label">الرصيد المستحق</div><div class="summary-value money">'+Number(c.balance||0).toFixed(2)+' ج.م</div></div><div class="summary-card"><div class="summary-label">عدد المشتريات</div><div class="summary-value">'+salesCache.filter(x=>x.customer_id===c.id).length+'</div></div></div>'+'<label>الاسم</label><input id="editName" type="text" value="'+esc(c.name)+'">'+
    '<label>التليفون</label><input id="editPhone" type="text" value="'+esc(c.phone||'')+'">'+
    '<label>واتساب</label><input id="editWhatsapp" type="text" value="'+esc(c.whatsapp||'')+'">'+
    '<label>المنطقة</label><input id="editArea" type="text" value="'+esc(c.area||'')+'">'+
    '<label>العنوان</label><input id="editAddress" type="text" value="'+esc(c.address||'')+'">'+ '<label>اللوكيشن</label><input id="editLocation" type="text" value="'+esc(c.location||'')+'" placeholder="رابط Google Maps أو وصف المكان">'+
    '<label>التصنيف</label><select id="editCategory"><option value="regular">عادي</option><option value="vip">VIP</option><option value="clinic">عيادة / شركة</option><option value="debtor">آجل</option></select>'+
    '<label>الحالة</label><select id="editStatus"><option value="active">نشط</option><option value="inactive">غير نشط</option><option value="blocked">موقوف</option></select>'+
    '<label>ملاحظات</label><textarea id="editNotes" rows="2">'+esc(c.notes||'')+'</textarea>'+
    '<label>حد الائتمان (اختياري)</label><input id="editCreditLimit" type="number" step="0.01" value="'+(c.credit_limit!=null?c.credit_limit:'')+'">'+
    '<div class="msg" id="infoMsg"></div>'+
    (editable?'<button type="button" id="saveInfoBtn">💾 حفظ التعديل</button>':'');
  document.getElementById('editCategory').value=c.category||'regular';document.getElementById('editStatus').value=c.status||'active';pane.querySelectorAll('input,select,textarea').forEach(f=>f.disabled=!editable);if(editable)document.getElementById('saveInfoBtn').onclick=()=>saveCustomerInfo(c);
}
async function saveCustomerInfo(c){
  const msg=document.getElementById('infoMsg');
  const name=document.getElementById('editName').value.trim();
  const phone=document.getElementById('editPhone').value.trim()||null;
  const creditLimitVal=document.getElementById('editCreditLimit').value;
  const creditLimit=creditLimitVal===''?null:parseFloat(creditLimitVal);
  const whatsapp=document.getElementById('editWhatsapp').value.trim()||null;const location=document.getElementById('editLocation').value.trim()||null;const area=document.getElementById('editArea').value.trim()||null;const address=document.getElementById('editAddress').value.trim()||null;const category=document.getElementById('editCategory').value||'regular';const status=document.getElementById('editStatus').value||'active';const notes=document.getElementById('editNotes').value.trim()||null;
  if(!name){msg.textContent='اسم العميل مطلوب';msg.className='msg error';return}
  msg.textContent='جاري الحفظ...';msg.className='msg';
  const{error}=await sb.from('customers').update({name,phone,whatsapp,area,address,location,category,status,notes,credit_limit:creditLimit}).eq('id',c.id);
  if(error){msg.textContent='حصل خطأ: '+esc(error.message);msg.className='msg error';return}
  msg.textContent='تم الحفظ بنجاح';msg.className='msg ok';
  await loadCustomers();
  const updated=customersCache.find(x=>x.id===c.id);
  if(updated)renderCustomerModal(updated,'info');
}

async function deleteCustomer(c){
  if(!confirm('هل أنت متأكد من حذف العميل «'+c.name+'»؟\nإذا كان مرتبطًا بفواتير أو حركات مالية سيتم أرشفته كغير نشط للحفاظ على السجل.'))return;
  const buttons=[...document.querySelectorAll('.customer-delete-btn')].filter(b=>b.dataset.id===c.id);
  buttons.forEach(b=>{b.disabled=true;b.textContent='جاري الحذف...'});
  let result=await sb.from('customers').delete().eq('id',c.id);
  if(result.error){
    const archive=await sb.from('customers').update({status:'inactive'}).eq('id',c.id);
    if(archive.error){
      buttons.forEach(b=>{b.disabled=false;b.textContent='حذف'});
      alert('تعذر حذف أو أرشفة العميل: '+archive.error.message);
      return;
    }
    alert('العميل مرتبط بسجل مالي، لذلك تم أرشفته كغير نشط بدل حذفه حفاظًا على الفواتير والحركات المالية.');
  }
  closeCustomer();
  await loadCustomers();
}

function renderLedgerTab(c){
  const pane=document.getElementById('paneLedger');
  const entries=ledgerCache.filter(l=>l.customer_id===c.id).sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));
  const balance=c.balance;
  let h='<div class="balance-box"><div style="font-size:11px;color:var(--text-muted)">الرصيد الحالي (المديونية)</div><div class="amount '+(balance>0?'pos':'zero')+'">'+balance.toFixed(2)+' ج.م</div></div>';
  const openInvoices=invoicesCache.filter(i=>i.customer_id===c.id&&Number(i.remaining_amount||0)>0);h+='<div style="display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap"><select id="paymentInvoice" style="margin:0;flex:1"><option value="">دفعة عامة على الحساب</option>'+openInvoices.map(i=>'<option value="'+esc(i.sale_group_id)+'">فاتورة #'+esc(i.invoice_number)+' — متبقي '+Number(i.remaining_amount||0).toFixed(2)+' ج</option>').join('')+'</select><input id="paymentAmount" type="number" step="0.01" min="0" placeholder="قيمة الدفعة" style="margin:0;flex:1"><button type="button" id="addPaymentBtn" style="white-space:nowrap">تسجيل دفعة</button></div>';
  h+='<div class="msg" id="ledgerMsg"></div>';
  if(!entries.length){
    h+='<p class="loading">مفيش حركات في الرصيد</p>';
  }else{
    entries.forEach(l=>{
      const amt=Number(l.amount||0);
      h+='<div class="ledger-row"><div><div>'+esc(l.note||(amt>0?'بيع آجل':'دفعة'))+'</div><div class="ledger-note">'+dFormat(l.created_at)+(l.profiles?' — '+esc(l.profiles.full_name):'')+'</div></div><div class="ledger-amt '+(amt>0?'debt':'pay')+'">'+(amt>0?'+':'')+amt.toFixed(2)+' ج</div></div>';
    });
  }
  pane.innerHTML=h;
  document.getElementById('addPaymentBtn').onclick=()=>addPayment(c);
}
async function addPayment(c){
  const msg=document.getElementById('ledgerMsg');
  const input=document.getElementById('paymentAmount');const saleGroupId=document.getElementById('paymentInvoice').value||null;
  const val=parseFloat(input.value);
  if(!val||val<=0){msg.textContent='ادخل قيمة دفعة صحيحة';msg.className='msg error';return}
  msg.textContent='جاري الحفظ...';msg.className='msg';
  const selectedInvoice=invoicesCache.find(i=>i.sale_group_id===saleGroupId);if(selectedInvoice&&val>Number(selectedInvoice.remaining_amount||0)){msg.textContent='قيمة الدفعة أكبر من المتبقي في الفاتورة';msg.className='msg error';return}const{error}=await sb.from('customer_ledger').insert({customer_id:c.id,sale_group_id:saleGroupId,amount:-val,entry_type:'payment',note:saleGroupId?'دفعة على فاتورة #'+(selectedInvoice?.invoice_number||''):'دفعة من العميل',created_by:currentUser.id});
  if(error){msg.textContent='حصل خطأ: '+esc(error.message);msg.className='msg error';return}if(selectedInvoice){const newPaid=Number(selectedInvoice.paid_amount||0)+val;const newRemaining=Math.max(0,Number(selectedInvoice.total||0)-newPaid);const {error:updateError}=await sb.from('invoices').update({paid_amount:newPaid,remaining_amount:newRemaining,payment_status:newRemaining===0?'paid':'partial',payment_updated_at:new Date().toISOString()}).eq('sale_group_id',saleGroupId);if(updateError){msg.textContent='تم تسجيل الدفعة لكن تعذر تحديث الفاتورة: '+esc(updateError.message);msg.className='msg error';return}}
  await loadCustomers();
  const updated=customersCache.find(x=>x.id===c.id);
  if(updated){renderCustomerModal(updated,'ledger')}
}

function renderHistoryTab(c){
  const pane=document.getElementById('paneHistory');
  const rows=salesCache.filter(s=>s.customer_id===c.id);
  const groups={};
  rows.forEach(s=>{
    const key=s.sale_group_id||('single-'+s.id);
    if(!groups[key]){const inv=invoicesCache.find(i=>i.sale_group_id===s.sale_group_id);groups[key]={key,created_at:s.created_at,items:0,total:inv?.total!=null?Number(inv.total):0,invoice:inv};}
    groups[key].items+=1;
    if(!groups[key].invoice)groups[key].total+=Number(s.sale_price||0);
  });
  const list=Object.values(groups).sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));
  let h='';
  if(!list.length){
    h='<p class="loading">مفيش مشتريات مسجلة لهذا العميل</p>';
  }else{
    list.forEach(g=>{
      h+='<div class="purchase-row"><span><strong>فاتورة #'+esc(g.invoice?.invoice_number||'—')+'</strong><br>'+dFormat(g.created_at)+' — '+g.items+' صنف</span><span>'+g.total.toFixed(2)+' ج<br><small>متبقي '+Number(g.invoice?.remaining_amount||0).toFixed(2)+' ج</small></span></div>';
    });
  }
  pane.innerHTML=h;
}

function renderFollowupsTab(c){
  const pane=document.getElementById('paneFollowups');
  const items=followupsCache.filter(f=>f.customer_id===c.id).sort((a,b)=>{
    if(a.status!==b.status)return a.status==='open'?-1:1;
    return new Date(b.created_at)-new Date(a.created_at);
  });
  const productOptions='<option value="">-- اختر الصنف --</option>'+productsCache.map(p=>'<option value="'+esc(p.id)+'">'+esc(p.name)+'</option>').join('');
  let h='<div class="followup-form">'+
    '<label>نوع المتابعة</label><select id="fuType">'+
      '<option value="call">📞 مكالمة</option>'+
      '<option value="complaint">⚠️ شكوى</option>'+
      '<option value="note">📝 ملاحظة</option>'+
      '<option value="chronic_medication">💊 دواء مزمن (تذكير دوري)</option>'+
    '</select>'+
    '<div id="fuProductWrap" class="hidden"><label>الأدوية المرتبطة (يمكن اختيار أكثر من دواء)</label><select id="fuProducts" multiple size="4">'+productOptions.replace('<option value="">-- اختر الصنف --</option>','')+'</select></div>'+
    '<label>ملاحظة</label><textarea id="fuNote" rows="2" placeholder="تفاصيل المتابعة..."></textarea><label>النتيجة (اختياري)</label><textarea id="fuOutcome" rows="2" placeholder="مثال: العميل لم يرد / سيحضر غدًا"></textarea>'+
    '<label>تاريخ المتابعة القادمة (اختياري)</label><input id="fuNextDate" type="date">'+
    '<div class="msg" id="fuMsg"></div>'+
    '<button type="button" id="addFollowupBtn">+ إضافة متابعة</button>'+
  '</div>';
  if(!items.length){
    h+='<p class="loading">مفيش متابعات مسجلة لهذا العميل</p>';
  }else{
    items.forEach(f=>{
      const urgency=f.status==='open'?followupUrgency(f.next_followup_date):'';
      h+='<div class="followup-row'+(f.status==='done'?' done':'')+'">'+
        '<div class="followup-top"><div>'+
          '<span class="followup-type '+esc(f.followup_type)+'">'+(FOLLOWUP_LABELS[f.followup_type]||f.followup_type)+'</span>'+
          (f.products?' — '+esc(f.products.name):'')+
          '<div class="followup-meta">'+dFormat(f.created_at)+(f.profiles?' — '+esc(f.profiles.full_name):'')+(f.assigned_to?' — مسؤول: '+esc((employeesCache.find(e=>e.id===f.assigned_to)||{}).full_name||'غير معروف'):'')+'</div>'+
          (f.note?'<div style="margin-top:4px">'+esc(f.note)+'</div>':'')+
          (f.next_followup_date?'<div class="followup-next '+urgency+'">📅 المتابعة القادمة: '+esc(f.next_followup_date)+(urgency==='overdue'?' (متأخرة)':urgency==='soon'?' (قريبة)':'')+'</div>':'')+
        '</div>'+
        '<div class="followup-actions">'+
          (f.status==='open'?'<button type="button" class="secondary fu-postpone-btn" data-id="'+esc(f.id)+'">تأجيل</button><button type="button" class="secondary fu-done-btn" data-id="'+esc(f.id)+'">تمت</button>':'')+
          '<button type="button" class="danger fu-del-btn" data-id="'+esc(f.id)+'">حذف</button>'+
        '</div></div>'+
      '</div>';
    });
  }
  pane.innerHTML=h;
  document.getElementById('fuType').addEventListener('change',e=>{
    document.getElementById('fuProductWrap').classList.toggle('hidden',e.target.value!=='chronic_medication');
  });
  document.getElementById('addFollowupBtn').onclick=()=>addFollowup(c);
  pane.querySelectorAll('.fu-done-btn').forEach(b=>b.addEventListener('click',()=>markFollowupDone(c,b.dataset.id)));pane.querySelectorAll('.fu-postpone-btn').forEach(b=>b.addEventListener('click',()=>postponeFollowup(c,b.dataset.id)));
  pane.querySelectorAll('.fu-del-btn').forEach(b=>b.addEventListener('click',()=>deleteFollowup(c,b.dataset.id)));
}
async function addFollowup(c){
  const msg=document.getElementById('fuMsg');
  const type=document.getElementById('fuType').value;
  const productIds=type==='chronic_medication'?Array.from(document.getElementById('fuProducts').selectedOptions).map(o=>o.value):[];const productId=productIds[0]||null;const assignedTo=document.getElementById('fuAssignee').value||null;const outcome=document.getElementById('fuOutcome').value.trim()||null;
  const note=document.getElementById('fuNote').value.trim()||null;
  const nextDate=document.getElementById('fuNextDate').value||null;
  if(!note&&!nextDate){msg.textContent='اكتب ملاحظة أو حدد تاريخ متابعة قادمة على الأقل';msg.className='msg error';return}
  msg.textContent='جاري الحفظ...';msg.className='msg';
  const{error}=await sb.from('customer_followups').insert({customer_id:c.id,followup_type:type,product_id:productId,note,outcome,assigned_to:assignedTo,next_followup_date:nextDate,created_by:currentUser.id}).select('id').single();
  if(error){msg.textContent='حصل خطأ: '+esc(error.message);msg.className='msg error';return}
  await loadCustomers();
  const updated=customersCache.find(x=>x.id===c.id);
  if(updated)renderCustomerModal(updated,'followups');
}
async function postponeFollowup(c,id){const next=prompt('اكتب تاريخ المتابعة الجديد بصيغة YYYY-MM-DD');if(!next||!/\d{4}-\d{2}-\d{2}/.test(next))return;await sb.from('customer_followups').update({status:'open',next_followup_date:next}).eq('id',id);await loadCustomers();const updated=customersCache.find(x=>x.id===c.id);if(updated)renderCustomerModal(updated,'followups')}
async function markFollowupDone(c,id){
  const outcome=prompt('اكتب نتيجة المتابعة (اختياري)')||null;await sb.from('customer_followups').update({status:'done',outcome,completed_at:new Date().toISOString(),completed_by:currentUser.id}).eq('id',id);
  await loadCustomers();
  const updated=customersCache.find(x=>x.id===c.id);
  if(updated)renderCustomerModal(updated,'followups');
}
async function deleteFollowup(c,id){
  await sb.from('customer_followups').delete().eq('id',id);
  await loadCustomers();
  const updated=customersCache.find(x=>x.id===c.id);
  if(updated)renderCustomerModal(updated,'followups');
}

function renderTimelineTab(c){const pane=document.getElementById('paneTimeline');const events=[];salesCache.filter(x=>x.customer_id===c.id).forEach(x=>events.push({date:x.created_at,title:'شراء '+(x.products?.name||'منتج'),detail:'كمية '+x.quantity+' — '+Number(x.sale_price||0).toFixed(2)+' ج.م'}));ledgerCache.filter(x=>x.customer_id===c.id).forEach(x=>events.push({date:x.created_at,title:Number(x.amount||0)<0?'تسجيل دفعة':'تسجيل مديونية',detail:x.note||''}));followupsCache.filter(x=>x.customer_id===c.id).forEach(x=>events.push({date:x.created_at,title:'متابعة: '+(FOLLOWUP_LABELS[x.followup_type]||x.followup_type),detail:x.outcome||x.note||'—'}));events.sort((a,b)=>new Date(b.date)-new Date(a.date));pane.innerHTML=events.length?events.slice(0,100).map(e=>'<div class="followup-row"><div class="followup-top"><strong>'+esc(e.title)+'</strong><span class="followup-meta">'+dFormat(e.date)+'</span></div><div class="followup-meta">'+esc(e.detail)+'</div></div>').join(''):'<p class="loading">لا يوجد نشاط مسجل بعد</p>'}

    '<label>التصنيف</label><select id="newCategory"><option value="regular">عادي</option><option value="vip">VIP</option><option value="clinic">عيادة / شركة</option><option value="debtor">آجل</option></select>'+
    '<label>ملاحظات</label><textarea id="newNotes" rows="2"></textarea>'+
    '<label>حد الائتمان (اختياري)</label><input id="newCreditLimit" type="number" step="0.01">'+
    '<div class="msg" id="newMsg"></div>'+
    '<button type="button" id="saveNewBtn">💾 حفظ</button>';
  document.getElementById('custClose').onclick=closeCustomer;
  document.getElementById('saveNewBtn').onclick=async()=>{
    const msg=document.getElementById('newMsg');
    const name=document.getElementById('newName').value.trim();
    const phone=document.getElementById('newPhone').value.trim()||null;const location=document.getElementById('newLocation').value.trim()||null;const whatsapp=document.getElementById('newWhatsapp').value.trim()||null;const area=document.getElementById('newArea').value.trim()||null;const address=document.getElementById('newAddress').value.trim()||null;const category=document.getElementById('newCategory').value||'regular';const notes=document.getElementById('newNotes').value.trim()||null;
    const clVal=document.getElementById('newCreditLimit').value;
    const creditLimit=clVal===''?null:parseFloat(clVal);
    if(!name){msg.textContent='اسم العميل مطلوب';msg.className='msg error';return}

    const{error}=await sb.from('customers').insert({name,phone,whatsapp,area,address,location,category,notes,credit_limit:creditLimit});
    if(error){msg.textContent='حصل خطأ: '+esc(error.message);msg.className='msg error';return}
    closeCustomer();

</script></body></html>
