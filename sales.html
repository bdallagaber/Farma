<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المبيعات - نظام إدارة الصيدلية</title>
<script src="supabase-lib.js"></script>
<script src="zxing-lib.js"></script>
<script src="xlsx-lib.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: #0f1b16;
    color: #eef2ef;
    padding: 16px;
    padding-bottom: 60px;
  }
  header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 20px; flex-wrap: wrap; gap: 10px;
  }
  header h1 { font-size: 18px; color: #6fcf97; }
  header .userinfo { font-size: 12px; color: #9fb3a8; }
  nav { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
  nav a {
    padding: 8px 14px; background: #16261e; border: 1px solid #23392c;
    border-radius: 8px; color: #eef2ef; text-decoration: none; font-size: 13px;
  }
  nav a.active { background: #6fcf97; color: #0f1b16; font-weight: 600; }
  nav a.disabled { opacity: 0.4; pointer-events: none; }
  .card {
    background: #16261e; border: 1px solid #23392c; border-radius: 14px;
    padding: 20px; margin-bottom: 20px;
  }
  .card h2 { font-size: 16px; margin-bottom: 16px; color: #6fcf97; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  label { display: block; font-size: 12px; color: #b7c9be; margin-bottom: 4px; }
  input, select {
    width: 100%; padding: 10px 12px; background: #0f1b16;
    border: 1px solid #2a4536; border-radius: 8px; color: #eef2ef;
    font-size: 14px; margin-bottom: 12px;
  }
  input:focus, select:focus { outline: none; border-color: #6fcf97; }
  button {
    padding: 12px 20px; background: #6fcf97; color: #0f1b16;
    border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  button.secondary { background: #23392c; color: #eef2ef; }
  button.small { padding: 6px 12px; font-size: 12px; }
  button:disabled { opacity: 0.6; }
  .msg { margin-top: 10px; font-size: 13px; }
  .msg.error { color: #f28b82; }
  .msg.ok { color: #6fcf97; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { padding: 10px 8px; text-align: right; border-bottom: 1px solid #23392c; }
  th { color: #9fb3a8; font-weight: 600; }
  .hidden { display: none !important; }
  .full-width { grid-column: 1 / -1; }
  .loading { text-align: center; color: #9fb3a8; padding: 20px; }
  .stock-hint { font-size: 12px; color: #9fb3a8; margin-top: -8px; margin-bottom: 12px; }
  .new-customer-row { display: flex; gap: 8px; align-items: flex-end; }
  .new-customer-row > div { flex: 1; }
  .scan-modal {
    position: fixed; inset: 0; background: rgba(0,0,0,0.85);
    display: flex; align-items: center; justify-content: center;
    z-index: 1000; padding: 20px;
  }
  .scan-box { background: #16261e; border-radius: 14px; padding: 16px; max-width: 420px; width: 100%; }
  .scan-box video { width: 100%; border-radius: 10px; background: #000; }
  .scan-box .scan-msg { font-size: 13px; color: #9fb3a8; text-align: center; margin: 10px 0; }
</style>
</head>
<body>

<header>
  <h1>📦 نظام إدارة الصيدلية</h1>
  <div>
    <span class="userinfo" id="userinfo"></span>
    <button id="logoutBtn" class="small secondary" style="margin-right:8px;">خروج</button>
  </div>
</header>

<nav>
  <a href="inventory.html">المخزون</a>
  <a href="sales.html" class="active">المبيعات</a>
  <a href="shortages.html">النواقص</a>
  <a href="expenses.html">المصروفات</a>
  <a href="profit.html">الأرباح</a>
  <a href="users.html">الإعدادات</a>
</nav>

<div class="card">
  <h2>🧾 عملية بيع جديدة</h2>
  <div class="grid">
    <div class="full-width">
      <label>المنتج</label>
      <input type="text" id="s_search" placeholder="🔍 ابحث بالاسم..." style="margin-bottom:8px;">
      <div style="display:flex;gap:8px;">
        <select id="s_product" style="margin-bottom:0;">
          <option value="">-- اختار المنتج --</option>
        </select>
        <button type="button" id="scanBtn" class="secondary" style="white-space:nowrap;">📷 مسح</button>
      </div>
      <p class="stock-hint" id="stockHint"></p>
    </div>

    <div>
      <label>الوحدة المباعة</label>
      <select id="s_unit"></select>
    </div>
    <div>
      <label>الكمية</label>
      <input type="number" id="s_qty" value="1" min="1">
    </div>

    <div>
      <label>السعر الإجمالي (جنيه)</label>
      <input type="number" id="s_price" step="0.01" placeholder="بيتحسب تلقائي، تقدر تعدّله">
    </div>
    <div>
      <label>نوع البيع</label>
      <select id="s_sale_type">
        <option value="cash">كاش</option>
        <option value="credit">آجل (على حساب عميل)</option>
      </select>
    </div>

    <div id="customer_wrap" class="full-width hidden">
      <label>العميل</label>
      <select id="s_customer">
        <option value="">-- اختار عميل --</option>
        <option value="__new__">+ عميل جديد</option>
      </select>
      <div id="newCustomerRow" class="new-customer-row hidden" style="margin-top:8px;">
        <div>
          <label>اسم العميل الجديد</label>
          <input type="text" id="s_new_customer_name" placeholder="مثال: عيادة د. أحمد">
        </div>
        <div>
          <label>تليفون (اختياري)</label>
          <input type="text" id="s_new_customer_phone">
        </div>
      </div>
    </div>
  </div>
  <button id="sellBtn">تأكيد البيع</button>
  <div class="msg" id="sellMsg"></div>
</div>

<div class="card">
  <h2 id="salesListTitle">🕒 آخر عمليات البيع</h2>
  <div class="toolbar hidden" id="adminSalesTools">
    <button type="button" class="small secondary rangeBtn active" data-range="today">اليوم</button>
    <button type="button" class="small secondary rangeBtn" data-range="week">آخر أسبوع</button>
    <button type="button" class="small secondary rangeBtn" data-range="month">آخر شهر</button>
    <button type="button" class="small secondary rangeBtn" data-range="all">الكل</button>
    <input type="date" id="customFrom" class="hidden" style="width:auto;margin-bottom:0;">
    <input type="date" id="customTo" class="hidden" style="width:auto;margin-bottom:0;">
    <button type="button" id="customRangeBtn" class="small secondary">مدة مخصصة</button>
    <button type="button" id="exportSalesBtn" class="small secondary">⬇️ تصدير إكسيل</button>
  </div>
  <div id="salesTableWrap"><p class="loading">جاري التحميل...</p></div>
</div>

<div id="scanModal" class="scan-modal hidden">
  <div class="scan-box">
    <p class="scan-msg">وجّه الكاميرا على الباركود أو كود QR</p>
    <video id="scanVideo"></video>
    <p class="scan-msg" id="scanStatus"></p>
    <button type="button" id="closeScanBtn" class="secondary" style="width:100%;margin-top:10px;">إلغاء</button>
  </div>
</div>

<script src="config.js"></script>
<script>
  window.onerror = function(msg, url, line) {
    document.body.insertAdjacentHTML('beforeend',
      '<div style="position:fixed;bottom:0;left:0;right:0;background:#f28b82;color:#000;padding:12px;font-size:12px;direction:ltr;text-align:left;">JS Error: ' + msg + ' (line ' + line + ')</div>');
  };
  window.onunhandledrejection = function(e) {
    document.body.insertAdjacentHTML('beforeend',
      '<div style="position:fixed;bottom:0;left:0;right:0;background:#f28b82;color:#000;padding:12px;font-size:12px;direction:ltr;text-align:left;">Promise Error: ' + (e.reason && e.reason.message ? e.reason.message : e.reason) + '</div>');
  };

  let scanReader = null;

  document.getElementById('scanBtn').addEventListener('click', startScan);
  document.getElementById('closeScanBtn').addEventListener('click', stopScan);

  async function startScan() {
    const modal = document.getElementById('scanModal');
    const status = document.getElementById('scanStatus');
    modal.classList.remove('hidden');
    status.textContent = 'جاري تشغيل الكاميرا...';

    try {
      const hints = new Map();
      hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
      scanReader = new ZXing.BrowserMultiFormatReader(hints);
      const videoEl = document.getElementById('scanVideo');
      await scanReader.decodeFromConstraints(
        {
          video: {
            facingMode: 'environment',
            width: { ideal: 1920 },
            height: { ideal: 1080 },
            advanced: [{ focusMode: 'continuous' }]
          }
        },
        videoEl,
        async (result, err) => {
          if (result) {
            const code = result.getText();
            stopScan();
            const match = productsCache.find(p => p.qr_code === code);
            if (match) {
              document.getElementById('s_product').value = match.id;
              updateUnitOptions();
              showSellMsg('تم التعرف على المنتج: ' + match.name, 'ok');
            } else {
              showSellMsg('الكود ده مش متسجّل لأي منتج في المخزون', 'error');
            }
          }
        }
      );
    } catch (err) {
      status.textContent = 'تعذّر تشغيل الكاميرا: ' + err.message + ' (تأكد إنك سمحت للموقع باستخدام الكاميرا)';
    }
  }

  function stopScan() {
    if (scanReader) {
      scanReader.reset();
      scanReader = null;
    }
    document.getElementById('scanModal').classList.add('hidden');
  }

  function getInvQty(p) {
    if (!p.inventory) return 0;
    const row = Array.isArray(p.inventory) ? p.inventory[0] : p.inventory;
    return row ? row.quantity_smallest_unit : 0;
  }

  const UNIT_LABELS = {
    box: 'علبة', strip: 'شريط', piece: 'قطعة',
    ampoule: 'أمبولة', sachet: 'كيس', other: 'أخرى'
  };

  let currentUser = null;
  let isAdmin = false;
  let productsCache = [];
  let customersCache = [];

  (async () => {
    const auth = await requireAuth();
    if (!auth) return;
    if (!guardPageAccess(auth.profile, 'sales')) return;
    currentUser = auth.user;
    isAdmin = auth.profile.role === 'admin';

    document.getElementById('userinfo').textContent =
      auth.profile.full_name + ' (' + (isAdmin ? 'أدمن' : 'موظف') + ')';

    await loadProducts();
    await loadCustomers();
    await loadRecentSales();
  })();

  document.getElementById('logoutBtn').addEventListener('click', async () => {
    await sb.auth.signOut();
    window.location.href = 'index.html';
  });

  async function loadProducts() {
    const { data, error } = await sb
      .from('products')
      .select('id, name, qr_code, unit_large, unit_large_to_medium, unit_medium, unit_medium_to_small, unit_small, other_note, default_sale_price, inventory(quantity_smallest_unit)')
      .order('name');
    if (error) return;
    productsCache = data || [];
    renderProductOptions(document.getElementById('s_search').value);
  }

  function renderProductOptions(searchText) {
    const term = (searchText || '').trim().toLowerCase();
    const filtered = productsCache.filter(p => !term || p.name.toLowerCase().includes(term));
    const sel = document.getElementById('s_product');
    const previouslySelected = sel.value;

    sel.innerHTML = '<option value="">-- اختار المنتج --</option>' +
      filtered.map(p => '<option value="' + p.id + '">' + escapeHtml(p.name) + '</option>').join('');

    // نحافظ على المنتج المختار لو لسه موجود بعد الفلترة
    if (filtered.some(p => p.id === previouslySelected)) {
      sel.value = previouslySelected;
    }
  }

  document.getElementById('s_search').addEventListener('input', (e) => {
    renderProductOptions(e.target.value);
  });

  document.getElementById('s_product').addEventListener('change', updateUnitOptions);
  document.getElementById('s_unit').addEventListener('change', recalcPrice);
  document.getElementById('s_qty').addEventListener('input', recalcPrice);

  function getProduct(id) {
    return productsCache.find(p => p.id === id);
  }

  function unitLabel(p, level) {
    if (level === 'small') return p.unit_small === 'other' ? (p.other_note || 'أخرى') : UNIT_LABELS[p.unit_small];
    if (level === 'medium') return p.unit_medium === 'other' ? (p.other_note || 'أخرى') : UNIT_LABELS[p.unit_medium];
    if (level === 'large') return p.unit_large === 'other' ? (p.other_note || 'أخرى') : UNIT_LABELS[p.unit_large];
  }

  function updateUnitOptions() {
    const pid = document.getElementById('s_product').value;
    const unitSel = document.getElementById('s_unit');
    const hint = document.getElementById('stockHint');
    unitSel.innerHTML = '';

    const p = getProduct(pid);
    if (!p) { hint.textContent = ''; return; }

    const qty = getInvQty(p);

    unitSel.innerHTML += '<option value="small">' + unitLabel(p, 'small') + ' (فردي)</option>';
    if ((p.unit_medium_to_small || 1) > 1 || p.unit_medium !== p.unit_small) {
      unitSel.innerHTML += '<option value="medium">' + unitLabel(p, 'medium') + '</option>';
    }
    if (p.unit_large) {
      unitSel.innerHTML += '<option value="large">' + unitLabel(p, 'large') + '</option>';
    }

    hint.textContent = 'المتاح حاليًا: ' + qty + ' ' + unitLabel(p, 'small');
    recalcPrice();
  }

  function smallUnitsFor(p, level, qty) {
    const qtyMedium = p.unit_medium_to_small || 1;
    const qtyLarge = p.unit_large_to_medium || 1;
    if (level === 'small') return qty;
    if (level === 'medium') return qty * qtyMedium;
    if (level === 'large') return qty * qtyMedium * qtyLarge;
    return qty;
  }

  function recalcPrice() {
    const pid = document.getElementById('s_product').value;
    const p = getProduct(pid);
    const level = document.getElementById('s_unit').value;
    const qty = parseFloat(document.getElementById('s_qty').value) || 0;
    if (!p || !p.default_sale_price) return;

    // سعر البيع متخزن كسعر "العلبة" (أعلى مستوى)، نحسب سعر الوحدة الفردية بالقسمة عليه
    const totalSmallPerBox = (p.unit_large_to_medium || 1) * (p.unit_medium_to_small || 1);
    const pricePerSmall = p.default_sale_price / totalSmallPerBox;
    const smallQty = smallUnitsFor(p, level, qty);
    document.getElementById('s_price').value = (pricePerSmall * smallQty).toFixed(2);
  }

  document.getElementById('s_sale_type').addEventListener('change', (e) => {
    document.getElementById('customer_wrap').classList.toggle('hidden', e.target.value !== 'credit');
  });

  document.getElementById('s_customer').addEventListener('change', (e) => {
    document.getElementById('newCustomerRow').classList.toggle('hidden', e.target.value !== '__new__');
  });

  async function loadCustomers() {
    const { data, error } = await sb.from('customers').select('id, name').order('name');
    if (error) return;
    customersCache = data || [];
    const sel = document.getElementById('s_customer');
    sel.innerHTML = '<option value="">-- اختار عميل --</option>' +
      customersCache.map(c => '<option value="' + c.id + '">' + escapeHtml(c.name) + '</option>').join('') +
      '<option value="__new__">+ عميل جديد</option>';
  }

  document.getElementById('sellBtn').addEventListener('click', async () => {
    const sellBtn = document.getElementById('sellBtn');
    const pid = document.getElementById('s_product').value;
    const level = document.getElementById('s_unit').value;
    const qty = parseFloat(document.getElementById('s_qty').value) || 0;
    const price = parseFloat(document.getElementById('s_price').value) || 0;
    const saleType = document.getElementById('s_sale_type').value;

    const p = getProduct(pid);
    if (!p || qty <= 0) {
      showSellMsg('اختار منتج وكمية صحيحة', 'error');
      return;
    }

    const smallQty = smallUnitsFor(p, level, qty);
    const currentStock = getInvQty(p);

    if (smallQty > currentStock) {
      showSellMsg('الكمية المطلوبة أكبر من المتاح في المخزون (المتاح: ' + currentStock + ' ' + unitLabel(p, 'small') + ')', 'error');
      return;
    }

    sellBtn.disabled = true;
    sellBtn.textContent = 'جاري الحفظ...';

    try {
      let customerId = null;

      if (saleType === 'credit') {
        const custSel = document.getElementById('s_customer').value;
        if (custSel === '__new__') {
          const newName = document.getElementById('s_new_customer_name').value.trim();
          const newPhone = document.getElementById('s_new_customer_phone').value.trim();
          if (!newName) throw new Error('لازم تكتب اسم العميل الجديد');
          const { data: newCust, error: custErr } = await sb
            .from('customers').insert({ name: newName, phone: newPhone || null }).select().single();
          if (custErr) throw custErr;
          customerId = newCust.id;
        } else if (custSel) {
          customerId = custSel;
        } else {
          throw new Error('اختار عميل أو أضف عميل جديد للبيع الآجل');
        }
      }

      const { error: saleError } = await sb.from('sales').insert({
        product_id: pid,
        quantity: qty,
        unit_sold: level === 'small' ? p.unit_small : (level === 'medium' ? p.unit_medium : p.unit_large),
        sale_price: price,
        customer_id: customerId,
        employee_id: currentUser.id
      });
      if (saleError) throw saleError;

      const { error: invError } = await sb
        .from('inventory')
        .update({ quantity_smallest_unit: currentStock - smallQty })
        .eq('product_id', pid);
      if (invError) throw invError;

      if (customerId) {
        await sb.from('customer_ledger').insert({
          customer_id: customerId,
          amount: price,
          note: 'بيع آجل: ' + p.name,
          created_by: currentUser.id
        });
      }

      showSellMsg('تمت عملية البيع بنجاح ✅', 'ok');
      document.getElementById('s_qty').value = 1;
      document.getElementById('s_price').value = '';
      document.getElementById('s_new_customer_name').value = '';
      document.getElementById('s_new_customer_phone').value = '';
      await loadProducts();
      await loadCustomers();
      await loadRecentSales();
      updateUnitOptions();
    } catch (err) {
      showSellMsg('حصل خطأ: ' + (err.message || JSON.stringify(err)), 'error');
    } finally {
      sellBtn.disabled = false;
      sellBtn.textContent = 'تأكيد البيع';
    }
  });

  function showSellMsg(text, type) {
    const el = document.getElementById('sellMsg');
    el.textContent = text;
    el.className = 'msg ' + type;
  }

  let currentSalesRange = 'today';
  let customFromDate = null;
  let customToDate = null;

  function getRangeStart(range) {
    const now = new Date();
    if (range === 'today') return new Date(now.getFullYear(), now.getMonth(), now.getDate()).toISOString();
    if (range === 'week') { const d = new Date(now); d.setDate(d.getDate() - 7); return d.toISOString(); }
    if (range === 'month') { const d = new Date(now); d.setMonth(d.getMonth() - 1); return d.toISOString(); }
    return null; // 'all'
  }

  document.querySelectorAll('.rangeBtn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.rangeBtn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('customFrom').classList.add('hidden');
      document.getElementById('customTo').classList.add('hidden');
      currentSalesRange = btn.dataset.range;
      customFromDate = null;
      customToDate = null;
      loadRecentSales();
    });
  });

  document.getElementById('customRangeBtn').addEventListener('click', () => {
    const fromEl = document.getElementById('customFrom');
    const toEl = document.getElementById('customTo');
    if (fromEl.classList.contains('hidden')) {
      fromEl.classList.remove('hidden');
      toEl.classList.remove('hidden');
      return;
    }
    document.querySelectorAll('.rangeBtn').forEach(b => b.classList.remove('active'));
    currentSalesRange = 'custom';
    customFromDate = fromEl.value || null;
    customToDate = toEl.value || null;
    loadRecentSales();
  });

  async function loadRecentSales() {
    const wrap = document.getElementById('salesTableWrap');
    document.getElementById('adminSalesTools').classList.toggle('hidden', !isAdmin);
    document.getElementById('salesListTitle').textContent = isAdmin ? '🕒 كل عمليات البيع' : '🕒 عملياتي الأخيرة';

    let query = sb.from('sales')
      .select('id, quantity, unit_sold, sale_price, created_at, product_id, products(name), profiles(full_name), customers(name)')
      .order('created_at', { ascending: false });

    if (isAdmin) {
      if (currentSalesRange === 'custom') {
        if (customFromDate) query = query.gte('created_at', customFromDate);
        if (customToDate) { const d = new Date(customToDate); d.setDate(d.getDate() + 1); query = query.lt('created_at', d.toISOString()); }
      } else {
        const start = getRangeStart(currentSalesRange);
        if (start) query = query.gte('created_at', start);
      }
    } else {
      query = query.limit(30);
    }

    const { data, error } = await query;

    if (error) {
      wrap.innerHTML = '<p class="msg error">تعذّر تحميل المبيعات: ' + error.message + '</p>';
      return;
    }
    if (!data || data.length === 0) {
      wrap.innerHTML = '<p class="loading">لا توجد عمليات بيع في المدة دي</p>';
      window._salesCache = [];
      return;
    }

    window._salesCache = data;

    let html = '<table><thead><tr><th>المنتج</th><th>الكمية</th><th>السعر</th><th>البائع</th><th>العميل</th><th>الوقت</th>' + (isAdmin ? '<th>إجراءات</th>' : '') + '</tr></thead><tbody>';
    for (const s of data) {
      html += '<tr>' +
        '<td>' + escapeHtml(s.products ? s.products.name : '—') + '</td>' +
        '<td>' + s.quantity + ' ' + (UNIT_LABELS[s.unit_sold] || s.unit_sold) + '</td>' +
        '<td>' + s.sale_price + ' ج</td>' +
        '<td>' + escapeHtml(s.profiles ? s.profiles.full_name : '—') + '</td>' +
        '<td>' + (s.customers ? escapeHtml(s.customers.name) : 'كاش') + '</td>' +
        '<td>' + new Date(s.created_at).toLocaleString('ar-EG') + '</td>';
      if (isAdmin) {
        html += '<td>' +
          '<button class="small secondary" onclick="editSalePrice(\'' + s.id + '\')">تعديل السعر</button> ' +
          '<button class="small danger" onclick="deleteSale(\'' + s.id + '\')">حذف</button>' +
          '</td>';
      }
      html += '</tr>';
    }
    html += '</tbody></table>';
    wrap.innerHTML = html;
  }

  window.editSalePrice = async function(saleId) {
    const s = (window._salesCache || []).find(x => x.id === saleId);
    if (!s) return;
    const newPrice = prompt('السعر الجديد للعملية دي:', s.sale_price);
    if (newPrice === null) return;
    const parsed = parseFloat(newPrice);
    if (isNaN(parsed) || parsed < 0) { alert('سعر غير صحيح'); return; }

    const { data, error } = await sb.from('sales').update({ sale_price: parsed }).eq('id', saleId).select();
    if (error) { alert('حصل خطأ: ' + error.message); return; }
    if (!data || data.length === 0) { alert('التعديل لم يُحفظ'); return; }
    await loadRecentSales();
  };

  window.deleteSale = async function(saleId) {
    if (!confirm('متأكد إنك عايز تمسح عملية البيع دي؟ (ملحوظة: الكمية اللي اتخصمت من المخزون مش هترجع تلقائي، لازم تعدّلها يدويًا في المخزون لو محتاج)')) return;
    const { error } = await sb.from('sales').delete().eq('id', saleId);
    if (error) { alert('تعذّر الحذف: ' + error.message); return; }
    await loadRecentSales();
  };

  document.getElementById('exportSalesBtn').addEventListener('click', () => {
    const data = window._salesCache || [];
    if (data.length === 0) { alert('مفيش بيانات للتصدير في المدة المختارة'); return; }

    const rows = data.map(s => ({
      'المنتج': s.products ? s.products.name : '—',
      'الكمية': s.quantity,
      'الوحدة': UNIT_LABELS[s.unit_sold] || s.unit_sold,
      'السعر': s.sale_price,
      'البائع': s.profiles ? s.profiles.full_name : '—',
      'العميل': s.customers ? s.customers.name : 'كاش',
      'الوقت': new Date(s.created_at).toLocaleString('ar-EG')
    }));

    const ws = XLSX.utils.json_to_sheet(rows);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'المبيعات');
    XLSX.writeFile(wb, 'مبيعات_الصيدلية.xlsx');
  });

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }
</script>

</body>
</html>
