name: Fix invoice filters

on:
  push:
    branches:
      - feature/invoices-filter-simple-employee-fix-2026-09-03

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix invoices filters
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('invoices.html')
          s = p.read_text(encoding='utf-8')

          old = "sb.from('sales').select('id,sale_group_id,quantity,unit_sold,sale_price,created_at,products(name,name_en),profiles(id,full_name),customers(name)')"
          new = "sb.from('sales').select('id,sale_group_id,quantity,unit_sold,sale_price,created_at,employee_id,products(name,name_en),profiles(full_name),customers(name)')"
          if old not in s:
              raise SystemExit('sales select pattern not found')
          s = s.replace(old, new, 1)

          old = "employee:s.profiles?s.profiles.full_name:'—',employee_id:s.profiles?s.profiles.id:null"
          new = "employee:s.profiles?s.profiles.full_name:'—',employee_id:s.employee_id||null"
          if old not in s:
              raise SystemExit('employee mapping pattern not found')
          s = s.replace(old, new, 1)

          old = "f.employees.length&&!f.employees.includes(inv.employee_id)"
          new = "f.employees.length&&!f.employees.map(String).includes(String(inv.employee_id||''))"
          if old not in s:
              raise SystemExit('employee filter pattern not found')
          s = s.replace(old, new, 1)

          # Simpler ERP-style filter bar: fewer visual elements, no oversized panels.
          s = s.replace('👤 الموظفون <span', 'الموظف <span', 1)
          s = s.replace('📅 التاريخ والوقت <span', 'التاريخ <span', 1)
          s = s.replace('⚡ فترات سريعة <span', 'فترات سريعة <span', 1)
          s = s.replace('🔍 ابحث باسم العميل أو المنتج أو الموظف...', 'ابحث في الفواتير...', 1)
          s = s.replace('<strong>تصفية حسب الموظفين</strong>', '<strong>الموظف</strong>', 1)
          s = s.replace('<strong>التاريخ والوقت</strong>', '<strong>التاريخ والوقت</strong>', 1)
          s = s.replace('<strong>الفترات السريعة</strong>', '<strong>فترة سريعة</strong>', 1)

          extra = '''\n/* Simple ERP filter bar */\n.filter-tools{gap:6px}.filter-btn{min-width:105px;height:40px;border-radius:8px;font-size:13px;font-weight:600}.filter-btn:hover,.filter-btn.active{background:var(--bg);border-color:var(--primary);}.filter-menu{width:300px;border-radius:10px;box-shadow:0 10px 28px rgba(15,23,42,.12);padding:12px}.filter-menu-head{padding-bottom:9px;margin-bottom:10px}.menu-note{display:none}.menu-actions{margin-top:10px}.menu-actions button{height:38px}.employee-list{max-height:190px}.employee-item{padding:7px 8px}.applied-chips{margin-top:8px;margin-bottom:10px}.chip{padding:4px 8px}.summary-grid{margin-bottom:12px}\n@media(max-width:700px){.invoice-toolbar{gap:7px}.filter-tools{display:flex;gap:6px}.filter-btn{height:38px;min-width:0;padding:0 10px}.filter-menu{right:12px;left:12px;bottom:12px;padding:12px}}\n@media(max-width:420px){.filter-tools{grid-template-columns:none}.filter-btn{font-size:11px;padding:0 8px}}\n'''
          marker = '</style></head>'
          if extra.strip() not in s:
              s = s.replace(marker, extra + marker, 1)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add invoices.html
          git diff --cached --quiet || git commit -m "Fix invoice employee filter and simplify filters"
          git push
      - name: Remove temporary workflow
        if: success()
        run: |
          git rm .github/workflows/fix-invoices-filters.yml
          git commit -m "chore: remove temporary invoice filter workflow"
          git push
