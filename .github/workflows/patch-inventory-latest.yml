name: Apply inventory latest sort patch

on:
  push:
    paths:
      - '.github/workflows/patch-inventory-latest.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch inventory sort
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('inventory-enhancements.js')
          s = p.read_text(encoding='utf-8')

          old = """        '<option value=\"en_desc\">الاسم الإنجليزي: Z → A</option>' +\n      '</select>';"""
          new = """        '<option value=\"en_desc\">الاسم الإنجليزي: Z → A</option>' +\n        '<option value=\"created_desc\">الأحدث</option>' +\n      '</select>';"""
          if old not in s:
              raise SystemExit('Sort option anchor not found')
          s = s.replace(old, new, 1)

          old2 = """    select.value = localStorage.getItem('farmaInventorySort') || 'ar_asc';\n    select.addEventListener('change', e => {"""
          new2 = """    select.value = localStorage.getItem('farmaInventorySort') || 'ar_asc';\n    select.addEventListener('change', e => {"""
          if old2 not in s:
              raise SystemExit('Sort listener anchor not found')

          marker = """  function addUnclassifiedOptions() {"""
          wrapper = """  function installCreatedAtSort() {\n    if (window.__farmaCreatedAtSortInstalled) return;\n    if (typeof window.renderInventoryTable !== 'function') return;\n    window.__farmaCreatedAtSortInstalled = true;\n\n    const originalRender = window.renderInventoryTable;\n    window.renderInventoryTable = function(searchText) {\n      const select = document.getElementById('inventorySort');\n      if (!select || select.value !== 'created_desc') {\n        return originalRender(searchText);\n      }\n\n      const cache = window._productsCache || [];\n      const sorted = [...cache].sort((a, b) => {\n        const ta = Date.parse(a?.created_at || '') || 0;\n        const tb = Date.parse(b?.created_at || '') || 0;\n        if (tb !== ta) return tb - ta;\n        return String(b?.id || '').localeCompare(String(a?.id || ''));\n      });\n\n      window._productsCache = sorted;\n      const previous = select.value;\n      select.value = 'ar_asc';\n      try {\n        return originalRender(searchText);\n      } finally {\n        select.value = previous;\n        window._productsCache = cache;\n      }\n    };\n  }\n\n"""
          if marker not in s:
              raise SystemExit('Insertion marker not found')
          s = s.replace(marker, wrapper + marker, 1)

          old3 = """    addSortControl();\n    addExtraFilterDetails();"""
          new3 = """    addSortControl();\n    installCreatedAtSort();\n    addExtraFilterDetails();"""
          if old3 not in s:
              raise SystemExit('Boot anchor not found')
          s = s.replace(old3, new3, 1)

          p.write_text(s, encoding='utf-8')
          PY

          rm -f .github/workflows/patch-inventory-latest.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add inventory-enhancements.js .github/workflows/patch-inventory-latest.yml
          git commit -m "Add newest-first inventory sorting"
          git push