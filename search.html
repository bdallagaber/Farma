<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بحث الأدوية - نظام إدارة الصيدلية</title>
<script src="supabase-lib.js"></script>
<script src="zxing-lib.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #0f1b16; color: #eef2ef; padding: 16px; padding-bottom: 60px; }
  header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
  header h1 { font-size: 18px; color: #6fcf97; }
  header .userinfo { font-size: 12px; color: #9fb3a8; }
  nav { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
  nav a { padding: 8px 14px; background: #16261e; border: 1px solid #23392c; border-radius: 8px; color: #eef2ef; text-decoration: none; font-size: 13px; }
  nav a.active { background: #6fcf97; color: #0f1b16; font-weight: 600; }
  .card { background: #16261e; border: 1px solid #23392c; border-radius: 14px; padding: 20px; margin-bottom: 20px; }
  .hidden { display: none !important; }
  label { display: block; font-size: 12px; color: #b7c9be; margin-bottom: 4px; }
  input, select { width: 100%; padding: 10px 12px; background: #0f1b16; border: 1px solid #2a4536; border-radius: 8px; color: #eef2ef; font-size: 14px; margin-bottom: 12px; }
  .filters-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .filter-panel { background: #0f1b16; border: 1px solid #2a4536; border-radius: 8px; padding: 8px 12px; font-size: 13px; margin-bottom: 0; }
  .filter-panel summary { cursor: pointer; color: #eef2ef; list-style: none; }
  .filter-panel summary::-webkit-details-marker { display: none; }
  .filter-panel summary span { color: #6fcf97; font-weight: 600; }
  .filter-checks { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; max-height: 220px; overflow-y: auto; }
  .filter-checks label { display: flex; align-items: center; gap: 6px; font-size: 13px; color: #b7c9be; margin-bottom: 0; cursor: pointer; }
  .filter-checks input { width: auto; margin: 0; }
  .loading { text-align: center; color: #9fb3a8; padding: 20px; }
  .result-card { background: #16261e; border: 1px solid #23392c; border-radius: 12px; padding: 16px; margin-bottom: 12px; }
  .result-name-en { font-size: 16px; font-weight: 700; color: #eef2ef; }
  .result-name-ar { font-size: 13px; color: #9fb3a8; margin-bottom: 8px; }
  .tags { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0; }
  .tag { background: #23392c; color: #b7c9be; font-size: 11px; padding: 4px 10px; border-radius: 20px; }
  .active-ingredient { font-size: 13px; color: #6fcf97; margin-bottom: 4px; }
  .stock-line { font-size: 13px; margin: 8px 0; display: flex; justify-content: space-between; align-items: center; }
  .available { color: #6fcf97; font-weight: 600; }
  .unavailable { color: #f28b82; font-weight: 600; }
  button { padding: 10px 16px; background: #6fcf97; color: #0f1b16; border: none; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; }
  button.secondary { background: #23392c; color: #eef2ef; }
  button.small { padding: 6px 12px; font-size: 12px; }
  .substitutes-box { margin-top: 10px; padding-top: 10px; border-top: 1px dashed #2a4536; }
  .substitutes-title { font-size: 12px; color: #f2c94c; margin-bottom: 6px; }
  .sub-item { display: flex; justify-content: space-between; align-items: center; font-size: 13px; padding: 6px 0; }
</style>
</head>
<body>

<header>
  <h1>📦 نظام إدارة الصيدلية</h1>
  <div>
    <span class="userinfo" id="userinfo"></span>
    <button id="logoutBtn" class="small secondary" style="margin-right:8px;">خروج</button>
  </div>
</header>

<nav>
  <a href="inventory.html">المخزون</a>
  <a href="sales.html">المبيعات</a>
  <a href="shortages.html">النواقص</a>
  <a href="expenses.html">المصروفات</a>
  <a href="profit.html">الأرباح</a>
  <a href="search.html" class="active">🔍 بحث الأدوية</a>
  <a href="users.html">⚙️ الإعدادات</a>
</nav>

<div class="card">
  <label>🔍 ابحث بالاسم (عربي/إنجليزي) أو المادة الفعالة</label>
  <input type="text" id="searchInput" placeholder="مثال: Augmentin أو أوجمنتين أو Amoxicillin">

  <label>📷 أو ابحث بالباركود</label>
  <div style="display:flex;gap:8px;">
    <input type="text" id="barcodeInput" placeholder="اكتب الباركود أو امسحه" style="margin-bottom:12px;">
    <button type="button" id="scanBtn" class="secondary" style="white-space:nowrap;height:fit-content;">📷 مسح</button>
  </div>

  <div class="filters-grid">
    <details class="filter-panel"><summary>التوفر <span id="filterAvailabilityCount"></span></summary><div id="filterAvailabilityBox" class="filter-checks">
      <label><input type="checkbox" class="availChk" value="available"> متوفر</label>
      <label><input type="checkbox" class="availChk" value="unavailable"> غير متوفر</label>
      <label><input type="checkbox" class="availChk" value="low"> ناقص (قرب يخلص)</label>
    </div></details>
    <details class="filter-panel"><summary>النوع <span id="filterTypeCount"></span></summary><div id="filterTypeBox" class="filter-checks"></div></details>
    <details class="filter-panel"><summary>الشكل الدوائي <span id="filterShapeCount"></span></summary><div id="filterShapeBox" class="filter-checks"></div></details>
    <details class="filter-panel"><summary>التصنيف <span id="filterClassCount"></span></summary><div id="filterClassBox" class="filter-checks"></div></details>
  </div>
</div>

<div id="resultsWrap"><p class="loading">جاري التحميل...</p></div>

<div id="scanModal" class="scan-modal hidden" style="position:fixed;inset:0;background:rgba(0,0,0,0.85);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px;">
  <div style="background:#16261e;border-radius:14px;padding:16px;max-width:420px;width:100%;">
    <p style="font-size:13px;color:#9fb3a8;text-align:center;margin-bottom:10px;">وجّه الكاميرا على الباركود</p>
    <video id="scanVideo" style="width:100%;border-radius:10px;background:#000;"></video>
    <p id="scanStatus" style="font-size:13px;color:#9fb3a8;text-align:center;margin:10px 0;"></p>
    <button type="button" id="closeScanBtn" class="secondary" style="width:100%;">إلغاء</button>
  </div>
</div>

<script src="config.js"></script>
<script>
  window.onerror = function(msg, url, line) {
    document.body.insertAdjacentHTML('beforeend',
      '<div style="position:fixed;bottom:0;left:0;right:0;background:#f28b82;color:#000;padding:12px;font-size:12px;direction:ltr;text-align:left;">JS Error: ' + msg + ' (line ' + line + ')</div>');
  };
  window.onunhandledrejection = function(e) {
    document.body.insertAdjacentHTML('beforeend',
      '<div style="position:fixed;bottom:0;left:0;right:0;background:#f28b82;color:#000;padding:12px;font-size:12px;direction:ltr;text-align:left;">Promise Error: ' + (e.reason && e.reason.message ? e.reason.message : e.reason) + '</div>');
  };

  let allProducts = [];

  (async () => {
    const auth = await requireAuth();
    if (!auth) return;
    if (!guardPageAccess(auth.profile, 'search')) return;
    document.getElementById('userinfo').textContent =
      auth.profile.full_name + ' (' + (auth.profile.role === 'admin' ? 'أدمن' : 'موظف') + ')';

    await loadFilters();
    await loadProducts();

    // لو جينا من رابط فيه اسم بحث جاهز (زي زرار "عرض في المخزون" العكسي)
    const params = new URLSearchParams(window.location.search);
    if (params.get('q')) {
      document.getElementById('searchInput').value = params.get('q');
      renderResults();
    }
  })();

  document.getElementById('logoutBtn').addEventListener('click', async () => {
    await sb.auth.signOut();
    window.location.href = 'index.html';
  });

  // نص يعتبر "فاضي/بلاسهولدر" مش قيمة حقيقية (زي "-----" أو "N/A")
  function isPlaceholder(val) {
    if (!val) return true;
    const v = String(val).trim();
    return v === '' || /^-+$/.test(v) || /^n\/?a$/i.test(v) || v === '.' || v === '،';
  }

  // مطابقة مرنة: بتشيل المسافات وبتقارن، عشان "بيتا ديرم" يطابق "بيتاديرم"
  function normalizeForSearch(s) {
    return (s || '').toString().toLowerCase().replace(/\s+/g, '');
  }

  function fuzzyIncludes(haystack, term) {
    if (!term) return true;
    const normHay = normalizeForSearch(haystack);
    const normTerm = normalizeForSearch(term);
    if (normHay.includes(normTerm)) return true;
    // لو مطابقة المسافات فشلت، جرّب مطابقة كل كلمة لوحدها (بأي ترتيب)
    const words = term.trim().split(/\s+/).filter(Boolean);
    if (words.length > 1) {
      return words.every(w => normalizeForSearch(haystack).includes(normalizeForSearch(w)));
    }
    return false;
  }

  async function loadFilters() {
    const { data } = await sb.from('custom_options').select('category, parent, value').order('value');
    const types = (data || []).filter(o => o.category === 'drug_type');
    const shapes = (data || []).filter(o => o.category === 'drug_shape');
    const classes = (data || []).filter(o => o.category === 'classification');

    buildCheckboxes('filterTypeBox', 'filterTypeCount', types.map(o => o.value), 'typeChk');
    buildCheckboxes('filterShapeBox', 'filterShapeCount', [...new Map(shapes.map(o => [o.value, o])).values()].map(o => o.value), 'shapeChk');
    buildCheckboxes('filterClassBox', 'filterClassCount', classes.map(o => o.value), 'classChk');
  }

  function buildCheckboxes(containerId, countId, options, groupClass) {
    const box = document.getElementById(containerId);
    box.innerHTML = options.map(v =>
      '<label><input type="checkbox" class="' + groupClass + '" value="' + escapeHtml(v) + '"> ' + escapeHtml(v) + '</label>'
    ).join('');
    box.querySelectorAll('input').forEach(chk => chk.addEventListener('change', () => {
      updateFilterCount(groupClass, countId);
      renderResults();
    }));
  }

  function updateFilterCount(groupClass, countId) {
    const n = document.querySelectorAll('.' + groupClass + ':checked').length;
    document.getElementById(countId).textContent = n > 0 ? '(' + n + ')' : '';
  }

  function getChecked(groupClass) {
    return Array.from(document.querySelectorAll('.' + groupClass + ':checked')).map(c => c.value);
  }

  async function loadProducts() {
    const { data, error } = await sb
      .from('products')
      .select('id, name, name_en, shape, drug_type, classification, active_ingredient, concentration, retail_allowed, qr_code, default_sale_price, min_stock_threshold, unit_large_to_medium, unit_medium_to_small, unit_small, other_note, inventory(quantity_smallest_unit)')
      .order('name_en');
    if (error) {
      document.getElementById('resultsWrap').innerHTML = '<p style="color:#f28b82;">تعذّر التحميل: ' + error.message + '</p>';
      return;
    }
    allProducts = data || [];
    renderResults();
  }

  document.getElementById('searchInput').addEventListener('input', renderResults);
  document.querySelectorAll('.availChk').forEach(chk => chk.addEventListener('change', () => {
    updateFilterCount('availChk', 'filterAvailabilityCount');
    renderResults();
  }));

  document.getElementById('barcodeInput').addEventListener('input', (e) => {
    const code = e.target.value.trim();
    if (!code) { renderResults(); return; }
    const match = allProducts.find(p => p.qr_code === code);
    const wrap = document.getElementById('resultsWrap');
    wrap.innerHTML = match ? renderCard(match) : '<p class="loading">مفيش منتج مسجّل بالباركود ده</p>';
  });

  function getQty(p) {
    if (!p.inventory) return 0;
    const row = Array.isArray(p.inventory) ? p.inventory[0] : p.inventory;
    return row ? row.quantity_smallest_unit : 0;
  }

  function renderResults() {
    const term = document.getElementById('searchInput').value.trim();
    const availFilters = getChecked('availChk');
    const typeFilters = getChecked('typeChk');
    const shapeFilters = getChecked('shapeChk');
    const classFilters = getChecked('classChk');

    const filtered = allProducts.filter(p => {
      const qty = getQty(p);
      const threshold = p.min_stock_threshold || 0;
      const isAvailable = qty > threshold;
      const isLow = qty > 0 && qty <= threshold;
      const isUnavailable = qty <= 0;

      if (term) {
        const hay = (p.name || '') + ' ' + (p.name_en || '') + ' ' + (p.active_ingredient || '');
        if (!fuzzyIncludes(hay, term)) return false;
      }
      if (availFilters.length) {
        const matches =
          (availFilters.includes('available') && isAvailable) ||
          (availFilters.includes('unavailable') && isUnavailable) ||
          (availFilters.includes('low') && isLow);
        if (!matches) return false;
      }
      if (typeFilters.length && !typeFilters.includes(p.drug_type)) return false;
      if (shapeFilters.length && !shapeFilters.includes(p.shape)) return false;
      if (classFilters.length && !classFilters.includes(p.classification)) return false;
      return true;
    });

    const wrap = document.getElementById('resultsWrap');
    if (filtered.length === 0) {
      wrap.innerHTML = '<p class="loading">مفيش نتائج مطابقة</p>';
      return;
    }

    wrap.innerHTML = filtered.slice(0, 100).map(p => renderCard(p)).join('');
  }

  function renderCard(p) {
    const qty = getQty(p);
    const threshold = p.min_stock_threshold || 0;
    const isAvailable = qty > threshold;
    const isLow = qty > 0 && qty <= threshold;
    const displayName = p.name_en || p.name;

    const hasActiveIngredient = !isPlaceholder(p.active_ingredient);
    const hasConcentration = !isPlaceholder(p.concentration);

    let substitutesHtml = '';
    if (hasActiveIngredient) {
      const substitutes = allProducts.filter(s =>
        s.id !== p.id &&
        !isPlaceholder(s.active_ingredient) &&
        s.active_ingredient.trim().toLowerCase() === p.active_ingredient.trim().toLowerCase()
      ).sort((a, b) => (getQty(b) > (b.min_stock_threshold||0) ? 1 : 0) - (getQty(a) > (a.min_stock_threshold||0) ? 1 : 0));

      if (substitutes.length > 0) {
        substitutesHtml = '<div class="substitutes-box"><div class="substitutes-title">💊 بدائل (نفس المادة الفعالة):</div>' +
          substitutes.slice(0, 5).map(s => {
            const sQty = getQty(s);
            const sAvail = sQty > (s.min_stock_threshold || 0);
            return '<div class="sub-item"><span>' + escapeHtml(s.name_en || s.name) +
              (!isPlaceholder(s.concentration) ? ' (' + escapeHtml(s.concentration) + ')' : '') + '</span>' +
              '<span class="' + (sAvail ? 'available' : 'unavailable') + '">' + (sAvail ? 'متوفر' : 'غير متوفر') + '</span></div>';
          }).join('') + '</div>';
      }
    }

    let statusLabel = '❌ غير متوفر';
    let statusClass = 'unavailable';
    if (isAvailable) { statusLabel = '✅ متوفر'; statusClass = 'available'; }
    else if (isLow) { statusLabel = '⚠️ ناقص'; statusClass = 'unavailable'; }

    return '<div class="result-card">' +
      '<div class="result-name-en">' + escapeHtml(displayName) + '</div>' +
      (p.name_en && p.name ? '<div class="result-name-ar">' + escapeHtml(p.name) + '</div>' : '') +
      (hasActiveIngredient ? '<div class="active-ingredient">' + escapeHtml(p.active_ingredient) + (hasConcentration ? ' — ' + escapeHtml(p.concentration) : '') + '</div>' : '') +
      '<div class="tags">' +
        (p.drug_type ? '<span class="tag">' + escapeHtml(p.drug_type) + '</span>' : '') +
        (p.shape ? '<span class="tag">' + escapeHtml(p.shape) + '</span>' : '') +
        (p.classification ? '<span class="tag">' + escapeHtml(p.classification) + '</span>' : '') +
      '</div>' +
      '<div class="stock-line">' +
        '<span class="' + statusClass + '">' + statusLabel + '</span>' +
        (p.default_sale_price ? '<span>' + p.default_sale_price + ' ج</span>' : '') +
      '</div>' +
      '<div style="display:flex;gap:8px;">' +
        '<button onclick="sellThis(\'' + p.id + '\')" ' + (isAvailable || isLow ? '' : 'disabled') + '>🛒 بيع</button>' +
        '<button class="secondary" onclick="viewInInventory(\'' + escapeHtml(p.name).replace(/'/g, "\\'") + '\')">📦 عرض في المخزون</button>' +
      '</div>' +
      substitutesHtml +
    '</div>';
  }

  window.sellThis = function(id) {
    window.location.href = 'sales.html?product=' + id;
  };

  window.viewInInventory = function(name) {
    window.location.href = 'inventory.html?search=' + encodeURIComponent(name);
  };

  // ------------------------------------------------------------
  // مسح باركود للبحث
  // ------------------------------------------------------------
  let scanReader = null, nativeDetectorStream = null, nativeDetectorLoop = null;

  document.getElementById('scanBtn').addEventListener('click', startScan);
  document.getElementById('closeScanBtn').addEventListener('click', stopScan);
  window.addEventListener('pagehide', stopScan);
  window.addEventListener('beforeunload', stopScan);

  function playBeep() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.frequency.value = 1000;
      gain.gain.setValueAtTime(0.3, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.15);
      osc.start(); osc.stop(ctx.currentTime + 0.15);
    } catch (e) {}
  }

  function onBarcodeFound(code) {
    playBeep();
    stopScan();
    document.getElementById('barcodeInput').value = code;
    document.getElementById('barcodeInput').dispatchEvent(new Event('input'));
  }

  async function startScan() {
    const modal = document.getElementById('scanModal');
    const status = document.getElementById('scanStatus');
    const videoEl = document.getElementById('scanVideo');
    modal.classList.remove('hidden');
    status.textContent = 'جاري تشغيل الكاميرا...';

    if ('BarcodeDetector' in window) {
      try {
        const supported = await window.BarcodeDetector.getSupportedFormats();
        const formats = ['ean_13', 'ean_8', 'upc_a', 'code_128', 'qr_code'].filter(f => supported.includes(f));
        const detector = new window.BarcodeDetector({ formats: formats.length ? formats : undefined });
        nativeDetectorStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } } });
        videoEl.srcObject = nativeDetectorStream;
        await videoEl.play();
        status.textContent = 'جاري المسح...';
        nativeDetectorLoop = setInterval(async () => {
          if (!nativeDetectorStream) return;
          try {
            const barcodes = await detector.detect(videoEl);
            if (barcodes.length > 0) onBarcodeFound(barcodes[0].rawValue);
          } catch (e) {}
        }, 300);
        return;
      } catch (err) {
        stopScan();
      }
    }

    modal.classList.remove('hidden');
    try {
      const hints = new Map();
      hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
      hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [ZXing.BarcodeFormat.EAN_13, ZXing.BarcodeFormat.EAN_8, ZXing.BarcodeFormat.UPC_A, ZXing.BarcodeFormat.CODE_128, ZXing.BarcodeFormat.QR_CODE]);
      scanReader = new ZXing.BrowserMultiFormatReader(hints);
      await scanReader.decodeFromConstraints(
        { video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 }, advanced: [{ focusMode: 'continuous' }] } },
        videoEl,
        (result) => { if (result) onBarcodeFound(result.getText()); }
      );
    } catch (err) {
      status.textContent = 'تعذّر تشغيل الكاميرا: ' + err.message;
    }
  }

  function stopScan() {
    if (scanReader) { scanReader.reset(); scanReader = null; }
    if (nativeDetectorLoop) { clearInterval(nativeDetectorLoop); nativeDetectorLoop = null; }
    if (nativeDetectorStream) { nativeDetectorStream.getTracks().forEach(t => t.stop()); nativeDetectorStream = null; }
    document.getElementById('scanModal').classList.add('hidden');
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }
</script>

</body>
</html>
