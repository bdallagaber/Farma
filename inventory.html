<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المخزون - نظام إدارة الصيدلية</title>
<script src="supabase-lib.js"></script>
<script src="zxing-lib.js"></script>
<script src="xlsx-lib.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>📦 نظام إدارة الصيدلية</h1>
  <div>
    <span class="userinfo" id="userinfo"></span>
    <button id="logoutBtn" class="small secondary" style="margin-right:8px;">خروج</button>
  </div>
</header>

<nav>
  <a href="inventory.html" class="active">المخزون</a>
  <a href="sales.html">المبيعات</a>
  <a href="shortages.html">النواقص</a>
  <a href="expenses.html">المصروفات</a>
  <a href="profit.html">الأرباح</a>
  <a href="search.html">🔍 بحث الأدوية</a>
  <a href="users.html">الإعدادات</a>
</nav>

<div class="card">
  <h2 id="formTitle">➕ إضافة منتج جديد</h2>
  <div class="grid">
    <div class="full-width">
      <label>1) اسم المنتج (بالعربي)</label>
      <input type="text" id="p_name" placeholder="مثال: أوجمنتين">
    </div>
    <div class="full-width">
      <label>الاسم بالإنجليزي</label>
      <input type="text" id="p_name_en" placeholder="مثال: Augmentin">
    </div>

    <div>
      <label>نوع الصنف</label>
      <div style="display:flex;gap:6px;">
        <select id="p_drug_type" style="margin-bottom:0;"></select>
        <button type="button" id="addTypeBtn" class="secondary small" style="white-space:nowrap;">+ جديد</button>
      </div>
    </div>
    <div>
      <label>الشكل الدوائي</label>
      <div style="display:flex;gap:6px;">
        <select id="p_shape" style="margin-bottom:0;"></select>
        <button type="button" id="addShapeBtn" class="secondary small" style="white-space:nowrap;">+ جديد</button>
      </div>
    </div>
    <div id="other_shape_wrap" class="hidden">
      <label>وضّح الشكل</label>
      <input type="text" id="p_other_shape_note" placeholder="مثال: بخاخ">
    </div>

    <div>
      <label>التصنيف</label>
      <div style="display:flex;gap:6px;">
        <select id="p_classification" style="margin-bottom:0;">
          <option value="">-- بدون --</option>
        </select>
        <button type="button" id="addClassBtn" class="secondary small" style="white-space:nowrap;">+ جديد</button>
      </div>
    </div>
    <div>
      <label>المورد</label>
      <select id="p_supplier">
        <option value="">-- بدون --</option>
      </select>
      <button type="button" id="addSupplierBtn" class="secondary small" style="margin-bottom:12px;">+ إضافة مورد جديد</button>
    </div>
    <div>
      <label>المادة الفعالة</label>
      <input type="text" id="p_active_ingredient" placeholder="مثال: Amoxicillin">
    </div>
    <div>
      <label>التركيز</label>
      <input type="text" id="p_concentration" placeholder="مثال: 1 gm">
    </div>
    <div>
      <label>قابل للبيع بالتجزئة (فردي)؟</label>
      <select id="p_retail_allowed">
        <option value="no">لا</option>
        <option value="yes">أيوه</option>
      </select>
    </div>

    <div id="field3_wrap">
      <label id="field3_label">العلبة فيها كام شريط؟</label>
      <input type="number" id="p_field3" value="1" min="1">
    </div>
    <div id="field4_wrap" class="hidden">
      <label id="field4_label">الشريط فيه كام حبة؟</label>
      <input type="number" id="p_field4" value="1" min="1">
    </div>

    <div>
      <label>سعر العلبة (جنيه)</label>
      <input type="number" id="p_box_price" step="0.01" placeholder="سعر البيع للعلبة كاملة">
    </div>
    <div>
      <label>الكمية (عدد العلب الكاملة المتاحة دلوقتي)</label>
      <input type="number" id="p_boxes_qty" value="0" min="0">
    </div>
    <div id="leftover_medium_wrap" class="hidden">
      <label id="leftover_medium_label">زيادة برّه العلب: كام شريط لوحده؟</label>
      <input type="number" id="p_leftover_medium" value="0" min="0">
    </div>
    <div id="leftover_small_wrap" class="hidden">
      <label id="leftover_small_label">زيادة فردية: كام حبة لوحدها؟</label>
      <input type="number" id="p_leftover_small" value="0" min="0">
    </div>

    <div class="section-label">بيانات إضافية</div>

    <div>
      <label>تاريخ انتهاء الصلاحية</label>
      <input type="date" id="p_expiry_date">
    </div>
    <div>
      <label>الحد الأدنى للتنبيه (بالوحدة الفردية)</label>
      <input type="number" id="p_min_threshold" value="0" min="0">
    </div>
    <div id="purchase_price_wrap" class="hidden">
      <label>🛒 سعر شراء العلبة (أدمن فقط)</label>
      <input type="number" id="p_purchase_price" step="0.01" placeholder="جنيه">
    </div>
    <div class="full-width">
      <label>كود QR / باركود (اختياري)</label>
      <div style="display:flex;gap:8px;">
        <input type="text" id="p_qr" placeholder="اضغط مسح أو اكتب الكود يدويًا" style="margin-bottom:0;">
        <button type="button" id="scanBtn" class="secondary" style="white-space:nowrap;">📷 مسح</button>
      </div>
    </div>
  </div>
  <button id="saveBtn">حفظ المنتج</button>
  <button id="cancelEditBtn" class="secondary hidden" style="margin-right:8px;">إلغاء التعديل</button>
  <div class="msg" id="addMsg"></div>
</div>

<div class="card" id="manageOptionsCard">
  <details>
    <summary style="cursor:pointer;color:#0d9488;font-weight:600;">⚙️ إدارة الاختيارات (تعديل/حذف أشكال، أنواع، تصنيفات، موردين)</summary>
    <input type="text" id="manageOptionsSearch" placeholder="🔍 ابحث في الاختيارات..." style="margin-top:12px;">
    <div id="manageOptionsWrap"></div>
  </details>
</div>

<div class="card">
  <h2>📋 المخزون الحالي</h2>
  <div class="toolbar">
    <input type="text" id="searchBox" placeholder="🔍 ابحث بالاسم..." style="flex:1;min-width:150px;margin-bottom:0;">
    <details class="filter-panel"><summary>الأشكال <span id="filterShapeCount"></span></summary><div id="filterShapeBox" class="filter-checks"></div></details>
    <details class="filter-panel"><summary>الأنواع <span id="filterTypeCount"></span></summary><div id="filterTypeBox" class="filter-checks"></div></details>
    <details class="filter-panel"><summary>التصنيفات <span id="filterClassCount"></span></summary><div id="filterClassBox" class="filter-checks"></div></details>
    <details class="filter-panel"><summary>الحالة <span id="filterAvailabilityCount"></span></summary><div id="filterAvailabilityBox" class="filter-checks">
      <label><input type="checkbox" class="availChk" value="available"> متوفر</label>
      <label><input type="checkbox" class="availChk" value="unavailable"> غير متوفر</label>
      <label><input type="checkbox" class="availChk" value="low"> ناقص</label>
    </div></details>
    <button type="button" id="exportBtn" class="secondary">⬇️ تصدير إكسيل</button>
    <button type="button" id="templateBtn" class="secondary">📄 نموذج فاضي للاستيراد</button>
    <button type="button" id="importBtn" class="secondary">⬆️ استيراد إكسيل</button>
    <input type="file" id="importFile" accept=".xlsx,.xls" class="hidden">
  </div>
  <p class="msg" id="importMsg"></p>
  <div id="tableWrap"><p class="loading">جاري التحميل...</p></div>
</div>

<div id="scanModal" class="scan-modal hidden">
  <div class="scan-box">
    <p class="scan-msg">وجّه الكاميرا على الباركود أو كود QR</p>
    <video id="scanVideo"></video>
    <p class="scan-msg" id="scanStatus"></p>
    <button type="button" id="closeScanBtn" class="secondary full-width" style="width:100%;margin-top:10px;">إلغاء</button>
  </div>
</div>

<script src="config.js"></script>
<script>
  window.onerror = function(msg, url, line) {
    document.body.insertAdjacentHTML('beforeend',
      '<div style="position:fixed;bottom:0;left:0;right:0;background:#f28b82;color:#000;padding:12px;font-size:12px;direction:ltr;text-align:left;">JS Error: ' + msg + ' (line ' + line + ')</div>');
  };
  window.onunhandledrejection = function(e) {
    document.body.insertAdjacentHTML('beforeend',
      '<div style="position:fixed;bottom:0;left:0;right:0;background:#f28b82;color:#000;padding:12px;font-size:12px;direction:ltr;text-align:left;">Promise Error: ' + (e.reason && e.reason.message ? e.reason.message : e.reason) + '</div>');
  };

  // خريطة بسيطة: بعض الأشكال بس ليها وحدة فردية خاصة (فوار=كيس، حقن=أمبولة)، والباقي "قطعة" بشكل عام
  const SMALL_UNIT_OVERRIDES = { 'فوار': 'sachet', 'حقن': 'ampoule', 'أمبول/حقن': 'ampoule' };
  const STRIP_SHAPES = ['برشام', 'قرص', 'لبوس']; // الأشكال اللي بتدعم مستوى "شريط" وسيط

  const UNIT_LABELS = { box: 'علبة', strip: 'شريط', piece: 'قطعة', ampoule: 'أمبولة', sachet: 'كيس', other: 'أخرى' };

  let currentUser = null;
  let isAdmin = false;
  let editingProductId = null;
  let scanReader = null;
  let customOptions = { drug_shape: [], drug_type: [], classification: [], supplier: [] };

  function getSmallUnitFor(shape) {
    return SMALL_UNIT_OVERRIDES[shape] || 'piece';
  }

  async function loadCustomOptions() {
    const { data, error } = await sb.from('custom_options').select('category, parent, value').order('value');
    if (error) return;
    customOptions = { drug_shape: [], drug_type: [], classification: [], supplier: [] };
    (data || []).forEach(o => {
      if (!customOptions[o.category]) customOptions[o.category] = [];
      customOptions[o.category].push({ parent: o.parent, value: o.value });
    });

    const typeSel = document.getElementById('p_drug_type');
    typeSel.innerHTML = customOptions.drug_type.map(o => '<option value="' + escapeHtml(o.value) + '">' + escapeHtml(o.value) + '</option>').join('');

    const classSel = document.getElementById('p_classification');
    classSel.innerHTML = '<option value="">-- بدون --</option>' +
      customOptions.classification.map(o => '<option value="' + escapeHtml(o.value) + '">' + escapeHtml(o.value) + '</option>').join('');

    const supplierSel = document.getElementById('p_supplier');
    supplierSel.innerHTML = '<option value="">-- بدون --</option>' +
      customOptions.supplier.map(o => '<option value="' + escapeHtml(o.value) + '">' + escapeHtml(o.value) + '</option>').join('');

    updateShapeOptionsForType();
    populateFilterDropdowns();
    renderManageOptionsPanel();
  }

  function renderManageOptionsPanel() {
    const wrap = document.getElementById('manageOptionsWrap');
    if (!wrap) return;
    if (!isAdmin) { wrap.innerHTML = '<p style="font-size:12px;color:#6b7684;">تعديل/حذف الاختيارات متاح للأدمن بس.</p>'; return; }

    const term = (document.getElementById('manageOptionsSearch').value || '').trim().toLowerCase();
    const catLabels = { drug_shape: 'الأشكال الدوائية', drug_type: 'أنواع الصنف', classification: 'التصنيفات', supplier: 'الموردين' };
    let html = '';
    for (const cat of ['drug_shape', 'drug_type', 'classification', 'supplier']) {
      const items = (customOptions[cat] || []).filter(o => !term || o.value.toLowerCase().includes(term));
      if (term && items.length === 0) continue;

      html += '<div style="margin-bottom:14px;"><div style="font-size:12px;color:#b7c9be;margin-bottom:6px;">' + catLabels[cat] + '</div>';
      if (items.length === 0) {
        html += '<p style="font-size:12px;color:#6b7684;">مفيش اختيارات مضافة</p>';
      } else {
        html += '<div style="display:flex;gap:6px;flex-wrap:wrap;">';
        items.forEach(o => {
          const label = o.parent ? (o.value + ' (' + o.parent + ')') : o.value;
          const safeParent = escapeHtml((o.parent || '').replace(/'/g, "\\'"));
          const safeValue = escapeHtml(o.value.replace(/'/g, "\\'"));
          html += '<span style="background:#f4f6f8;border:1px solid #e2e6ea;border-radius:20px;padding:4px 10px;font-size:12px;display:flex;align-items:center;gap:8px;">' +
            escapeHtml(label) +
            '<button type="button" onclick="editCustomOption(\'' + cat + '\', \'' + safeParent + '\', \'' + safeValue + '\')" style="background:none;border:none;color:#0d9488;cursor:pointer;padding:0;font-size:13px;">✎</button>' +
            '<button type="button" onclick="deleteCustomOption(\'' + cat + '\', \'' + safeParent + '\', \'' + safeValue + '\')" style="background:none;border:none;color:#f28b82;cursor:pointer;padding:0;font-size:13px;">✕</button>' +
            '</span>';
        });
        html += '</div>';
      }
      html += '</div>';
    }
    wrap.innerHTML = html || '<p style="font-size:12px;color:#6b7684;">مفيش نتائج مطابقة للبحث</p>';
  }

  document.getElementById('manageOptionsSearch').addEventListener('input', renderManageOptionsPanel);

  window.editCustomOption = async function(category, parent, oldValue) {
    const newValue = prompt('اكتب الاسم الجديد بدل "' + oldValue + '":', oldValue);
    if (!newValue || !newValue.trim() || newValue.trim() === oldValue) return;

    let query = sb.from('custom_options').update({ value: newValue.trim() }).eq('category', category).eq('value', oldValue);
    query = parent ? query.eq('parent', parent) : query.is('parent', null);
    const { error } = await query;
    if (error) { alert('تعذّر التعديل: ' + error.message); return; }

    // نحدّث الأصناف اللي كانت مستخدمة الاسم القديم عشان تفضل متسقة
    if (category === 'drug_shape') await sb.from('products').update({ shape: newValue.trim() }).eq('shape', oldValue);
    if (category === 'drug_type') await sb.from('products').update({ drug_type: newValue.trim() }).eq('drug_type', oldValue);
    if (category === 'classification') await sb.from('products').update({ classification: newValue.trim() }).eq('classification', oldValue);
    if (category === 'supplier') await sb.from('products').update({ supplier: newValue.trim() }).eq('supplier', oldValue);

    await loadCustomOptions();
    await loadInventory();
  };

  window.deleteCustomOption = async function(category, parent, value) {
    if (!confirm('متأكد إنك عايز تمسح "' + value + '"؟ (الأصناف اللي مسجّلة بيه مش هتتمسح، بس مش هتلاقيه في القايمة تاني)')) return;
    let query = sb.from('custom_options').delete().eq('category', category).eq('value', value);
    query = parent ? query.eq('parent', parent) : query.is('parent', null);
    const { error } = await query;
    if (error) { alert('تعذّر الحذف: ' + error.message); return; }
    await loadCustomOptions();
  };

  function updateShapeOptionsForType() {
    const type = document.getElementById('p_drug_type').value;
    const shapeSel = document.getElementById('p_shape');
    const shapes = customOptions.drug_shape.filter(o => o.parent === type);
    shapeSel.innerHTML = shapes.map(o => '<option value="' + escapeHtml(o.value) + '">' + escapeHtml(o.value) + '</option>').join('');
    updateShapeFields();
  }

  function buildCheckboxes(containerId, countId, options, groupClass) {
    const box = document.getElementById(containerId);
    box.innerHTML = options.map(v =>
      '<label><input type="checkbox" class="' + groupClass + '" value="' + escapeHtml(v) + '"> ' + escapeHtml(v) + '</label>'
    ).join('');
    box.querySelectorAll('input').forEach(chk => chk.addEventListener('change', () => {
      updateFilterCount(groupClass, countId);
      renderInventoryTable(document.getElementById('searchBox').value);
    }));
  }

  function updateFilterCount(groupClass, countId) {
    const n = document.querySelectorAll('.' + groupClass + ':checked').length;
    document.getElementById(countId).textContent = n > 0 ? '(' + n + ')' : '';
  }

  function getChecked(groupClass) {
    return Array.from(document.querySelectorAll('.' + groupClass + ':checked')).map(c => c.value);
  }

  function populateFilterDropdowns() {
    buildCheckboxes('filterShapeBox', 'filterShapeCount', customOptions.drug_shape.map(o => o.value), 'shapeChk');
    buildCheckboxes('filterTypeBox', 'filterTypeCount', customOptions.drug_type.map(o => o.value), 'typeChk');
    buildCheckboxes('filterClassBox', 'filterClassCount', customOptions.classification.map(o => o.value), 'classChk');
  }

  document.querySelectorAll('.availChk').forEach(chk => chk.addEventListener('change', () => {
    updateFilterCount('availChk', 'filterAvailabilityCount');
    renderInventoryTable(document.getElementById('searchBox').value);
  }));

  document.getElementById('p_drug_type').addEventListener('change', updateShapeOptionsForType);

  async function addCustomOption(category, parent) {
    const label = category === 'drug_shape' ? 'الشكل الدوائي' : (category === 'classification' ? 'التصنيف' : (category === 'supplier' ? 'المورد' : 'النوع'));
    const value = prompt('اكتب اسم ' + label + ' الجديد:');
    if (!value || !value.trim()) return;
    const { error } = await sb.from('custom_options').insert({ category, parent: parent || null, value: value.trim() });
    if (error) { alert('تعذّرت الإضافة: ' + error.message); return; }
    await loadCustomOptions();
    if (category === 'drug_shape') document.getElementById('p_shape').value = value.trim();
    if (category === 'classification') document.getElementById('p_classification').value = value.trim();
    if (category === 'supplier') document.getElementById('p_supplier').value = value.trim();
    if (category === 'drug_type') { document.getElementById('p_drug_type').value = value.trim(); updateShapeOptionsForType(); }
  }

  document.getElementById('addShapeBtn').addEventListener('click', () => {
    addCustomOption('drug_shape', document.getElementById('p_drug_type').value);
  });
  document.getElementById('addClassBtn').addEventListener('click', () => {
    addCustomOption('classification', null);
  });
  document.getElementById('addTypeBtn').addEventListener('click', () => {
    addCustomOption('drug_type', null);
  });
  document.getElementById('addSupplierBtn').addEventListener('click', () => {
    addCustomOption('supplier', null);
  });

  (async () => {
    const auth = await requireAuth();
    if (!auth) return;
    if (!guardPageAccess(auth.profile, 'inventory')) return;
    currentUser = auth.user;
    isAdmin = auth.profile.role === 'admin';

    document.getElementById('userinfo').textContent =
      auth.profile.full_name + ' (' + (isAdmin ? 'أدمن' : 'موظف') + ')';

    if (isAdmin) document.getElementById('purchase_price_wrap').classList.remove('hidden');

    await loadCustomOptions();
    updateShapeFields();
    await loadInventory();

    const params = new URLSearchParams(window.location.search);
    const incomingSearch = params.get('search');
    if (incomingSearch) {
      document.getElementById('searchBox').value = incomingSearch;
      renderInventoryTable(incomingSearch);
    }
  })();

  document.getElementById('logoutBtn').addEventListener('click', async () => {
    await sb.auth.signOut();
    window.location.href = 'index.html';
  });

  // ------------------------------------------------------------
  // منطق إظهار/تسمية الخانات حسب شكل الدواء
  // ------------------------------------------------------------
  document.getElementById('p_shape').addEventListener('change', updateShapeFields);
  document.getElementById('p_retail_allowed').addEventListener('change', updateShapeFields);

  function updateShapeFields() {
    const shape = document.getElementById('p_shape').value;
    const retailAllowed = document.getElementById('p_retail_allowed').value === 'yes';
    const supportsStrip = STRIP_SHAPES.includes(shape);
    const smallUnit = getSmallUnitFor(shape);

    document.getElementById('other_shape_wrap').classList.toggle('hidden', shape !== 'أخرى');

    if (!retailAllowed) {
      // مش قابل للبيع بالتجزئة: العلبة وحدة واحدة كاملة، مفيش تفكيك خالص
      document.getElementById('field3_wrap').classList.add('hidden');
      document.getElementById('field4_wrap').classList.add('hidden');
      document.getElementById('leftover_medium_wrap').classList.add('hidden');
      document.getElementById('leftover_small_wrap').classList.add('hidden');
      document.getElementById('p_field3').value = 1;
      document.getElementById('p_field4').value = 1;
      document.getElementById('p_leftover_medium').value = 0;
      document.getElementById('p_leftover_small').value = 0;
      return;
    }

    document.getElementById('leftover_small_wrap').classList.remove('hidden');
    const smallUnitLabel = shape === 'أخرى' ? 'وحدة فردية' : UNIT_LABELS[smallUnit];

    if (supportsStrip) {
      document.getElementById('field3_wrap').classList.remove('hidden');
      document.getElementById('field3_label').textContent = 'العلبة فيها كام شريط؟';
      document.getElementById('field4_wrap').classList.remove('hidden');
      document.getElementById('field4_label').textContent = 'الشريط فيه كام حبة؟';
      document.getElementById('leftover_medium_wrap').classList.remove('hidden');
      document.getElementById('leftover_medium_label').textContent = 'زيادة برّه العلب: كام شريط لوحده؟';
    } else {
      document.getElementById('field3_wrap').classList.add('hidden');
      document.getElementById('p_field3').value = 1;
      document.getElementById('leftover_medium_wrap').classList.add('hidden');
      document.getElementById('p_leftover_medium').value = 0;
      document.getElementById('field4_wrap').classList.remove('hidden');
      document.getElementById('field4_label').textContent = 'العلبة فيها كام ' + smallUnitLabel + '؟';
    }
    document.getElementById('leftover_small_label').textContent = 'زيادة فردية: كام ' + smallUnitLabel + ' لوحدها؟';
  }

  // ------------------------------------------------------------
  // حفظ / تعديل منتج
  // ------------------------------------------------------------
  document.getElementById('saveBtn').addEventListener('click', async () => {
    const saveBtn = document.getElementById('saveBtn');

    const name = document.getElementById('p_name').value.trim();
    const nameEn = document.getElementById('p_name_en').value.trim();
    const drugType = document.getElementById('p_drug_type').value;
    const shape = document.getElementById('p_shape').value;
    const classification = document.getElementById('p_classification').value || null;
    const supplier = document.getElementById('p_supplier').value || null;
    const activeIngredient = document.getElementById('p_active_ingredient').value.trim() || null;
    const concentration = document.getElementById('p_concentration').value.trim() || null;
    const retailAllowed = document.getElementById('p_retail_allowed').value === 'yes';
    const otherShapeNote = document.getElementById('p_other_shape_note').value.trim();

    const supportsStrip = STRIP_SHAPES.includes(shape);
    const field3 = retailAllowed ? (parseInt(document.getElementById('p_field3').value) || 1) : 1;
    const field4 = retailAllowed ? (parseInt(document.getElementById('p_field4').value) || 1) : 1;

    const boxPrice = document.getElementById('p_box_price').value;
    const boxesQty = parseFloat(document.getElementById('p_boxes_qty').value) || 0;
    const leftoverMedium = retailAllowed ? (parseFloat(document.getElementById('p_leftover_medium').value) || 0) : 0;
    const leftoverSmall = retailAllowed ? (parseFloat(document.getElementById('p_leftover_small').value) || 0) : 0;
    const expiryDate = document.getElementById('p_expiry_date').value || null;
    const minThreshold = parseFloat(document.getElementById('p_min_threshold').value) || 0;
    const purchasePriceRaw = document.getElementById('p_purchase_price').value;
    const qr = document.getElementById('p_qr').value.trim() || null;

    if (!name) { showAddMsg('لازم تكتب اسم المنتج', 'error'); return; }

    saveBtn.disabled = true;
    saveBtn.textContent = 'جاري الحفظ...';

    try {
      const useThreeLevels = retailAllowed && supportsStrip && field3 > 1;
      const productPayload = {
        name,
        name_en: nameEn || null,
        drug_type: drugType,
        classification,
        supplier,
        active_ingredient: activeIngredient,
        concentration,
        retail_allowed: retailAllowed,
        unit_large: useThreeLevels ? 'box' : null,
        unit_large_to_medium: useThreeLevels ? field3 : null,
        unit_medium: useThreeLevels ? 'strip' : 'box',
        unit_medium_to_small: field4,
        unit_small: shape === 'أخرى' ? 'other' : getSmallUnitFor(shape),
        other_note: (shape === 'أخرى' ? otherShapeNote : null),
        expiry_date: expiryDate,
        min_stock_threshold: minThreshold,
        default_sale_price: boxPrice ? parseFloat(boxPrice) : null,
        qr_code: qr,
        shape: shape
      };

      let productId;
      const totalSmallPerBox = field3 * field4;
      const totalSmall = (boxesQty * totalSmallPerBox) + (leftoverMedium * field4) + leftoverSmall;

      if (editingProductId) {
        const { data: updatedRows, error: updateError } = await sb
          .from('products').update(productPayload).eq('id', editingProductId).select();
        if (updateError) throw updateError;
        if (!updatedRows || updatedRows.length === 0) {
          throw new Error('التعديل لم يُحفظ (صلاحية مرفوضة أو المنتج مش موجود). جرّب تسجّل خروج ودخول تاني.');
        }
        productId = editingProductId;

        const { data: updatedInv, error: invError } = await sb
          .from('inventory').update({ quantity_smallest_unit: totalSmall }).eq('product_id', productId).select();
        if (invError) throw invError;
        if (!updatedInv || updatedInv.length === 0) {
          await sb.from('inventory').insert({ product_id: productId, quantity_smallest_unit: totalSmall });
        }
      } else {
        productPayload.created_by = currentUser.id;
        const { data: product, error: productError } = await sb
          .from('products').insert(productPayload).select().single();
        if (productError) throw productError;
        productId = product.id;

        const { error: invError } = await sb
          .from('inventory').insert({ product_id: productId, quantity_smallest_unit: totalSmall });
        if (invError) throw invError;
      }

      if (isAdmin && purchasePriceRaw) {
        await sb.from('product_costs').upsert({
          product_id: productId,
          purchase_price: parseFloat(purchasePriceRaw),
          updated_by: currentUser.id
        });
      }

      showAddMsg(editingProductId ? 'تم تعديل المنتج بنجاح ✅' : 'تم حفظ المنتج بنجاح ✅', 'ok');
      resetForm();
      await loadInventory();
    } catch (err) {
      showAddMsg('حصل خطأ: ' + (err.message || JSON.stringify(err)), 'error');
    } finally {
      saveBtn.disabled = false;
      saveBtn.textContent = editingProductId ? 'حفظ التعديل' : 'حفظ المنتج';
    }
  });

  let nativeDetectorStream = null;
  let nativeDetectorLoop = null;

  document.getElementById('scanBtn').addEventListener('click', startScan);
  document.getElementById('closeScanBtn').addEventListener('click', stopScan);

  function playBeep() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.frequency.value = 1000;
      gain.gain.setValueAtTime(0.3, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.15);
      osc.start();
      osc.stop(ctx.currentTime + 0.15);
    } catch (e) { /* تجاهل لو المتصفح مانع الصوت */ }
  }

  function handleScanResult(code) {
    playBeep();
    document.getElementById('p_qr').value = code;
    const existing = (window._productsCache || []).find(p => p.qr_code === code);
    const status = document.getElementById('scanStatus');
    if (existing) {
      status.textContent = 'الكود ده مسجّل بالفعل لصنف "' + existing.name + '"';
    } else {
      status.textContent = 'تم المسح ✅ (صنف جديد)';
    }
    stopScan();
    if (existing) {
      editProduct(existing.id);
      showAddMsg('الكود ده لصنف موجود: "' + existing.name + '" — عدّل الكمية اللي جالك وادوس حفظ', 'ok');
    }
  }

  async function startScan() {
    const modal = document.getElementById('scanModal');
    const status = document.getElementById('scanStatus');
    const videoEl = document.getElementById('scanVideo');
    modal.classList.remove('hidden');
    status.textContent = 'جاري تشغيل الكاميرا...';

    // 1) نجرب الأول محرّك المسح الأصلي المدمج في المتصفح (نفس محرك جوجل، أسرع وأدق بكتير)
    if ('BarcodeDetector' in window) {
      try {
        const supported = await window.BarcodeDetector.getSupportedFormats();
        const formats = ['ean_13', 'ean_8', 'upc_a', 'code_128', 'qr_code'].filter(f => supported.includes(f));
        const detector = new window.BarcodeDetector({ formats: formats.length ? formats : undefined });

        nativeDetectorStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } }
        });
        videoEl.srcObject = nativeDetectorStream;
        await videoEl.play();
        status.textContent = 'جاري المسح...';

        let attemptCount = 0;
        nativeDetectorLoop = setInterval(async () => {
          if (!nativeDetectorStream) return;
          attemptCount++;
          try {
            const barcodes = await detector.detect(videoEl);
            if (barcodes.length > 0) {
              handleScanResult(barcodes[0].rawValue);
            } else {
              status.textContent = 'جاري المسح... (محاولة رقم ' + attemptCount + ')';
            }
          } catch (e) { /* نتجاهل فشل فريم واحد ونكمل */ }
        }, 300);
        return;
      } catch (err) {
        stopScan();
        status.textContent = 'تعذّر تشغيل المحرك الأصلي، هنجرب البديل...';
      }
    }

    // 2) بديل احتياطي: مكتبة ZXing
    modal.classList.remove('hidden');
    status.textContent = 'جاري تشغيل الكاميرا (وضع بديل)...';
    try {
      const hints = new Map();
      hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
      hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [
        ZXing.BarcodeFormat.EAN_13,
        ZXing.BarcodeFormat.EAN_8,
        ZXing.BarcodeFormat.UPC_A,
        ZXing.BarcodeFormat.CODE_128,
        ZXing.BarcodeFormat.QR_CODE
      ]);
      scanReader = new ZXing.BrowserMultiFormatReader(hints);
      let attemptCount = 0;
      await scanReader.decodeFromConstraints(
        {
          video: {
            facingMode: 'environment',
            width: { ideal: 1920 },
            height: { ideal: 1080 },
            advanced: [{ focusMode: 'continuous' }]
          }
        }, videoEl,
        (result, err) => {
          attemptCount++;
          if (result) {
            handleScanResult(result.getText());
          } else if (err && err.message && !/No MultiFormat Readers|not found|NotFound/i.test(err.message)) {
            status.textContent = 'خطأ أثناء المسح: ' + err.message;
          } else {
            status.textContent = 'جاري المسح... (محاولة رقم ' + attemptCount + ')';
          }
        }
      );
    } catch (err) {
      status.textContent = 'تعذّر تشغيل الكاميرا: ' + err.message;
    }
  }

  function stopScan() {
    if (scanReader) { scanReader.reset(); scanReader = null; }
    if (nativeDetectorLoop) { clearInterval(nativeDetectorLoop); nativeDetectorLoop = null; }
    if (nativeDetectorStream) { nativeDetectorStream.getTracks().forEach(t => t.stop()); nativeDetectorStream = null; }
    document.getElementById('scanModal').classList.add('hidden');
  }

  async function loadInventory() {
    const wrap = document.getElementById('tableWrap');
    const { data: products, error } = await sb
      .from('products')
      .select('id, name, name_en, shape, drug_type, classification, supplier, active_ingredient, concentration, retail_allowed, qr_code, unit_large, unit_large_to_medium, unit_medium, unit_medium_to_small, unit_small, expiry_date, min_stock_threshold, other_note, default_sale_price, inventory(quantity_smallest_unit)')
      .order('created_at', { ascending: false });

    if (error) {
      wrap.innerHTML = '<p class="msg error">تعذّر تحميل المخزون: ' + error.message + '</p>';
      return;
    }
    window._productsCache = products || [];
    renderInventoryTable(document.getElementById('searchBox').value);
  }

  function getInvQty(p) {
    if (!p.inventory) return 0;
    const row = Array.isArray(p.inventory) ? p.inventory[0] : p.inventory;
    return row ? row.quantity_smallest_unit : 0;
  }

  function totalSmallPerBox(p) {
    return (p.unit_large_to_medium || 1) * (p.unit_medium_to_small || 1);
  }

  function normalizeForSearch(s) {
    return (s || '').toString().toLowerCase().replace(/\s+/g, '');
  }

  function fuzzyIncludes(haystack, term) {
    if (!term) return true;
    const normHay = normalizeForSearch(haystack);
    const normTerm = normalizeForSearch(term);
    if (normHay.includes(normTerm)) return true;
    const words = term.trim().split(/\s+/).filter(Boolean);
    if (words.length > 1) return words.every(w => normHay.includes(normalizeForSearch(w)));
    return false;
  }

  function renderInventoryTable(searchText) {
    const wrap = document.getElementById('tableWrap');
    const term = (searchText || '').trim();
    const shapeFilters = getChecked('shapeChk');
    const typeFilters = getChecked('typeChk');
    const classFilters = getChecked('classChk');
    const availFilters = getChecked('availChk');

    const products = (window._productsCache || []).filter(p => {
      const qty = getInvQty(p);
      const threshold = p.min_stock_threshold || 0;
      const isAvailable = qty > threshold;
      const isLow = qty > 0 && qty <= threshold;
      const isUnavailable = qty <= 0;

      if (term && !fuzzyIncludes((p.name || '') + ' ' + (p.name_en || ''), term)) return false;
      if (shapeFilters.length && !shapeFilters.includes(p.shape)) return false;
      if (typeFilters.length && !typeFilters.includes(p.drug_type)) return false;
      if (classFilters.length && !classFilters.includes(p.classification)) return false;
      if (availFilters.length) {
        const matches =
          (availFilters.includes('available') && isAvailable) ||
          (availFilters.includes('unavailable') && isUnavailable) ||
          (availFilters.includes('low') && isLow);
        if (!matches) return false;
      }
      return true;
    });

    if (products.length === 0) {
      wrap.innerHTML = '<p class="loading">' + (term ? 'مفيش منتج مطابق للبحث' : 'لا توجد منتجات مضافة بعد') + '</p>';
      return;
    }

    let html = '<table><thead><tr><th>المنتج</th><th>النوع</th><th>الكمية</th><th>سعر العلبة</th><th>الصلاحية</th><th>إجراءات</th></tr></thead><tbody>';

    for (const p of products) {
      const qty = getInvQty(p);
      const perBox = totalSmallPerBox(p);
      const boxes = Math.floor(qty / perBox);
      const remainder = qty % perBox;
      const smallLabel = p.unit_small === 'other' ? (p.other_note || 'أخرى') : UNIT_LABELS[p.unit_small];
      const qtyDisplay = perBox > 1 ? (boxes + ' علبة' + (remainder > 0 ? ' + ' + remainder + ' ' + smallLabel : '')) : (qty + ' علبة');
      const isLow = qty <= (p.min_stock_threshold || 0);
      const expiryText = p.expiry_date || '—';
      const priceText = p.default_sale_price ? p.default_sale_price + ' ج' : '—';

      html += '<tr>' +
        '<td>' + escapeHtml(p.name) + '</td>' +
        '<td>' + escapeHtml((p.shape === 'أخرى' && p.other_note) ? p.other_note : (p.shape || '—')) + '</td>' +
        '<td class="' + (isLow ? 'low-stock' : '') + '">' +
          '<div class="qty-edit">' +
            '<span>' + qtyDisplay + (isLow ? ' ⚠️' : '') + '</span>' +
          '</div>' +
          '<div class="qty-edit" style="margin-top:4px;">' +
            '<input type="number" min="0" placeholder="عدد العلب" id="qedit_' + p.id + '">' +
            '<button class="small secondary" onclick="quickEditQty(\'' + p.id + '\', ' + perBox + ')">تحديث</button>' +
          '</div>' +
        '</td>' +
        '<td>' + priceText + '</td>' +
        '<td>' + expiryText + '</td>' +
        '<td class="actions-cell">' +
          '<button class="small secondary" onclick="editProduct(\'' + p.id + '\')">تعديل</button> ' +
          (isAdmin ? '<button class="small danger" onclick="deleteProduct(\'' + p.id + '\', \'' + escapeHtml(p.name).replace(/'/g, "\\'") + '\')">مسح</button>' : '') +
        '</td>' +
        '</tr>';
    }

    html += '</tbody></table>';
    wrap.innerHTML = html;
  }

  document.getElementById('importFile').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const importMsg = document.getElementById('importMsg');
    importMsg.textContent = 'جاري قراءة الملف...';
    importMsg.className = 'msg';
    const oldDetails = importMsg.nextElementSibling;
    if (oldDetails && oldDetails.tagName === 'DIV') oldDetails.remove();

    try {
      const buf = await file.arrayBuffer();
      const wb = XLSX.read(buf, { type: 'array' });
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws);

      if (rows.length === 0) throw new Error('الملف فاضي أو الأعمدة مش متطابقة');

      let successCount = 0;
      let errorRows = [];
      let newOptionsToAdd = [];

      function getCol(row, ...possibleNames) {
        const cleanRow = {};
        for (const key in row) cleanRow[key.trim()] = row[key];
        for (const name of possibleNames) {
          if (cleanRow[name] !== undefined && cleanRow[name] !== '') return cleanRow[name];
        }
        return null;
      }

      function parseExcelDate(expiryDate) {
        if (expiryDate instanceof Date) return expiryDate.toISOString().split('T')[0];
        if (typeof expiryDate === 'number') {
          const parsed = XLSX.SSF.parse_date_code(expiryDate);
          return parsed ? `${parsed.y}-${String(parsed.m).padStart(2,'0')}-${String(parsed.d).padStart(2,'0')}` : null;
        }
        if (typeof expiryDate === 'string' && expiryDate.trim()) {
          const s = expiryDate.trim();
          const mmYyyy = s.match(/^(\d{1,2})\/(\d{4})$/);
          const ddMmYyyy = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
          const isoLike = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
          if (mmYyyy) return `${mmYyyy[2]}-${mmYyyy[1].padStart(2,'0')}-01`;
          if (ddMmYyyy) return `${ddMmYyyy[3]}-${ddMmYyyy[2].padStart(2,'0')}-${ddMmYyyy[1].padStart(2,'0')}`;
          if (isoLike) return `${isoLike[1]}-${isoLike[2].padStart(2,'0')}-${isoLike[3].padStart(2,'0')}`;
          return null;
        }
        return null;
      }

      for (const row of rows) {
        const name = getCol(row, 'الاسم العربي', 'اسم الصنف', 'الاسم', 'name');
        if (!name) { errorRows.push('(صف بدون اسم صنف - اتجاهل)'); continue; }

        const nameEn = getCol(row, 'English Name', 'الاسم بالانجليزي');
        const activeIngredient = getCol(row, 'المادة الفعالة');
        const concentration = getCol(row, 'التركيز');
        const drugType = getCol(row, 'نوع الصنف') || 'أدوية';
        const shape = getCol(row, 'الشكل الدوائي', 'النوع', 'الشكل') || 'أخرى';
        const classification = getCol(row, 'التصنيف');
        const salePrice = getCol(row, 'السعر', 'سعر البيع (للعلبة)', 'سعر البيع');
        const purchasePrice = getCol(row, 'سعر الشراء (للعلبة)', 'سعر الشراء');
        const boxesQty = parseFloat(getCol(row, 'عدد العلب', 'الكمية (عدد علب)', 'الكمية') || 0) || 0;
        const stripsPerBox = parseInt(getCol(row, 'شرائط/علبة') || 1) || 1;
        const pillsPerStrip = parseInt(getCol(row, 'حبات/شريط', 'كام قرص/كيس/أمبول في العلبة') || 1) || 1;
        const barcode = getCol(row, 'الباركود', 'باركود', 'كود QR');
        const expiryDate = parseExcelDate(getCol(row, 'تاريخ انتهاء الصلاحية', 'تاريخ الانتهاء'));

        // 3 مستويات لو فيه أكتر من شريط في العلبة، وإلا مستويين بس
        const useThreeLevels = stripsPerBox > 1;
        const retailAllowed = pillsPerStrip > 1 || stripsPerBox > 1;

        try {
          const { data: product, error: prodErr } = await sb.from('products').insert({
            name: String(name).trim(),
            name_en: nameEn ? String(nameEn).trim() : null,
            active_ingredient: activeIngredient ? String(activeIngredient).trim() : null,
            concentration: concentration ? String(concentration).trim() : null,
            drug_type: String(drugType).trim(),
            shape: String(shape).trim(),
            classification: classification ? String(classification).trim() : null,
            retail_allowed: retailAllowed,
            unit_large: useThreeLevels ? 'box' : null,
            unit_large_to_medium: useThreeLevels ? stripsPerBox : null,
            unit_medium: useThreeLevels ? 'strip' : 'box',
            unit_medium_to_small: pillsPerStrip,
            unit_small: getSmallUnitFor(shape),
            default_sale_price: salePrice ? parseFloat(salePrice) : null,
            expiry_date: expiryDate,
            qr_code: barcode ? String(barcode) : null,
            created_by: currentUser.id
          }).select().single();
          if (prodErr) throw prodErr;

          const totalPerBox = (useThreeLevels ? stripsPerBox : 1) * pillsPerStrip;
          await sb.from('inventory').insert({ product_id: product.id, quantity_smallest_unit: boxesQty * totalPerBox });

          if (isAdmin && purchasePrice) {
            await sb.from('product_costs').upsert({ product_id: product.id, purchase_price: parseFloat(purchasePrice), updated_by: currentUser.id });
          }

          // نسجّل الشكل/التصنيف الجديد في قايمة الاختيارات لو مش موجود قبل كده
          if (shape && !customOptions.drug_shape.some(o => o.value === shape && o.parent === drugType)) {
            newOptionsToAdd.push({ category: 'drug_shape', parent: String(drugType).trim(), value: String(shape).trim() });
          }
          if (classification && !customOptions.classification.some(o => o.value === classification)) {
            newOptionsToAdd.push({ category: 'classification', parent: null, value: String(classification).trim() });
          }

          successCount++;
        } catch (err) {
          errorRows.push(name + ': ' + err.message);
        }
      }

      // نضيف أي أشكال/تصنيفات جديدة ظهرت في الشيت للقايمة تلقائيًا (بدون تكرار)
      if (newOptionsToAdd.length) {
        const unique = Array.from(new Map(newOptionsToAdd.map(o => [o.category + '|' + o.parent + '|' + o.value, o])).values());
        await sb.from('custom_options').upsert(unique, { onConflict: 'category,parent,value', ignoreDuplicates: true });
      }

      importMsg.textContent = 'تم استيراد ' + successCount + ' صنف بنجاح' + (errorRows.length ? (' — فشل ' + errorRows.length + ' صنف') : '');
      importMsg.className = 'msg ' + (errorRows.length ? 'error' : 'ok');
      if (errorRows.length) {
        const detailsBox = document.createElement('div');
        detailsBox.style.cssText = 'margin-top:10px;font-size:12px;color:#f28b82;max-height:200px;overflow-y:auto;background:#f4f6f8;border:1px solid #e2e6ea;border-radius:8px;padding:10px;';
        detailsBox.innerHTML = errorRows.slice(0, 20).map(e => escapeHtml(String(e))).join('<br>');
        importMsg.insertAdjacentElement('afterend', detailsBox);
      }

      try {
        await loadCustomOptions();
        await loadInventory();
      } catch (refreshErr) {
        console.log('تعذّر تحديث عرض الجدول بعد الاستيراد:', refreshErr);
      }
    } catch (err) {
      importMsg.textContent = 'تعذّر الاستيراد: ' + err.message;
      importMsg.className = 'msg error';
    }
    e.target.value = '';
  });

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }
</script>

</body>
</html>
