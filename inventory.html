<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>المنتجات - نظام إدارة الصيدلية</title>
<script src="supabase-lib.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body class="has-sidebar">
<header><button id="menuToggle">☰</button><h1>📦 نظام إدارة الصيدلية</h1><div><span class="userinfo" id="userinfo"></span><button id="logoutBtn" class="small secondary">خروج</button></div></header>
<nav>
<a href="inventory.html" class="active">المخزون</a><a href="inventory-form.html">➕ إضافة منتج</a><a href="sales.html">المبيعات</a><a href="invoices.html">🧾 الفواتير</a><a href="shortages.html">النواقص</a><a href="expenses.html">المصروفات</a><a href="profit.html">الأرباح</a><a href="search.html">🔍 بحث الأدوية</a><a href="users.html">الإعدادات</a>
</nav>
<div id="sidebarOverlay" class="sidebar-overlay"></div>
<main class="main-content">
<div class="card">
<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><div><h2 style="margin-bottom:4px">📋 المنتجات</h2><div id="resultInfo" class="msg"></div></div><a href="inventory-form.html" class="button" style="text-decoration:none">➕ تسجيل منتج</a></div>
<div class="toolbar" style="margin-top:14px;display:grid;grid-template-columns:minmax(220px,2fr) repeat(4,minmax(140px,1fr));gap:8px">
<input id="search" placeholder="🔍 ابحث بالاسم أو الباركود...">
<select id="shape"><option value="">كل الأشكال</option></select>
<select id="type"><option value="">كل الأنواع</option></select>
<select id="classification"><option value="">كل التصنيفات</option></select>
<select id="supplier"><option value="">كل الموردين</option></select>
</div>
<div id="tableWrap"><p class="loading">جاري التحميل...</p></div>
<div id="pager" style="display:flex;justify-content:center;align-items:center;gap:8px;margin-top:14px;flex-wrap:wrap"></div>
</div>
</main>
<script src="config.js"></script>
<script>
let page=0;const PAGE_SIZE=50;let timer=null;
const $=id=>document.getElementById(id);
const esc=s=>{const d=document.createElement('div');d.textContent=s??'';return d.innerHTML};
function opts(id,values,first){const el=$(id);el.innerHTML='<option value="">'+first+'</option>'+[...new Set(values.filter(Boolean).map(String))].sort((a,b)=>a.localeCompare(b,'ar')).map(v=>'<option value="'+esc(v)+'">'+esc(v)+'</option>').join('')}
async function loadOptions(){const {data,error}=await sb.from('custom_options').select('category,value').order('value');if(error)return;const m={drug_shape:[],drug_type:[],classification:[],supplier:[]};(data||[]).forEach(x=>{if(m[x.category])m[x.category].push(x.value)});opts('shape',m.drug_shape,'كل الأشكال');opts('type',m.drug_type,'كل الأنواع');opts('classification',m.classification,'كل التصنيفات');opts('supplier',m.supplier,'كل الموردين')}
function escLike(v){return String(v).replace(/[(),]/g,' ').trim()}
async function load(){
 const wrap=$('tableWrap');wrap.innerHTML='<p class="loading">جاري التحميل...</p>';
 const term=$('search').value.trim();let q=sb.from('products').select('id,name,name_en,shape,drug_type,classification,supplier,expiry_date,default_sale_price,qr_code,unit_large,unit_large_to_medium,unit_medium_to_small,unit_medium,unit_small,other_note,min_stock_threshold,inventory(quantity_smallest_unit)',{count:'exact'}).order('name',{ascending:true}).range(page*PAGE_SIZE,(page+1)*PAGE_SIZE-1);
 if(term){const safe=escLike(term);q=q.or('name.ilike.%'+safe+'%,name_en.ilike.%'+safe+'%,qr_code.ilike.%'+safe+'%')}
 if($('shape').value)q=q.eq('shape',$('shape').value);if($('type').value)q=q.eq('drug_type',$('type').value);if($('classification').value)q=q.eq('classification',$('classification').value);if($('supplier').value)q=q.eq('supplier',$('supplier').value);
 const {data,error,count}=await q;if(error){wrap.innerHTML='<p class="msg error">تعذر تحميل المنتجات: '+esc(error.message)+'</p>';return}
 $('resultInfo').textContent=(count??0)+' منتج';
 if(!data?.length){wrap.innerHTML='<p class="loading">لا توجد نتائج مطابقة</p>';renderPager(count||0);return}
 let html='<div style="overflow:auto"><table><thead><tr><th>المنتج</th><th>الشكل</th><th>الكمية</th><th>السعر</th><th>الصلاحية</th><th>إجراء</th></tr></thead><tbody>';
 for(const p of data){const invQty=Array.isArray(p.inventory)?p.inventory?.[0]?.quantity_smallest_unit:p.inventory?.quantity_smallest_unit;const qty=Number(invQty??0);const per=p.unit_large?(Number(p.unit_large_to_medium)||1)*(Number(p.unit_medium_to_small)||1):(Number(p.unit_medium_to_small)||1);const boxes=per?Math.floor(qty/per):qty;const rem=per?qty%per:0;const low=qty<=Number(p.min_stock_threshold||0);let qtyText=boxes+' علبة';if(p.unit_large&&rem){const med=Math.floor(rem/(Number(p.unit_medium_to_small)||1));const small=rem%(Number(p.unit_medium_to_small)||1);if(med)qtyText+=' + '+med+' '+(p.unit_medium==='strip'?'شريط':p.unit_medium==='ampoule'?'أمبولة':p.unit_medium==='sachet'?'كيس':'وحدة');if(small)qtyText+=' + '+small+' '+(p.unit_small==='piece'?'قطعة':p.unit_small==='other'?(p.other_note||'وحدة'):'وحدة')}else if(rem)qtyText+=' + '+rem+' '+(p.unit_small==='piece'?'قطعة':p.unit_small==='other'?(p.other_note||'وحدة'):'وحدة');html+='<tr><td>'+esc(p.name)+'</td><td>'+esc(p.shape==='أخرى'&&p.other_note?p.other_note:p.shape||'—')+'</td><td class="'+(low?'low-stock':'')+'">'+esc(qtyText)+(low?' ⚠️':'')+'</td><td>'+esc(p.default_sale_price==null?'—':p.default_sale_price+' ج')+'</td><td>'+esc(p.expiry_date||'—')+'</td><td><a class="small secondary" style="text-decoration:none" href="inventory-form.html?id='+encodeURIComponent(p.id)+'">تعديل</a></td></tr>'}
 wrap.innerHTML=html+'</tbody></table></div>';renderPager(count||0)
}
function renderPager(total){const pages=Math.max(1,Math.ceil(total/PAGE_SIZE));$('pager').innerHTML='<button class="small secondary" '+(page===0?'disabled':'')+' id="prev">السابق</button><span>صفحة '+(page+1)+' من '+pages+'</span><button class="small secondary" '+(page>=pages-1?'disabled':'')+' id="next">التالي</button>';$('prev').onclick=()=>{if(page){page--;load()}};$('next').onclick=()=>{if(page<pages-1){page++;load()}}}
['shape','type','classification','supplier'].forEach(id=>$(id).addEventListener('change',()=>{page=0;load()}));$('search').addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(()=>{page=0;load()},250)});
(async()=>{const a=await requireAuth();if(!a)return;if(!guardPageAccess(a.profile,'inventory'))return;$('userinfo').textContent=a.profile.full_name+' ('+(a.profile.role==='admin'?'أدمن':'موظف')+')';await loadOptions();await load()})();
$('logoutBtn').onclick=async()=>{await sb.auth.signOut();location.href='index.html'};
</script>
</body></html>
