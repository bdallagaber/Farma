<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المخزون - نظام إدارة الصيدلية</title>
<script src="supabase-lib.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: #0f1b16;
    color: #eef2ef;
    padding: 16px;
    padding-bottom: 60px;
  }
  header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 20px; flex-wrap: wrap; gap: 10px;
  }
  header h1 { font-size: 18px; color: #6fcf97; }
  header .userinfo { font-size: 12px; color: #9fb3a8; }
  nav { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
  nav a {
    padding: 8px 14px; background: #16261e; border: 1px solid #23392c;
    border-radius: 8px; color: #eef2ef; text-decoration: none; font-size: 13px;
  }
  nav a.active { background: #6fcf97; color: #0f1b16; font-weight: 600; }
  .card {
    background: #16261e; border: 1px solid #23392c; border-radius: 14px;
    padding: 20px; margin-bottom: 20px;
  }
  .card h2 { font-size: 16px; margin-bottom: 16px; color: #6fcf97; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  label { display: block; font-size: 12px; color: #b7c9be; margin-bottom: 4px; }
  input, select, textarea {
    width: 100%; padding: 10px 12px; background: #0f1b16;
    border: 1px solid #2a4536; border-radius: 8px; color: #eef2ef;
    font-size: 14px; margin-bottom: 12px;
  }
  input:focus, select:focus { outline: none; border-color: #6fcf97; }
  button {
    padding: 12px 20px; background: #6fcf97; color: #0f1b16;
    border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  button:disabled { opacity: 0.6; }
  .msg { margin-top: 10px; font-size: 13px; }
  .msg.error { color: #f28b82; }
  .msg.ok { color: #6fcf97; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { padding: 10px 8px; text-align: right; border-bottom: 1px solid #23392c; }
  th { color: #9fb3a8; font-weight: 600; }
  .low-stock { color: #f28b82; font-weight: 600; }
  .hidden { display: none !important; }
  .full-width { grid-column: 1 / -1; }
  .loading { text-align: center; color: #9fb3a8; padding: 20px; }
</style>
</head>
<body>

<header>
  <h1>📦 نظام إدارة الصيدلية</h1>
  <div>
    <span class="userinfo" id="userinfo"></span>
    <button id="logoutBtn" style="padding:6px 12px;font-size:12px;margin-right:8px;">خروج</button>
  </div>
</header>

<nav>
  <a href="inventory.html" class="active">المخزون</a>
  <a href="#" style="opacity:0.5;pointer-events:none;">المبيعات (قريبًا)</a>
  <a href="#" style="opacity:0.5;pointer-events:none;">النواقص (قريبًا)</a>
</nav>

<div class="card">
  <h2>➕ إضافة منتج جديد</h2>
  <div class="grid">
    <div>
      <label>اسم المنتج</label>
      <input type="text" id="p_name" placeholder="مثال: بانادول">
    </div>
    <div>
      <label>الوحدة الأساسية</label>
      <select id="p_base_unit">
        <option value="box">علبة</option>
        <option value="strip">شريط</option>
        <option value="piece">قطعة</option>
        <option value="ampoule">أمبولة</option>
        <option value="sachet">كيس/فوار</option>
        <option value="other">أخرى</option>
      </select>
    </div>
    <div id="other_unit_wrap" class="hidden">
      <label>وضّح نوع الوحدة</label>
      <input type="text" id="p_other_unit_note" placeholder="مثال: تيوب">
    </div>
    <div>
      <label>كام وحدة فردية جوه الوحدة الأساسية؟ (مثال: الشريط فيه 10 حبة)</label>
      <input type="number" id="p_sub_units" value="1" min="1">
    </div>
    <div>
      <label>الكمية الحالية (عدد الوحدات الأساسية، مثلاً كام شريط)</label>
      <input type="number" id="p_qty_base" value="0" min="0">
    </div>
    <div>
      <label>وحدات فردية زيادة برّه العد ده (اختياري)</label>
      <input type="number" id="p_qty_loose" value="0" min="0">
    </div>
    <div>
      <label>تاريخ الإنتاج</label>
      <input type="date" id="p_production_date">
    </div>
    <div>
      <label>تاريخ انتهاء الصلاحية</label>
      <input type="date" id="p_expiry_date">
    </div>
    <div>
      <label>الحد الأدنى للتنبيه (بالوحدة الفردية الصغرى)</label>
      <input type="number" id="p_min_threshold" value="0" min="0">
    </div>
    <div id="purchase_price_wrap" class="hidden">
      <label>سعر الشراء (أدمن فقط)</label>
      <input type="number" id="p_purchase_price" step="0.01" placeholder="اختياري">
    </div>
    <div class="full-width">
      <label>كود QR / باركود (اختياري، ممكن تكتبه يدوي دلوقتي)</label>
      <input type="text" id="p_qr" placeholder="هيتم دعم مسح الكاميرا لاحقًا">
    </div>
  </div>
  <button id="addBtn">حفظ المنتج</button>
  <div class="msg" id="addMsg"></div>
</div>

<div class="card">
  <h2>📋 المخزون الحالي</h2>
  <div id="tableWrap"><p class="loading">جاري التحميل...</p></div>
</div>

<script src="config.js"></script>
<script>
  window.onerror = function(msg, url, line) {
    document.body.insertAdjacentHTML('beforeend',
      '<div style="position:fixed;bottom:0;left:0;right:0;background:#f28b82;color:#000;padding:12px;font-size:12px;direction:ltr;text-align:left;">JS Error: ' + msg + ' (line ' + line + ')</div>');
  };
  window.onunhandledrejection = function(e) {
    document.body.insertAdjacentHTML('beforeend',
      '<div style="position:fixed;bottom:0;left:0;right:0;background:#f28b82;color:#000;padding:12px;font-size:12px;direction:ltr;text-align:left;">Promise Error: ' + (e.reason && e.reason.message ? e.reason.message : e.reason) + '</div>');
  };

  const UNIT_LABELS = {
    box: 'علبة', strip: 'شريط', piece: 'قطعة',
    ampoule: 'أمبولة', sachet: 'كيس', other: 'أخرى'
  };

  let currentUser = null;
  let isAdmin = false;

  (async () => {
    const auth = await requireAuth();
    if (!auth) return;
    currentUser = auth.user;
    isAdmin = auth.profile.role === 'admin';

    document.getElementById('userinfo').textContent =
      auth.profile.full_name + ' (' + (isAdmin ? 'أدمن' : 'موظف') + ')';

    if (isAdmin) {
      document.getElementById('purchase_price_wrap').classList.remove('hidden');
    }

    await loadInventory();
  })();

  document.getElementById('logoutBtn').addEventListener('click', async () => {
    await sb.auth.signOut();
    window.location.href = 'index.html';
  });

  document.getElementById('p_base_unit').addEventListener('change', (e) => {
    document.getElementById('other_unit_wrap').classList.toggle('hidden', e.target.value !== 'other');
  });

  document.getElementById('addBtn').addEventListener('click', async () => {
    const addBtn = document.getElementById('addBtn');

    const name = document.getElementById('p_name').value.trim();
    const baseUnit = document.getElementById('p_base_unit').value;
    const otherNote = document.getElementById('p_other_unit_note').value.trim();
    const subUnits = parseInt(document.getElementById('p_sub_units').value) || 1;
    const qtyBase = parseFloat(document.getElementById('p_qty_base').value) || 0;
    const qtyLoose = parseFloat(document.getElementById('p_qty_loose').value) || 0;
    const productionDate = document.getElementById('p_production_date').value || null;
    const expiryDate = document.getElementById('p_expiry_date').value || null;
    const minThreshold = parseFloat(document.getElementById('p_min_threshold').value) || 0;
    const qr = document.getElementById('p_qr').value.trim() || null;
    const purchasePriceRaw = document.getElementById('p_purchase_price').value;

    if (!name) {
      showAddMsg('لازم تكتب اسم المنتج', 'error');
      return;
    }

    addBtn.disabled = true;
    addBtn.textContent = 'جاري الحفظ...';

    try {
      const { data: product, error: productError } = await sb
        .from('products')
        .insert({
          name,
          base_unit: baseUnit,
          sub_units_per_base: subUnits,
          production_date: productionDate,
          expiry_date: expiryDate,
          min_stock_threshold: minThreshold,
          other_note: baseUnit === 'other' ? otherNote : null,
          qr_code: qr,
          created_by: currentUser.id
        })
        .select()
        .single();

      if (productError) throw productError;

      const quantitySmallestUnit = (qtyBase * subUnits) + qtyLoose;

      const { error: invError } = await sb
        .from('inventory')
        .insert({ product_id: product.id, quantity_smallest_unit: quantitySmallestUnit });

      if (invError) throw invError;

      if (isAdmin && purchasePriceRaw) {
        await sb.from('product_costs').insert({
          product_id: product.id,
          purchase_price: parseFloat(purchasePriceRaw),
          updated_by: currentUser.id
        });
      }

      showAddMsg('تم حفظ المنتج بنجاح ✅', 'ok');
      document.querySelectorAll('.card:first-of-type input').forEach(i => {
        if (i.type === 'number') i.value = i.id === 'p_sub_units' ? 1 : 0;
        else i.value = '';
      });
      await loadInventory();
    } catch (err) {
      showAddMsg('حصل خطأ: ' + (err.message || JSON.stringify(err)), 'error');
    } finally {
      addBtn.disabled = false;
      addBtn.textContent = 'حفظ المنتج';
    }
  });

  function showAddMsg(text, type) {
    const el = document.getElementById('addMsg');
    el.textContent = text;
    el.className = 'msg ' + type;
  }

  async function loadInventory() {
    const wrap = document.getElementById('tableWrap');
    const { data: products, error } = await sb
      .from('products')
      .select('id, name, base_unit, sub_units_per_base, expiry_date, min_stock_threshold, other_note, inventory(quantity_smallest_unit)')
      .order('created_at', { ascending: false });

    if (error) {
      wrap.innerHTML = '<p class="msg error">تعذّر تحميل المخزون: ' + error.message + '</p>';
      return;
    }

    if (!products || products.length === 0) {
      wrap.innerHTML = '<p class="loading">لا توجد منتجات مضافة بعد</p>';
      return;
    }

    let html = '<table><thead><tr><th>المنتج</th><th>الكمية المتاحة</th><th>الصلاحية</th></tr></thead><tbody>';

    for (const p of products) {
      const qty = (p.inventory && p.inventory[0]) ? p.inventory[0].quantity_smallest_unit : 0;
      const unitLabel = p.base_unit === 'other' ? (p.other_note || 'أخرى') : UNIT_LABELS[p.base_unit];
      const sub = p.sub_units_per_base || 1;

      let qtyDisplay;
      if (sub > 1) {
        const fullUnits = Math.floor(qty / sub);
        const loose = qty % sub;
        qtyDisplay = fullUnits + ' ' + unitLabel + (loose > 0 ? ' + ' + loose + ' فردي' : '');
      } else {
        qtyDisplay = qty + ' ' + unitLabel;
      }

      const isLow = qty <= (p.min_stock_threshold || 0);
      const expiryText = p.expiry_date || '—';

      html += '<tr>' +
        '<td>' + escapeHtml(p.name) + '</td>' +
        '<td class="' + (isLow ? 'low-stock' : '') + '">' + qtyDisplay + (isLow ? ' ⚠️' : '') + '</td>' +
        '<td>' + expiryText + '</td>' +
        '</tr>';
    }

    html += '</tbody></table>';
    wrap.innerHTML = html;
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }
</script>

</body>
</html>
