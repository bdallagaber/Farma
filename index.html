<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نظام إدارة الصيدلية</title>
<script src="supabase-lib.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body class="login-page">

<div class="card">
  <h1>نظام إدارة الصيدلية</h1>
  <p class="subtitle">سجّل دخولك للمتابعة</p>

  <label for="email">البريد الإلكتروني أو اسم المستخدم</label>
  <input type="text" id="email" placeholder="example@pharmacy.com أو اليوزر بتاعك" autocomplete="username">

  <label for="password">كلمة المرور</label>
  <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">

  <button id="loginBtn">تسجيل الدخول</button>
  <div class="msg" id="msg"></div>
</div>

<script src="config.js"></script>
<script>
  window.onerror = function(msg, url, line) {
    document.body.insertAdjacentHTML('beforeend',
      '<div style="position:fixed;bottom:0;left:0;right:0;background:#f28b82;color:#000;padding:12px;font-size:12px;direction:ltr;text-align:left;">JS Error: ' + msg + ' (line ' + line + ')</div>');
  };
  window.onunhandledrejection = function(e) {
    document.body.insertAdjacentHTML('beforeend',
      '<div style="position:fixed;bottom:0;left:0;right:0;background:#f28b82;color:#000;padding:12px;font-size:12px;direction:ltr;text-align:left;">Promise Error: ' + (e.reason && e.reason.message ? e.reason.message : e.reason) + '</div>');
  };

  const loginBtn = document.getElementById('loginBtn');
  const msg = document.getElementById('msg');

  sb.auth.getSession().then(({ data: { session } }) => {
    if (session) window.location.href = 'inventory.html';
  });

  loginBtn.addEventListener('click', async () => {
    let email = document.getElementById('email').value.trim().toLowerCase();
    const password = document.getElementById('password').value;

    if (!email || !password) {
      showMsg('اكتب البريد الإلكتروني أو اسم المستخدم وكلمة المرور', 'error');
      return;
    }

    if (!email.includes('@')) {
      email = email + '.pharmacy.local@gmail.com';
    }

    loginBtn.disabled = true;
    loginBtn.textContent = 'جاري الدخول...';
    msg.textContent = '';
    msg.className = 'msg';

    try {
      const { data, error } = await sb.auth.signInWithPassword({ email, password });

      if (error) {
        console.error('Supabase login error:', error);
        showMsg(getLoginErrorMessage(error), 'error');
        return;
      }

      if (!data || !data.user || !data.session) {
        showMsg('تم التحقق من الحساب لكن لم يتم إنشاء جلسة دخول. اقفل الصفحة وافتحها تاني.', 'error');
        return;
      }

      let profile = null;
      let profileError = null;

      for (let attempt = 0; attempt < 3; attempt++) {
        const result = await sb
          .from('profiles')
          .select('role, full_name')
          .eq('id', data.user.id)
          .single();

        profile = result.data;
        profileError = result.error;

        if (profile && !profileError) break;
        console.warn('Profile lookup attempt failed:', profileError);
        if (attempt < 2) await sleep(500 * (attempt + 1));
      }

      // مهم: لا نعملش signOut لمجرد إن استعلام profiles فشل مؤقتًا.
      // الـ session صحيحة بالفعل، ونسيب المستخدم يكمل بدل ما يظهر له logout.
      if (!profile) {
        console.error('Profile lookup failed after retries:', profileError);
        showMsg('تم تسجيل الدخول، لكن تعذر تحميل بيانات الموظف مؤقتًا. جرّب فتح الصفحة تاني بعد لحظات.', 'error');
        return;
      }

      showMsg('تم الدخول بنجاح، مرحبًا ' + profile.full_name, 'ok');
      loginBtn.textContent = 'تم الدخول ✅';
      window.location.href = 'inventory.html';
    } catch (err) {
      console.error('Unexpected login error:', err);
      showMsg('حصل خطأ أثناء تسجيل الدخول. جرّب تاني، ولو المشكلة مستمرة ابعتلي نص الرسالة الظاهرة.', 'error');
    } finally {
      if (loginBtn.textContent !== 'تم الدخول ✅') {
        loginBtn.disabled = false;
        loginBtn.textContent = 'تسجيل الدخول';
      }
    }
  });

  function sleep(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
  }

  function getLoginErrorMessage(error) {
    const code = String(error?.code || '').toLowerCase();
    const status = Number(error?.status || 0);
    const text = String(error?.message || '').toLowerCase();

    if (code === 'email_not_confirmed' || text.includes('email not confirmed')) {
      return 'الحساب موجود، لكن تأكيد الإيميل مفعّل في Supabase. لازم Confirm email يكون Off لحسابات الموظفين دي.';
    }

    if (code === 'invalid_credentials' || text.includes('invalid login credentials')) {
      return 'Supabase رفض بيانات الدخول. راجع اسم المستخدم/الإيميل وكلمة المرور. لو أنت متأكد إنهم صح، ابعتلي الرسالة دي زي ما هي عشان نحدد سبب المشكلة.';
    }

    if (code === 'user_not_found') {
      return 'الحساب ده مش موجود في نظام الدخول. تأكد إنك بتستخدم نفس اليوزر أو الإيميل اللي الأدمن أنشأه.';
    }

    if (status === 429 || code === 'over_request_rate_limit') {
      return 'محاولات الدخول كتير في وقت قصير. استنى دقيقة وجرب تاني.';
    }

    if (status >= 500 || code.includes('server')) {
      return 'في مشكلة مؤقتة في خدمة تسجيل الدخول. جرّب بعد دقيقة.';
    }

    return 'تعذر تسجيل الدخول: ' + (error?.message || 'خطأ غير معروف') + ' [' + (error?.code || 'بدون كود') + ']';
  }

  function showMsg(text, type) {
    msg.textContent = text;
    msg.className = 'msg ' + type;
  }
</script>

</body>
</html>
