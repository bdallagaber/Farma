<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نظام إدارة الصيدلية</title>
<script src="supabase-lib.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: #0f1b16;
    color: #eef2ef;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .card {
    background: #16261e;
    border: 1px solid #23392c;
    border-radius: 14px;
    padding: 36px 28px;
    width: 100%;
    max-width: 380px;
  }
  .card h1 { font-size: 22px; margin-bottom: 6px; color: #6fcf97; }
  .card p.subtitle { font-size: 13px; color: #9fb3a8; margin-bottom: 28px; }
  label { display: block; font-size: 13px; color: #b7c9be; margin-bottom: 6px; }
  input {
    width: 100%; padding: 12px 14px; background: #0f1b16;
    border: 1px solid #2a4536; border-radius: 8px; color: #eef2ef;
    font-size: 15px; margin-bottom: 18px;
  }
  input:focus { outline: none; border-color: #6fcf97; }
  button {
    width: 100%; padding: 13px; background: #6fcf97; color: #0f1b16;
    border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  .msg { margin-top: 16px; font-size: 13px; text-align: center; min-height: 18px; }
  .msg.error { color: #f28b82; }
  .msg.ok { color: #6fcf97; }
</style>
</head>
<body>

<div class="card">
  <h1>نظام إدارة الصيدلية</h1>
  <p class="subtitle">سجّل دخولك للمتابعة</p>

  <label for="email">البريد الإلكتروني</label>
  <input type="email" id="email" placeholder="example@pharmacy.com">

  <label for="password">كلمة المرور</label>
  <input type="password" id="password" placeholder="••••••••">

  <button id="loginBtn">تسجيل الدخول</button>
  <div class="msg" id="msg"></div>
</div>

<script src="config.js"></script>
<script>
  window.onerror = function(msg, url, line) {
    document.body.insertAdjacentHTML('beforeend',
      '<div style="position:fixed;bottom:0;left:0;right:0;background:#f28b82;color:#000;padding:12px;font-size:12px;direction:ltr;text-align:left;">JS Error: ' + msg + ' (line ' + line + ')</div>');
  };
  window.onunhandledrejection = function(e) {
    document.body.insertAdjacentHTML('beforeend',
      '<div style="position:fixed;bottom:0;left:0;right:0;background:#f28b82;color:#000;padding:12px;font-size:12px;direction:ltr;text-align:left;">Promise Error: ' + (e.reason && e.reason.message ? e.reason.message : e.reason) + '</div>');
  };

  const loginBtn = document.getElementById('loginBtn');
  const msg = document.getElementById('msg');

  sb.auth.getSession().then(({ data: { session } }) => {
    if (session) window.location.href = 'inventory.html';
  });

  loginBtn.addEventListener('click', async () => {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    if (!email || !password) {
      showMsg('اكتب البريد الإلكتروني وكلمة المرور', 'error');
      return;
    }

    loginBtn.disabled = true;
    loginBtn.textContent = 'جاري الدخول...';

    const { data, error } = await sb.auth.signInWithPassword({ email, password });

    if (error) {
      showMsg('بيانات الدخول غلط، حاول تاني', 'error');
      loginBtn.disabled = false;
      loginBtn.textContent = 'تسجيل الدخول';
      return;
    }

    const { data: profile, error: profileError } = await sb
      .from('profiles')
      .select('role, full_name')
      .eq('id', data.user.id)
      .single();

    if (profileError || !profile) {
      showMsg('تم الدخول لكن لا يوجد حساب موظف مرتبط بك. تواصل مع الأدمن.', 'error');
      loginBtn.disabled = false;
      loginBtn.textContent = 'تسجيل الدخول';
      return;
    }

    showMsg('تم الدخول بنجاح، مرحبًا ' + profile.full_name, 'ok');
    loginBtn.textContent = 'تم الدخول ✅';
    window.location.href = 'inventory.html';
  });

  function showMsg(text, type) {
    msg.textContent = text;
    msg.className = 'msg ' + type;
  }
</script>

</body>
</html>
