const UNIT_LABELS={box:'علبة',strip:'شريط',piece:'قطعة',ampoule:'أمبولة',sachet:'كيس',other:'أخرى'};let allInvoices=[];let filteredInvoices=[];let invoicePage=1;const INVOICE_PAGE_SIZE=75;let isAdmin=false;let currentUser=null;let customersCache=[];let applied={employees:[],dateFrom:'',dateTo:'',timeFrom:'',timeTo:'',preset:'clear'};function monthStartCairo(){const d=todayCairo();return d.slice(0,8)+'01'}
(async()=>{const auth=await requireAuth();if(!auth)return;if(!guardPageAccess(auth.profile,'invoices'))return;currentUser=auth.user;isAdmin=auth.profile.role==='admin';document.getElementById('userinfo').textContent=auth.profile.full_name+' ('+(isAdmin?'أدمن':'موظف')+')';if(!isAdmin)document.getElementById('employeeAnchor').style.display='none';else await loadEmployees();setInitialFilterState();await loadInvoices()})();document.getElementById('logoutBtn').addEventListener('click',async()=>{await sb.auth.signOut();location.href='index.html'});function esc(s){const d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML}
function setInitialFilterState(){applied.dateFrom='';applied.dateTo='';applied.timeFrom='';applied.timeTo='';applied.preset='clear';document.getElementById('dateFrom').value='';document.getElementById('dateTo').value='';document.getElementById('timeFrom').value='';document.getElementById('timeTo').value='';syncBadges();syncQuickOptions()}
async function loadEmployees(){const el=document.getElementById('employeeList');const {data,error}=await sb.from('profiles').select('id,full_name').order('full_name',{ascending:true});if(error){el.innerHTML='<div style="padding:10px;color:#dc2626">تعذر تحميل الموظفين</div>';return}el.innerHTML=(data||[]).map(p=>'<label class="employee-item"><input type="checkbox" value="'+esc(p.id)+'" data-name="'+esc(p.full_name||'بدون اسم')+'"><span>'+esc(p.full_name||'بدون اسم')+'</span></label>').join('');el.querySelectorAll('input').forEach(x=>x.addEventListener('change',updateEmployeeBadge))}function selectedEmployees(){return Array.from(document.querySelectorAll('#employeeList input:checked')).map(x=>({id:x.value,name:x.dataset.name}))}function updateEmployeeBadge(){const n=selectedEmployees().length;const b=document.getElementById('employeeBadge');b.textContent=n;b.style.display=n?'inline-flex':'none'}
async function loadInvoices(){const wrap=document.getElementById('invoicesWrap');const [{data,error},{data:invRows},{data:custRows},{data:auditRows}]=await Promise.all([sb.from('sales').select('id,sale_group_id,product_id,quantity,unit_sold,sale_price,original_sale_price,created_at,employee_id,products(name,name_en,unit_small,unit_medium,unit_large,unit_medium_to_small,unit_large_to_medium),profiles(full_name),customers(name)').order('created_at',{ascending:false}).limit(5000),sb.from('invoices').select('sale_group_id,invoice_number,customer_id,notes,discount_type,discount_value,subtotal,discount_amount,total,paid_amount,remaining_amount,payment_status'),sb.from('customers').select('id,name').order('name'),sb.from('invoice_audit_log').select('id,sale_group_id,edited_by,edited_at,change_type,old_value,new_value,profiles(full_name)').order('edited_at',{ascending:false}).limit(3000)]);if(error){wrap.innerHTML='<p style="color:#dc2626">تعذّر تحميل الفواتير: '+esc(error.message)+'</p>';return}customersCache=custRows||[];const auditBySaleGroup={};(auditRows||[]).forEach(a=>{if(!auditBySaleGroup[a.sale_group_id])auditBySaleGroup[a.sale_group_id]=[];auditBySaleGroup[a.sale_group_id].push(a)});const invoiceMeta={};(invRows||[]).forEach(r=>invoiceMeta[r.sale_group_id]=r);const groups={};(data||[]).forEach(s=>{const key=s.sale_group_id||('single-'+s.id);const meta=s.sale_group_id?invoiceMeta[s.sale_group_id]:null;if(!groups[key])groups[key]={key,sale_group_id:s.sale_group_id||null,created_at:s.created_at,customer:s.customers?s.customers.name:'كاش',customer_id:meta?meta.customer_id:null,invoiceNumber:meta?meta.invoice_number:null,notes:meta?meta.notes:'',discountType:meta?meta.discount_type:'none',discountValue:meta?Number(meta.discount_value||0):0,subtotal:meta&&meta.subtotal!=null?Number(meta.subtotal):null,discountAmount:meta&&meta.discount_amount!=null?Number(meta.discount_amount):0,invoiceTotal:meta&&meta.total!=null?Number(meta.total):null,paidAmount:meta&&meta.paid_amount!=null?Number(meta.paid_amount):0,remainingAmount:meta&&meta.remaining_amount!=null?Number(meta.remaining_amount):0,paymentStatus:meta&&meta.payment_status?meta.payment_status:'unpaid',hasInvoiceRow:!!meta,employee:s.profiles?s.profiles.full_name:'—',employee_id:s.employee_id||null,items:[],total:0,auditLog:s.sale_group_id?(auditBySaleGroup[s.sale_group_id]||[]):[]};groups[key].items.push(s);groups[key].total+=Number(s.sale_price||0)});allInvoices=Object.values(groups).sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));renderInvoices()}
function customerNameById(id){if(!id)return'كاش';const c=customersCache.find(x=>x.id===id);return c?c.name:'—'}
function formatAuditEntry(a){const who=a.profiles?a.profiles.full_name:'مستخدم محذوف';const when=dFormat(a.edited_at);let what='';const ov=a.old_value||{},nv=a.new_value||{};if(a.change_type==='edit_item'){what='عدّل صنف: الكمية من '+esc(ov.quantity)+' إلى '+esc(nv.quantity)+(Number(ov.sale_price)!==Number(nv.sale_price)?' — السعر من '+Number(ov.sale_price||0).toFixed(2)+' إلى '+Number(nv.sale_price||0).toFixed(2)+' ج':'')}else if(a.change_type==='delete_item'){what='حذف صنف (الكمية: '+esc(ov.quantity)+' '+(UNIT_LABELS[ov.unit_sold]||ov.unit_sold||'')+', السعر: '+Number(ov.sale_price||0).toFixed(2)+' ج)'}else if(a.change_type==='add_item'){what='أضاف صنف جديد للفاتورة'}else if(a.change_type==='edit_customer'){what='غيّر العميل من "'+esc(customerNameById(ov.customer_id))+'" إلى "'+esc(customerNameById(nv.customer_id))+'"'}else if(a.change_type==='edit_notes'){what='عدّل الملاحظات: "'+esc(ov.notes||'—')+'" ← "'+esc(nv.notes||'—')+'"'}else{what=esc(a.change_type)}return '<div style="padding:5px 0;border-bottom:1px dashed var(--border)"><strong>'+esc(who)+'</strong> — '+when+'<br>'+what+'</div>'}
function cairoDate(v){return new Date(v).toLocaleDateString('en-CA',{timeZone:'Africa/Cairo'})}function cairoTime(v){return new Date(v).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',hour12:false,timeZone:'Africa/Cairo'})}function todayCairo(){return cairoDate(new Date())}
function renderInvoices(){const wrap=document.getElementById('invoicesWrap');const term=document.getElementById('searchBox').value.trim().toLowerCase();const f=applied;if(f.dateFrom&&f.dateTo&&f.dateFrom>f.dateTo){wrap.innerHTML='<p style="color:#dc2626">تاريخ البداية لا يمكن أن يكون بعد النهاية.</p>';updateSummary(0,0);return}const filtered=allInvoices.filter(inv=>{const date=cairoDate(inv.created_at),time=cairoTime(inv.created_at);if(f.employees.length&&!f.employees.includes(String(inv.employee_id||'')))return false;if(f.dateFrom&&f.dateTo&&f.timeFrom&&f.timeTo){const startStamp=f.dateFrom+'T'+f.timeFrom;const endStamp=f.dateTo+'T'+f.timeTo;const invoiceStamp=date+'T'+time;if(invoiceStamp<startStamp||invoiceStamp>endStamp)return false}else{if(f.dateFrom&&date<f.dateFrom)return false;if(f.dateTo&&date>f.dateTo)return false;if(f.timeFrom&&time<f.timeFrom)return false;if(f.timeTo&&time>f.timeTo)return false}if(!term)return true;const hay=(String(inv.invoiceNumber||'')+' '+inv.customer+' '+inv.employee+' '+inv.items.map(i=>i.products?i.products.name+' '+(i.products.name_en||''):'').join(' ')).toLowerCase();return hay.includes(term)});filteredInvoices=filtered;const total=filtered.reduce((sum,i)=>sum+(i.invoiceTotal!=null?i.invoiceTotal:i.total),0);updateSummary(filtered.length,total);updateChips();if(!filtered.length){wrap.innerHTML='<p class="loading">مفيش فواتير مطابقة للفلاتر الحالية</p>';return}const pageCount=Math.ceil(filtered.length/INVOICE_PAGE_SIZE);invoicePage=Math.min(Math.max(1,invoicePage),pageCount);const start=(invoicePage-1)*INVOICE_PAGE_SIZE;const pageRows=filtered.slice(start,start+INVOICE_PAGE_SIZE);let h='<table><thead><tr><th>المعرف</th><th>التاريخ</th><th>العميل</th><th>عدد الأصناف</th><th>الإجمالي</th>'+(isAdmin?'<th>البائع</th>':'')+'</tr></thead><tbody>';pageRows.forEach(i=>{h+='<tr class="invoice-row" data-key="'+esc(i.key)+'"><td>'+esc(i.invoiceNumber||'—')+'</td><td>'+dFormat(i.created_at)+'</td><td>'+esc(i.customer)+'</td><td>'+i.items.length+'</td><td>'+i.total.toFixed(2)+' ج</td>'+(isAdmin?'<td>'+esc(i.employee)+'</td>':'')+'</tr>'});h+='</tbody></table><div class="invoice-pagination" style="display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:14px"><button type="button" class="secondary" id="invoicePrev" '+(invoicePage<=1?'disabled':'')+'>السابق</button><span>صفحة '+invoicePage+' من '+pageCount+' — '+filtered.length.toLocaleString('ar-EG')+' فاتورة</span><button type="button" class="secondary" id="invoiceNext" '+(invoicePage>=pageCount?'disabled':'')+'>التالي</button></div>';wrap.innerHTML=h;wrap.querySelectorAll('.invoice-row').forEach(r=>r.addEventListener('click',()=>showInvoice(r.dataset.key)));const prev=document.getElementById('invoicePrev'),next=document.getElementById('invoiceNext');if(prev)prev.onclick=()=>{if(invoicePage>1){invoicePage--;renderInvoices()}};if(next)next.onclick=()=>{if(invoicePage<pageCount){invoicePage++;renderInvoices()}}}function updateSummary(count,total){document.getElementById('invoiceCount').textContent=Number(count).toLocaleString('ar-EG');document.getElementById('salesTotal').textContent=Number(total).toLocaleString('ar-EG',{minimumFractionDigits:2,maximumFractionDigits:2})+' ج.م'}function updateChips(){const box=document.getElementById('appliedChips'),parts=[];if(applied.employees.length)parts.push('<span class="chip">👤 '+applied.employees.length+' موظف <button data-clear="employees">×</button></span>');if(applied.dateFrom||applied.dateTo)parts.push('<span class="chip">📅 '+esc(applied.dateFrom||'البداية')+' → '+esc(applied.dateTo||'النهاية')+' <button data-clear="dates">×</button></span>');if(applied.timeFrom||applied.timeTo)parts.push('<span class="chip">🕐 '+esc(applied.timeFrom||'00:00')+' → '+esc(applied.timeTo||'23:59')+' <button data-clear="times">×</button></span>');box.innerHTML=parts.join('');box.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>clearOne(b.dataset.clear)))}function clearOne(type){if(type==='employees'){applied.employees=[];document.querySelectorAll('#employeeList input').forEach(x=>x.checked=false);updateEmployeeBadge()}if(type==='dates'){applied.dateFrom='';applied.dateTo='';document.getElementById('dateFrom').value='';document.getElementById('dateTo').value=''}if(type==='times'){applied.timeFrom='';applied.timeTo='';document.getElementById('timeFrom').value='';document.getElementById('timeTo').value=''}applied.preset='clear';syncBadges();syncQuickOptions();renderInvoices()}
function syncBadges(){const db=document.getElementById('dateBadge');const dn=!!(applied.dateFrom||applied.dateTo||applied.timeFrom||applied.timeTo);db.textContent=dn?'✓':'';db.style.display=dn?'inline-flex':'none'}function syncQuickOptions(){document.querySelectorAll('.quick-option').forEach(b=>b.classList.toggle('active',b.dataset.preset===applied.preset));const labels={today:'اليوم',yesterday:'أمس','7days':'آخر أسبوع',month:'الشهر الجاري',clear:'كل الوقت'};document.getElementById('dateFilterLabel').textContent=labels[applied.preset]||'كل الوقت'}function closeMenus(){document.querySelectorAll('.filter-menu.open').forEach(m=>m.classList.remove('open'));document.querySelectorAll('.filter-btn.active').forEach(b=>b.classList.remove('active'));document.getElementById('filterBackdrop').classList.remove('open')}function openMenu(id,btnId){const m=document.getElementById(id);const was=m.classList.contains('open');closeMenus();if(!was){m.classList.add('open');if(btnId)document.getElementById(btnId).classList.add('active');document.getElementById('filterBackdrop').classList.add('open')}}
document.getElementById('employeeBtn').addEventListener('click',()=>openMenu('employeeMenu','employeeBtn'));document.getElementById('dateBtn').addEventListener('click',()=>openMenu('dateMenu','dateBtn'));document.getElementById('extraOptionsBtn').addEventListener('click',()=>openMenu('extraMenu',null));document.getElementById('filterBackdrop').addEventListener('click',closeMenus);document.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',closeMenus));document.getElementById('applyEmployee').addEventListener('click',()=>{applied.employees=selectedEmployees().map(x=>String(x.id));renderInvoices();closeMenus()});document.getElementById('clearEmployee').addEventListener('click',()=>{applied.employees=[];document.querySelectorAll('#employeeList input').forEach(x=>x.checked=false);updateEmployeeBadge();renderInvoices();closeMenus()});document.getElementById('applyDate').addEventListener('click',()=>{applied.dateFrom=document.getElementById('dateFrom').value;applied.dateTo=document.getElementById('dateTo').value;applied.timeFrom=document.getElementById('timeFrom').value;applied.timeTo=document.getElementById('timeTo').value;applied.preset='';syncBadges();syncQuickOptions();renderInvoices();closeMenus()});document.getElementById('clearDate').addEventListener('click',()=>{applied.dateFrom=applied.dateTo=applied.timeFrom=applied.timeTo='';['dateFrom','dateTo','timeFrom','timeTo'].forEach(id=>document.getElementById(id).value='');applied.preset='clear';syncBadges();syncQuickOptions();renderInvoices();closeMenus()});document.querySelectorAll('.quick-option').forEach(b=>b.addEventListener('click',()=>{const p=b.dataset.preset;if(p==='clear'){applied.dateFrom=applied.dateTo=applied.timeFrom=applied.timeTo='';applied.preset='clear';['dateFrom','dateTo','timeFrom','timeTo'].forEach(id=>document.getElementById(id).value='')}else{const end=todayCairo(),d=new Date(),x=new Date(d);let start=end;if(p==='yesterday'){x.setDate(x.getDate()-1);start=cairoDate(x)}else if(p==='7days'){x.setDate(x.getDate()-6);start=cairoDate(x)}else if(p==='month'){start=monthStartCairo()}applied.dateFrom=start;applied.dateTo=p==='yesterday'?start:end;applied.timeFrom='';applied.timeTo='';applied.preset=p;document.getElementById('dateFrom').value=applied.dateFrom;document.getElementById('dateTo').value=applied.dateTo;document.getElementById('timeFrom').value='';document.getElementById('timeTo').value=''}syncBadges();syncQuickOptions();renderInvoices();closeMenus()}));let invoiceSearchTimer=null;document.getElementById('searchBox').addEventListener('input',()=>{clearTimeout(invoiceSearchTimer);invoiceSearchTimer=setTimeout(()=>{invoicePage=1;renderInvoices()},220)});document.getElementById('employeeSearch').addEventListener('input',e=>{const q=e.target.value.trim().toLowerCase();document.querySelectorAll('.employee-item').forEach(x=>x.style.display=x.textContent.toLowerCase().includes(q)?'flex':'none')});function dFormat(v){return new Date(v).toLocaleString('ar-EG',{timeZone:'Africa/Cairo',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})}
function levelForUnit(p,unitSold){if(!p)return'small';if(unitSold===p.unit_large)return'large';if(unitSold===p.unit_medium)return'medium';return'small'}function smallQtyForItem(p,unitSold,qty){const level=levelForUnit(p,unitSold);const med=Number(p&&p.unit_medium_to_small)||1;const lg=Number(p&&p.unit_large_to_medium)||1;if(level==='medium')return qty*med;if(level==='large')return qty*med*lg;return qty}
function showInvoice(key){const inv=allInvoices.find(x=>x.key===key);if(!inv)return;renderInvoiceView(inv);document.getElementById('invoiceModal').classList.remove('hidden')}
function renderInvoiceView(inv){const p=document.getElementById('invoicePaperContent');p.classList.add('invoice-paper-ready');const auditHtml=(isAdmin&&inv.auditLog&&inv.auditLog.length)?'<details class="audit-log-box" style="margin-top:18px;border-top:1px solid var(--border);padding-top:12px"><summary style="cursor:pointer;font-weight:700;color:var(--text)">📋 سجل التعديلات ('+inv.auditLog.length+')</summary><div style="margin-top:8px">'+inv.auditLog.map(formatAuditEntry).join('')+'</div></details>':'';const rows=inv.items.map(i=>{const qty=Number(i.quantity||0);const lineTotal=Number(i.sale_price||0);const originalLineTotal=i.original_sale_price!=null?Number(i.original_sale_price):lineTotal;const unitPrice=qty?originalLineTotal/qty:originalLineTotal;const unit=UNIT_LABELS[i.unit_sold]||i.unit_sold||'';return '<tr><td><span class="invoice-item-name">'+esc(i.products?i.products.name:'—')+'</span>'+(i.products&&i.products.name_en?'<span class="invoice-item-sub">'+esc(i.products.name_en)+'</span>':'')+'</td><td>'+esc(qty+' '+unit)+'</td><td>'+unitPrice.toFixed(2)+' ج</td><td class="invoice-line-total">'+lineTotal.toFixed(2)+' ج</td></tr>'}).join('');p.innerHTML='<div class="invoice-display-head"><div class="invoice-display-brand"><h2>فاتورة بيع</h2><span class="invoice-badge">عرض المبيعات</span></div><div class="invoice-display-date">معرف الفاتورة: <strong>#'+esc(inv.invoiceNumber||'—')+'</strong> · '+esc(dFormat(inv.created_at))+'</div></div><div class="invoice-display-body"><div class="invoice-info-grid"><div class="invoice-info-box"><span class="invoice-info-label">العميل:</span><span class="invoice-info-value">'+esc(inv.customer)+'</span></div><div class="invoice-info-box"><span class="invoice-info-label">البائع:</span><span class="invoice-info-value">'+esc(inv.employee)+'</span></div></div>'+(inv.notes?'<div class="invoice-display-notes">📝 '+esc(inv.notes)+'</div>':'')+'<div class="invoice-table-wrap"><table class="invoice-display-table"><thead><tr><th>الصنف</th><th>الكمية</th><th>سعر الوحدة</th><th>الإجمالي</th></tr></thead><tbody>'+rows+'</tbody></table></div><div class="invoice-summary"><div class="invoice-summary-row"><span>عدد الأصناف</span><strong>'+inv.items.length+'</strong></div><div class="invoice-summary-row"><span>قبل الخصم</span><strong>'+Number(inv.subtotal!=null?inv.subtotal:inv.total).toFixed(2)+' ج.م</strong></div><div class="invoice-summary-row"><span>الخصم</span><strong>'+Number(inv.discountAmount||0).toFixed(2)+' ج.م</strong></div><div class="invoice-summary-row final"><span>الإجمالي النهائي</span><span>'+Number(inv.invoiceTotal!=null?inv.invoiceTotal:inv.total).toFixed(2)+' ج.م</span></div><div class="invoice-summary-row"><span>المدفوع</span><strong>'+Number(inv.paidAmount||0).toFixed(2)+' ج.م</strong></div><div class="invoice-summary-row"><span>المتبقي</span><strong style="color:'+(Number(inv.remainingAmount||0)>0?'var(--danger)':'var(--primary-dark)')+'">'+Number(inv.remainingAmount||0).toFixed(2)+' ج.م</strong></div></div><div class="invoice-display-actions">'+(isAdmin?'<button type="button" id="editInvoiceBtn">✏️ تعديل</button>':'')+'<button type="button" class="secondary" id="printInvoice">طباعة</button><button type="button" class="secondary" id="closeInvoice">إغلاق</button></div>'+auditHtml+'</div>';document.getElementById('closeInvoice').onclick=closeInvoice;document.getElementById('printInvoice').onclick=()=>window.print();if(isAdmin){document.getElementById('editInvoiceBtn').onclick=()=>renderInvoiceEdit(inv)}}
function renderInvoiceEdit(inv){const p=document.getElementById('invoicePaperContent');const custOptions='<option value="">-- كاش (بدون عميل) --</option>'+customersCache.map(c=>'<option value="'+esc(c.id)+'"'+(inv.customer_id===c.id?' selected':'')+'>'+esc(c.name)+'</option>').join('');p.innerHTML='<div class="invoice-header"><h2>تعديل الفاتورة</h2><div>معرف الفاتورة: <strong>#'+esc(inv.invoiceNumber||'—')+'</strong> · '+esc(dFormat(inv.created_at))+'</div></div>'+(inv.hasInvoiceRow?'<div style="margin-bottom:10px"><label style="font-size:12px;font-weight:700">العميل</label><select id="editCustomer" style="width:100%;margin:4px 0 10px">'+custOptions+'</select><label style="font-size:12px;font-weight:700">ملاحظات</label><textarea id="editNotes" rows="2" style="width:100%;margin-top:4px">'+esc(inv.notes||'')+'</textarea></div>':'<div class="invoice-notes-box">فاتورة قديمة من غير رأس فاتورة — مينفعش تتعدل بيانات العميل أو الملاحظات ليها، بس تقدر تعدّل/تمسح الأصناف.</div>')+'<table class="invoice-table"><thead><tr><th>الصنف</th><th>الكمية</th><th>السعر</th><th></th></tr></thead><tbody id="editItemsBody">'+inv.items.map((i,idx)=>'<tr class="edit-item-row" data-idx="'+idx+'"><td>'+esc(i.products?i.products.name:'—')+'</td><td><input class="edit-qty-input" type="number" min="0" step="1" value="'+i.quantity+'" data-idx="'+idx+'"></td><td>'+Number(i.sale_price||0).toFixed(2)+' ج</td><td><button type="button" class="small danger edit-del-btn" data-idx="'+idx+'">حذف</button></td></tr>').join('')+'</tbody></table><div class="msg" id="editInvoiceMsg"></div><div class="invoice-actions"><button type="button" id="saveInvoiceEdit">💾 حفظ التعديلات</button><button type="button" class="secondary" id="cancelInvoiceEdit">إلغاء</button></div>';const deleted=new Set();p.querySelectorAll('.edit-del-btn').forEach(btn=>btn.addEventListener('click',()=>{const idx=Number(btn.dataset.idx);const row=p.querySelector('.edit-item-row[data-idx="'+idx+'"]');if(deleted.has(idx)){deleted.delete(idx);row.style.opacity='1';btn.textContent='حذف'}else{deleted.add(idx);row.style.opacity='0.4';btn.textContent='تراجع'}}));document.getElementById('cancelInvoiceEdit').onclick=()=>renderInvoiceView(inv);document.getElementById('saveInvoiceEdit').onclick=()=>saveInvoiceEdit(inv,deleted)}
async function saveInvoiceEdit(inv,deletedSet){const msg=document.getElementById('editInvoiceMsg');const saveBtn=document.getElementById('saveInvoiceEdit');saveBtn.disabled=true;msg.textContent='جاري الحفظ...';msg.className='msg';try{const qtyInputs=document.querySelectorAll('.edit-qty-input');for(const inputEl of qtyInputs){const idx=Number(inputEl.dataset.idx);const item=inv.items[idx];const newQty=parseFloat(inputEl.value);if(deletedSet.has(idx)){const p=item.products;const smallQty=smallQtyForItem(p,item.unit_sold,item.quantity);const {data:invRow}=await sb.from('inventory').select('quantity_smallest_unit').eq('product_id',item.product_id).single();await sb.from('inventory').update({quantity_smallest_unit:(invRow?invRow.quantity_smallest_unit:0)+smallQty}).eq('product_id',item.product_id);await sb.from('sales').delete().eq('id',item.id);await sb.from('invoice_audit_log').insert({sale_group_id:inv.sale_group_id,edited_by:currentUser.id,change_type:'delete_item',old_value:{product_id:item.product_id,quantity:item.quantity,unit_sold:item.unit_sold,sale_price:item.sale_price},new_value:null});continue}if(!isNaN(newQty)&&newQty>0&&newQty!==item.quantity){const p=item.products;const oldSmallQty=smallQtyForItem(p,item.unit_sold,item.quantity);const newSmallQty=smallQtyForItem(p,item.unit_sold,newQty);const delta=newSmallQty-oldSmallQty;const {data:invRow}=await sb.from('inventory').select('quantity_smallest_unit').eq('product_id',item.product_id).single();const currentStock=invRow?invRow.quantity_smallest_unit:0;if(delta>currentStock){msg.textContent='الكمية الجديدة لـ "'+(p?p.name:'')+'" أكبر من المتاح في المخزون';msg.className='msg error';saveBtn.disabled=false;return}await sb.from('inventory').update({quantity_smallest_unit:currentStock-delta}).eq('product_id',item.product_id);const newPrice=item.quantity>0?(item.sale_price/item.quantity)*newQty:item.sale_price;await sb.from('sales').update({quantity:newQty,sale_price:newPrice}).eq('id',item.id);await sb.from('invoice_audit_log').insert({sale_group_id:inv.sale_group_id,edited_by:currentUser.id,change_type:'edit_item',old_value:{quantity:item.quantity,sale_price:item.sale_price},new_value:{quantity:newQty,sale_price:newPrice}})}}if(inv.hasInvoiceRow){const newCustomer=document.getElementById('editCustomer').value||null;const newNotes=document.getElementById('editNotes').value.trim()||null;if(newCustomer!==inv.customer_id){await sb.from('invoices').update({customer_id:newCustomer}).eq('sale_group_id',inv.sale_group_id);await sb.from('invoice_audit_log').insert({sale_group_id:inv.sale_group_id,edited_by:currentUser.id,change_type:'edit_customer',old_value:{customer_id:inv.customer_id},new_value:{customer_id:newCustomer}})}if(newNotes!==(inv.notes||null)){await sb.from('invoices').update({notes:newNotes}).eq('sale_group_id',inv.sale_group_id);await sb.from('invoice_audit_log').insert({sale_group_id:inv.sale_group_id,edited_by:currentUser.id,change_type:'edit_notes',old_value:{notes:inv.notes||null},new_value:{notes:newNotes}})}}closeInvoice();await loadInvoices()}catch(err){msg.textContent='حصل خطأ: '+(err.message||JSON.stringify(err));msg.className='msg error';saveBtn.disabled=false}}
function closeInvoice(){document.getElementById('invoiceModal').classList.add('hidden')}document.getElementById('invoiceModal').addEventListener('click',e=>{if(e.target.id==='invoiceModal')closeInvoice()});document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeMenus();closeInvoice()}});
</script></body></html>
