<title>الفواتير - نظام إدارة الصيدلية</title><script src="supabase-lib.js"></script><link rel="stylesheet" href="style.css">
<style>
.invoice-toolbar{display:flex;align-items:center;gap:8px;margin:18px 0 14px;flex-wrap:wrap}.invoice-search{flex:1;min-width:230px}.invoice-search input{width:100%;height:44px;margin:0}.filter-tools{display:flex;align-items:center;gap:7px}.filter-anchor{position:relative}.filter-btn{height:40px;min-width:94px;padding:0 12px;margin:0;border:1px solid var(--border);background:var(--surface,#fff);color:var(--text);border-radius:9px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:7px;transition:.15s ease}.filter-btn:hover,.filter-btn.active{border-color:var(--primary);color:var(--primary-dark);background:var(--bg);box-shadow:0 2px 8px rgba(15,23,42,.06)}.filter-icon{width:15px;height:15px;display:block;flex:0 0 15px}.filter-btn .badge{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;margin-right:1px;padding:0 4px;border-radius:9px;background:var(--primary);color:#fff;font-size:10px}.filter-menu{display:none;position:absolute;z-index:100;top:calc(100% + 7px);right:0;width:300px;background:#fff;border:1px solid var(--border);border-radius:12px;box-shadow:0 14px 36px rgba(15,23,42,.15);padding:12px}.filter-menu.open{display:block}.filter-menu-head{display:flex;align-items:center;justify-content:space-between;padding-bottom:9px;border-bottom:1px solid var(--border);margin-bottom:10px}.filter-menu-head strong{font-size:14px}.filter-menu-head small{display:block;color:var(--text-muted);font-size:10px;margin-top:2px}.menu-close{width:30px!important;height:30px!important;border:0!important;background:transparent!important;color:var(--text-muted)!important;font-size:21px;line-height:1;margin:0!important;padding:0!important;cursor:pointer}.menu-close:hover{background:var(--bg)!important;color:var(--danger)!important;border-radius:7px}.employee-box{border:1px solid var(--border);border-radius:9px;overflow:hidden}.employee-search{border:0!important;border-bottom:1px solid var(--border)!important;border-radius:0!important;height:38px!important}.employee-list{max-height:185px;overflow:auto;padding:4px}.employee-item{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:7px;cursor:pointer;font-size:13px}.employee-item:hover{background:var(--bg)}.employee-item input{margin:0;width:16px;height:16px}.quick-list{display:flex;flex-direction:column;gap:5px}.quick-option{width:100%;height:39px;border:1px solid transparent;background:transparent;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;text-align:right;padding:0 10px;display:flex;align-items:center;justify-content:space-between;color:var(--text)}.quick-option:hover,.quick-option.active{border-color:var(--primary);background:var(--primary-light);color:var(--primary-dark)}.quick-option .check{font-size:14px;opacity:0}.quick-option.active .check{opacity:1}.extra-entry{margin-top:8px;padding-top:8px;border-top:1px solid var(--border)}.extra-entry button{width:100%;height:39px;border:1px solid var(--border);background:#fff;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;text-align:right;padding:0 10px;display:flex;align-items:center;justify-content:space-between}.extra-entry button:hover{border-color:var(--primary);background:var(--bg);color:var(--primary-dark)}.menu-actions{display:flex;gap:7px;margin-top:10px}.menu-actions button{flex:1;margin:0;height:37px}.extra-panel{position:fixed;top:50%;left:50%;right:auto;transform:translate(-50%,-50%);width:340px;z-index:1101}.date-time-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.date-time-field label{display:block;font-size:11px;color:var(--text-muted);font-weight:700;margin-bottom:4px}.date-time-field input{width:100%;height:40px;margin:0}.range-divider{grid-column:1/-1;height:1px;background:var(--border);margin:1px 0}.applied-chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}.chip{display:inline-flex;align-items:center;gap:5px;background:var(--primary-light);color:var(--primary-dark);border:1px solid rgba(13,148,136,.15);border-radius:18px;padding:4px 8px;font-size:11px}.chip button{border:0;background:none;color:inherit;cursor:pointer;margin:0;padding:0;font-size:14px;line-height:1}.summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}.summary-card{background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:13px 15px}.summary-label{font-size:11px;color:var(--text-muted);margin-bottom:4px}.summary-value{font-size:20px;font-weight:800;color:var(--primary-dark)}.summary-value.money{font-size:21px}.invoice-row{cursor:pointer}.invoice-row:hover{background:var(--bg)}.filter-backdrop{display:none}.filter-backdrop.open{display:block;position:fixed;inset:0;background:rgba(15,23,42,.28);z-index:1000}.invoice-modal{position:fixed;inset:0;background:rgba(15,23,27,.5);display:flex;align-items:flex-start;justify-content:center;z-index:1100;padding:20px;overflow-y:auto}.invoice-paper{background:#fff;border-radius:10px;padding:28px;max-width:480px;width:100%;margin-top:20px;box-shadow:0 20px 50px rgba(0,0,0,.25)}.invoice-header{text-align:center;margin-bottom:18px;padding-bottom:14px;border-bottom:2px solid var(--border)}.invoice-header h2{font-size:18px;color:var(--primary-dark);margin-bottom:4px}.invoice-meta{display:flex;justify-content:space-between;font-size:12px;color:var(--text-muted);margin-bottom:16px}.invoice-table{width:100%;border-collapse:collapse;margin-bottom:14px}.invoice-table th,.invoice-table td{padding:8px 4px;text-align:right;font-size:13px;border-bottom:1px solid var(--border)}.invoice-total-row{display:flex;justify-content:space-between;font-size:15px;font-weight:700;padding-top:10px;border-top:2px solid var(--border);color:var(--primary-dark)}.invoice-actions{display:flex;gap:8px;margin-top:18px}.invoice-actions button{flex:1;margin:0}
@media(max-width:700px){.invoice-toolbar{align-items:stretch}.invoice-search{min-width:100%}.filter-tools{width:100%;display:flex}.filter-anchor{width:auto}.filter-btn{font-size:12px;padding:0 10px}.filter-menu{position:fixed;right:12px;left:12px;top:50%;bottom:auto;transform:translateY(-50%);width:auto;max-height:78vh;overflow:auto;z-index:1001}.extra-panel{width:auto;top:50%;left:12px;right:12px;bottom:auto;transform:translateY(-50%)}.summary-grid{grid-template-columns:1fr 1fr}}@media(max-width:420px){.filter-tools{gap:5px}.filter-btn{font-size:11px;padding:0 8px}.summary-grid{grid-template-columns:1fr}.date-time-grid{gap:7px}}@media print{body *{visibility:hidden}.invoice-paper,.invoice-paper *{visibility:visible}.invoice-paper{position:absolute;top:0;right:0;left:0;box-shadow:none;max-width:100%}.invoice-actions{display:none!important}}
</style></head>

<header><button id="menuToggle">☰</button><h1>📦 نظام إدارة الصيدلية</h1><div><span class="userinfo" id="userinfo"></span><button id="logoutBtn" style="margin-right:8px">خروج</button></div></header>

<div class="main-content"><div class="card"><h2>🧾 الفواتير</h2><div class="invoice-toolbar"><div class="invoice-search"><input id="searchBox" type="text" placeholder="ابحث في الفواتير..."></div><div class="filter-tools">
<div class="filter-anchor" id="employeeAnchor"><button class="filter-btn" id="employeeBtn" type="button"><svg class="filter-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16l-6.2 7.2v5.3l-3.6 1.8v-7.1z"/></svg><span>الموظف</span><span class="badge" id="employeeBadge" style="display:none"></span></button><div class="filter-menu" id="employeeMenu"><div class="filter-menu-head"><div><strong>الموظفون</strong><small>يمكنك اختيار أكثر من موظف</small></div><button class="menu-close" data-close="employeeMenu" type="button">×</button></div><div class="employee-box"><input class="employee-search" id="employeeSearch" type="text" placeholder="🔍 بحث عن موظف..."><div class="employee-list" id="employeeList"></div></div><div class="menu-actions"><button id="applyEmployee" type="button">تطبيق</button><button id="clearEmployee" class="secondary" type="button">مسح</button></div></div></div>
<div class="filter-anchor"><button class="filter-btn" id="dateBtn" type="button"><svg class="filter-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16l-6.2 7.2v5.3l-3.6 1.8v-7.1z"/></svg><span id="dateFilterLabel">كل الوقت</span><span class="badge" id="dateBadge" style="display:none"></span></button><div class="filter-menu" id="dateMenu"><div class="filter-menu-head"><div><strong>الفترة الزمنية</strong><small>اختر الفترة التي تريد عرضها</small></div><button class="menu-close" data-close="dateMenu" type="button">×</button></div><div class="quick-list"><button class="quick-option" data-preset="today" type="button"><span>اليوم</span><span class="check">✓</span></button><button class="quick-option" data-preset="yesterday" type="button"><span>أمس</span><span class="check">✓</span></button><button class="quick-option" data-preset="7days" type="button"><span>آخر أسبوع</span><span class="check">✓</span></button><button class="quick-option" data-preset="month" type="button"><span>الشهر الجاري</span><span class="check">✓</span></button><button class="quick-option" data-preset="clear" type="button"><span>كل الوقت</span><span class="check">✓</span></button></div><div class="extra-entry"><button id="extraOptionsBtn" type="button"><span>خيارات إضافية</span><span>›</span></button></div></div></div>
<div class="filter-menu extra-panel" id="extraMenu"><div class="filter-menu-head"><div><strong>خيارات إضافية</strong><small>حدد التاريخ والوقت بدقة</small></div><button class="menu-close" data-close="extraMenu" type="button">×</button></div><div class="date-time-grid"><div class="date-time-field"><label>من تاريخ</label><input id="dateFrom" type="date"></div><div class="date-time-field"><label>إلى تاريخ</label><input id="dateTo" type="date"></div><div class="range-divider"></div><div class="date-time-field"><label>من الساعة</label><input id="timeFrom" type="time"></div><div class="date-time-field"><label>إلى الساعة</label><input id="timeTo" type="time"></div></div><div class="menu-actions"><button id="applyDate" type="button">تطبيق</button><button id="clearDate" class="secondary" type="button">مسح</button></div></div>
</div></div><div id="filterBackdrop" class="filter-backdrop"></div><div id="appliedChips" class="applied-chips"></div><div class="summary-grid"><div class="summary-card"><div class="summary-label">إجمالي الفواتير</div><div class="summary-value" id="invoiceCount">0</div></div><div class="summary-card"><div class="summary-label">إجمالي المبيعات</div><div class="summary-value money" id="salesTotal">0.00 ج.م</div></div></div><div id="invoicesWrap"><p class="loading">جاري التحميل...</p></div></div></div><div id="invoiceModal" class="invoice-modal hidden"><div class="invoice-paper" id="invoicePaperContent"></div></div>
<script src="config.js"></script><script>
const UNIT_LABELS={box:'علبة',strip:'شريط',piece:'قطعة',ampoule:'أمبولة',sachet:'كيس',other:'أخرى'};let allInvoices=[];let isAdmin=false;let applied={employees:[],dateFrom:'',dateTo:'',timeFrom:'',timeTo:'',preset:'clear'};function monthStartCairo(){const d=todayCairo();return d.slice(0,8)+'01'}
(async()=>{const auth=await requireAuth();if(!auth)return;if(!guardPageAccess(auth.profile,'invoices'))return;isAdmin=auth.profile.role==='admin';document.getElementById('userinfo').textContent=auth.profile.full_name+' ('+(isAdmin?'أدمن':'موظف')+')';if(!isAdmin)document.getElementById('employeeAnchor').style.display='none';else await loadEmployees();setInitialFilterState();await loadInvoices()})();document.getElementById('logoutBtn').addEventListener('click',async()=>{await sb.auth.signOut();location.href='index.html'});function esc(s){const d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML}
function setInitialFilterState(){applied.dateFrom='';applied.dateTo='';applied.timeFrom='';applied.timeTo='';applied.preset='clear';document.getElementById('dateFrom').value='';document.getElementById('dateTo').value='';document.getElementById('timeFrom').value='';document.getElementById('timeTo').value='';syncBadges();syncQuickOptions()}
async function loadEmployees(){const el=document.getElementById('employeeList');const {data,error}=await sb.from('profiles').select('id,full_name').order('full_name',{ascending:true});if(error){el.innerHTML='<div style="padding:10px;color:#dc2626">تعذر تحميل الموظفين</div>';return}el.innerHTML=(data||[]).map(p=>'<label class="employee-item"><input type="checkbox" value="'+esc(p.id)+'" data-name="'+esc(p.full_name||'بدون اسم')+'"><span>'+esc(p.full_name||'بدون اسم')+'</span></label>').join('');el.querySelectorAll('input').forEach(x=>x.addEventListener('change',updateEmployeeBadge))}function selectedEmployees(){return Array.from(document.querySelectorAll('#employeeList input:checked')).map(x=>({id:x.value,name:x.dataset.name}))}function updateEmployeeBadge(){const n=selectedEmployees().length;const b=document.getElementById('employeeBadge');b.textContent=n;b.style.display=n?'inline-flex':'none'}
async function loadInvoices(){const wrap=document.getElementById('invoicesWrap');const {data,error}=await sb.from('sales').select('id,sale_group_id,quantity,unit_sold,sale_price,created_at,employee_id,products(name,name_en),profiles(full_name),customers(name)').order('created_at',{ascending:false}).limit(5000);if(error){wrap.innerHTML='<p style="color:#dc2626">تعذّر تحميل الفواتير: '+esc(error.message)+'</p>';return}const groups={};(data||[]).forEach(s=>{const key=s.sale_group_id||('single-'+s.id);if(!groups[key])groups[key]={key,created_at:s.created_at,customer:s.customers?s.customers.name:'كاش',employee:s.profiles?s.profiles.full_name:'—',employee_id:s.employee_id||null,items:[],total:0};groups[key].items.push(s);groups[key].total+=Number(s.sale_price||0)});allInvoices=Object.values(groups).sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));renderInvoices()}
function cairoDate(v){return new Date(v).toLocaleDateString('en-CA',{timeZone:'Africa/Cairo'})}function cairoTime(v){return new Date(v).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',hour12:false,timeZone:'Africa/Cairo'})}function todayCairo(){return cairoDate(new Date())}
function renderInvoices(){const wrap=document.getElementById('invoicesWrap');const term=document.getElementById('searchBox').value.trim().toLowerCase();const f=applied;if(f.dateFrom&&f.dateTo&&f.dateFrom>f.dateTo){wrap.innerHTML='<p style="color:#dc2626">تاريخ البداية لا يمكن أن يكون بعد النهاية.</p>';updateSummary(0,0);return}const filtered=allInvoices.filter(inv=>{const date=cairoDate(inv.created_at),time=cairoTime(inv.created_at);if(f.employees.length&&!f.employees.includes(String(inv.employee_id||'')))return false;if(f.dateFrom&&f.dateTo&&f.timeFrom&&f.timeTo){const startStamp=f.dateFrom+'T'+f.timeFrom;const endStamp=f.dateTo+'T'+f.timeTo;const invoiceStamp=date+'T'+time;if(invoiceStamp<startStamp||invoiceStamp>endStamp)return false}else{if(f.dateFrom&&date<f.dateFrom)return false;if(f.dateTo&&date>f.dateTo)return false;if(f.timeFrom&&time<f.timeFrom)return false;if(f.timeTo&&time>f.timeTo)return false}if(!term)return true;const hay=(inv.customer+' '+inv.employee+' '+inv.items.map(i=>i.products?i.products.name+' '+(i.products.name_en||''):'').join(' ')).toLowerCase();return hay.includes(term)});const total=filtered.reduce((sum,i)=>sum+i.total,0);updateSummary(filtered.length,total);updateChips();if(!filtered.length){wrap.innerHTML='<p class="loading">مفيش فواتير مطابقة للفلاتر الحالية</p>';return}let h='<table><thead><tr><th>التاريخ</th><th>العميل</th><th>عدد الأصناف</th><th>الإجمالي</th>'+(isAdmin?'<th>البائع</th>':'')+'</tr></thead><tbody>';filtered.forEach(i=>{h+='<tr class="invoice-row" data-key="'+esc(i.key)+'"><td>'+dFormat(i.created_at)+'</td><td>'+esc(i.customer)+'</td><td>'+i.items.length+'</td><td>'+i.total.toFixed(2)+' ج</td>'+(isAdmin?'<td>'+esc(i.employee)+'</td>':'')+'</tr>'});h+='</tbody></table>';wrap.innerHTML=h;wrap.querySelectorAll('.invoice-row').forEach(r=>r.addEventListener('click',()=>showInvoice(r.dataset.key)))}
function updateSummary(count,total){document.getElementById('invoiceCount').textContent=Number(count).toLocaleString('ar-EG');document.getElementById('salesTotal').textContent=Number(total).toLocaleString('ar-EG',{minimumFractionDigits:2,maximumFractionDigits:2})+' ج.م'}function updateChips(){const box=document.getElementById('appliedChips'),parts=[];if(applied.employees.length)parts.push('<span class="chip">👤 '+applied.employees.length+' موظف <button data-clear="employees">×</button></span>');if(applied.dateFrom||applied.dateTo)parts.push('<span class="chip">📅 '+esc(applied.dateFrom||'البداية')+' → '+esc(applied.dateTo||'النهاية')+' <button data-clear="dates">×</button></span>');if(applied.timeFrom||applied.timeTo)parts.push('<span class="chip">🕐 '+esc(applied.timeFrom||'00:00')+' → '+esc(applied.timeTo||'23:59')+' <button data-clear="times">×</button></span>');box.innerHTML=parts.join('');box.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>clearOne(b.dataset.clear)))}function clearOne(type){if(type==='employees'){applied.employees=[];document.querySelectorAll('#employeeList input').forEach(x=>x.checked=false);updateEmployeeBadge()}if(type==='dates'){applied.dateFrom='';applied.dateTo='';document.getElementById('dateFrom').value='';document.getElementById('dateTo').value=''}if(type==='times'){applied.timeFrom='';applied.timeTo='';document.getElementById('timeFrom').value='';document.getElementById('timeTo').value=''}applied.preset='clear';syncBadges();syncQuickOptions();renderInvoices()}
function syncBadges(){const db=document.getElementById('dateBadge');const dn=!!(applied.dateFrom||applied.dateTo||applied.timeFrom||applied.timeTo);db.textContent=dn?'✓':'';db.style.display=dn?'inline-flex':'none'}function syncQuickOptions(){document.querySelectorAll('.quick-option').forEach(b=>b.classList.toggle('active',b.dataset.preset===applied.preset));const labels={today:'اليوم',yesterday:'أمس','7days':'آخر أسبوع',month:'الشهر الجاري',clear:'كل الوقت'};document.getElementById('dateFilterLabel').textContent=labels[applied.preset]||'كل الوقت'}function closeMenus(){document.querySelectorAll('.filter-menu.open').forEach(m=>m.classList.remove('open'));document.querySelectorAll('.filter-btn.active').forEach(b=>b.classList.remove('active'));document.getElementById('filterBackdrop').classList.remove('open')}function openMenu(id,btnId){const m=document.getElementById(id);const was=m.classList.contains('open');closeMenus();if(!was){m.classList.add('open');if(btnId)document.getElementById(btnId).classList.add('active');document.getElementById('filterBackdrop').classList.add('open')}}
document.getElementById('employeeBtn').addEventListener('click',()=>openMenu('employeeMenu','employeeBtn'));document.getElementById('dateBtn').addEventListener('click',()=>openMenu('dateMenu','dateBtn'));document.getElementById('extraOptionsBtn').addEventListener('click',()=>openMenu('extraMenu',null));document.getElementById('filterBackdrop').addEventListener('click',closeMenus);document.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',closeMenus));document.getElementById('applyEmployee').addEventListener('click',()=>{applied.employees=selectedEmployees().map(x=>String(x.id));renderInvoices();closeMenus()});document.getElementById('clearEmployee').addEventListener('click',()=>{applied.employees=[];document.querySelectorAll('#employeeList input').forEach(x=>x.checked=false);updateEmployeeBadge();renderInvoices();closeMenus()});document.getElementById('applyDate').addEventListener('click',()=>{applied.dateFrom=document.getElementById('dateFrom').value;applied.dateTo=document.getElementById('dateTo').value;applied.timeFrom=document.getElementById('timeFrom').value;applied.timeTo=document.getElementById('timeTo').value;applied.preset='';syncBadges();syncQuickOptions();renderInvoices();closeMenus()});document.getElementById('clearDate').addEventListener('click',()=>{applied.dateFrom=applied.dateTo=applied.timeFrom=applied.timeTo='';['dateFrom','dateTo','timeFrom','timeTo'].forEach(id=>document.getElementById(id).value='');applied.preset='clear';syncBadges();syncQuickOptions();renderInvoices();closeMenus()});document.querySelectorAll('.quick-option').forEach(b=>b.addEventListener('click',()=>{const p=b.dataset.preset;if(p==='clear'){applied.dateFrom=applied.dateTo=applied.timeFrom=applied.timeTo='';applied.preset='clear';['dateFrom','dateTo','timeFrom','timeTo'].forEach(id=>document.getElementById(id).value='')}else{const end=todayCairo(),d=new Date(),x=new Date(d);let start=end;if(p==='yesterday'){x.setDate(x.getDate()-1);start=cairoDate(x)}else if(p==='7days'){x.setDate(x.getDate()-6);start=cairoDate(x)}else if(p==='month'){start=monthStartCairo()}applied.dateFrom=start;applied.dateTo=p==='yesterday'?start:end;applied.timeFrom='';applied.timeTo='';applied.preset=p;document.getElementById('dateFrom').value=applied.dateFrom;document.getElementById('dateTo').value=applied.dateTo;document.getElementById('timeFrom').value='';document.getElementById('timeTo').value=''}syncBadges();syncQuickOptions();renderInvoices();closeMenus()}));document.getElementById('searchBox').addEventListener('input',renderInvoices);document.getElementById('employeeSearch').addEventListener('input',e=>{const q=e.target.value.trim().toLowerCase();document.querySelectorAll('.employee-item').forEach(x=>x.style.display=x.textContent.toLowerCase().includes(q)?'flex':'none')});function dFormat(v){return new Date(v).toLocaleString('ar-EG',{timeZone:'Africa/Cairo',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})}function showInvoice(key){const inv=allInvoices.find(x=>x.key===key);if(!inv)return;const p=document.getElementById('invoicePaperContent');p.innerHTML='<div class="invoice-header"><h2>فاتورة بيع</h2><div>'+esc(dFormat(inv.created_at))+'</div></div><div class="invoice-meta"><span>العميل: '+esc(inv.customer)+'</span><span>البائع: '+esc(inv.employee)+'</span></div><table class="invoice-table"><thead><tr><th>الصنف</th><th>الكمية</th><th>السعر</th></tr></thead><tbody>'+inv.items.map(i=>'<tr><td>'+esc(i.products?i.products.name:'—')+'</td><td>'+esc((i.quantity||0)+' '+(UNIT_LABELS[i.unit_sold]||i.unit_sold||''))+'</td><td>'+Number(i.sale_price||0).toFixed(2)+' ج</td></tr>').join('')+'</tbody></table><div class="invoice-total-row"><span>الإجمالي</span><span>'+inv.total.toFixed(2)+' ج.م</span></div><div class="invoice-actions"><button type="button" id="printInvoice">طباعة</button><button type="button" class="secondary" id="closeInvoice">إغلاق</button></div>';document.getElementById('invoiceModal').classList.remove('hidden');document.getElementById('closeInvoice').onclick=closeInvoice;document.getElementById('printInvoice').onclick=()=>window.print()}function closeInvoice(){document.getElementById('invoiceModal').classList.add('hidden')}document.getElementById('invoiceModal').addEventListener('click',e=>{if(e.target.id==='invoiceModal')closeInvoice()});document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeMenus();closeInvoice()}});
</script></body></html>
