<html lang="ar" dir="rtl">
<head>

<title>الفواتير - نظام إدارة الصيدلية</title><script src="supabase-lib.js"></script><link rel="stylesheet" href="style.css">
<style>
.invoice-toolbar{display:flex;align-items:center;gap:8px;margin:18px 0 14px;flex-wrap:wrap}.invoice-search{flex:1;min-width:230px}.invoice-search input{width:100%;height:44px;margin:0}.filter-tools{display:flex;align-items:center;justify-content:center;gap:7px}.filter-anchor{position:relative}.filter-btn{height:40px;min-width:94px;padding:0 12px;margin:0;border:1px solid var(--border);background:var(--surface,#fff);color:var(--text);border-radius:9px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:7px}.filter-icon{width:15px;height:15px;display:block;flex:0 0 15px}.filter-btn .badge{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;margin-right:1px;padding:0 4px;border-radius:9px;background:var(--primary);color:#fff;font-size:10px}.filter-menu{display:none;position:absolute;z-index:100;top:calc(100% + 7px);right:0;width:300px;background:#fff;border:1px solid var(--border);border-radius:12px;box-shadow:0 14px 36px rgba(15,23,42,.15);padding:12px}.filter-menu.open{display:block}.filter-menu-head{display:flex;align-items:center;justify-content:space-between;padding-bottom:9px;border-bottom:1px solid var(--border);margin-bottom:10px}.filter-menu-head strong{font-size:14px}.filter-menu-head small{display:block;color:var(--text-muted);font-size:10px;margin-top:2px}.menu-close{width:30px!important;height:30px!important;border:0!important;background:transparent!important;color:var(--text-muted)!important;font-size:21px;line-height:1;margin:0!important;padding:0!important;cursor:pointer}.employee-box{border:1px solid var(--border);border-radius:9px;overflow:hidden}.employee-search{border:0!important;border-bottom:1px solid var(--border)!important;border-radius:0!important;height:38px!important}.employee-list{max-height:185px;overflow:auto;padding:4px}.employee-item{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:7px;cursor:pointer;font-size:13px}.employee-item input{margin:0;width:16px;height:16px}.quick-list{display:flex;flex-direction:column;gap:5px}.quick-option{width:100%;height:39px;border:1px solid transparent;background:transparent;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;text-align:right;padding:0 10px;display:flex;align-items:center;justify-content:space-between;color:var(--text)}.quick-option:hover{border-color:var(--primary);background:var(--primary-light);color:var(--primary-dark)}.quick-option.active{border-color:var(--primary);background:var(--primary-light);color:var(--primary-dark)}.quick-option .check{font-size:14px;opacity:0}.quick-option.active .check{opacity:1}.extra-entry{margin-top:8px;padding-top:8px;border-top:1px solid var(--border)}.extra-entry button{width:100%;height:39px;border:1px solid var(--border);background:#fff;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;text-align:right;padding:0 10px;display:flex;align-items:center;justify-content:space-between;color:var(--text)!important;opacity:1!important;visibility:visible!important}.extra-entry button span{display:inline!important;color:var(--text)!important;opacity:1!important;visibility:visible!important}.menu-actions{display:flex;gap:7px;margin-top:10px}.menu-actions button{flex:1;margin:0;height:37px}.extra-panel{position:fixed;top:50%;left:50%;right:auto;transform:translate(-50%,-50%);width:340px;z-index:1101}.date-time-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.date-time-field label{display:block;font-size:11px;color:var(--text-muted);font-weight:700;margin-bottom:4px}.date-time-field input{width:100%;height:40px;margin:0}.range-divider{grid-column:1/-1;height:1px;background:var(--border);margin:1px 0}.applied-chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}.chip{display:inline-flex;align-items:center;gap:5px;background:var(--primary-light);color:var(--primary-dark);border:1px solid rgba(13,148,136,.15);border-radius:18px;padding:4px 8px;font-size:11px}.chip button{border:0;background:none;color:inherit;cursor:pointer;margin:0;padding:0;font-size:14px;line-height:1}.summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}.summary-card{background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:13px 15px}.summary-label{font-size:11px;color:var(--text-muted);margin-bottom:4px}.summary-value{font-size:20px;font-weight:800;color:var(--primary-dark)}.summary-value.money{font-size:21px}.invoice-row{cursor:pointer}.filter-backdrop{display:none}.filter-backdrop.open{display:block;position:fixed;inset:0;background:rgba(15,23,42,.28);z-index:1000}.invoice-modal{position:fixed;inset:0;background:rgba(15,23,27,.5);display:flex;align-items:flex-start;justify-content:center;z-index:1100;padding:20px;overflow-y:auto}.invoice-paper{background:#fff;border-radius:10px;padding:28px;max-width:480px;width:100%;margin-top:20px;box-shadow:0 20px 50px rgba(0,0,0,.25)}.invoice-header{text-align:center;margin-bottom:18px;padding-bottom:14px;border-bottom:2px solid var(--border)}.invoice-header h2{font-size:18px;color:var(--primary-dark);margin-bottom:4px}.invoice-meta{display:flex;justify-content:space-between;font-size:12px;color:var(--text-muted);margin-bottom:16px}.invoice-table{width:100%;border-collapse:collapse;margin-bottom:14px}.invoice-table th,.invoice-table td{padding:8px 4px;text-align:right;font-size:13px;border-bottom:1px solid var(--border)}.invoice-total-row{display:flex;justify-content:space-between;font-size:15px;font-weight:700;padding-top:10px;border-top:2px solid var(--border);color:var(--primary-dark)}.invoice-actions{display:flex;gap:8px;margin-top:18px}.invoice-actions button{flex:1;margin:0}
@media(max-width:700px){.invoice-toolbar{display:flex;flex-direction:column;align-items:center}.invoice-search{width:100%;min-width:100%;order:1}.filter-tools{width:100%;order:2;display:flex;justify-content:center;align-items:center}.filter-anchor{width:auto}.filter-btn{font-size:12px;padding:0 10px}.filter-menu{position:fixed;right:12px;left:12px;bottom:12px;top:auto;width:auto;max-height:78vh;overflow:auto;z-index:1001}.extra-panel{width:auto;top:auto;left:12px;right:12px;bottom:12px;transform:none}.summary-grid{grid-template-columns:1fr 1fr}}@media(max-width:420px){.filter-tools{gap:6px}.filter-btn{font-size:11px;padding:0 8px;min-width:90px}.summary-grid{grid-template-columns:1fr}.date-time-grid{gap:7px}}@media print{body *{visibility:hidden}.invoice-paper,.invoice-paper *{visibility:visible}.invoice-paper{position:absolute;top:0;right:0;left:0;box-shadow:none;max-width:100%}.invoice-actions{display:none!important}}
</style></head>
<body class="has-sidebar">
<header><button id="menuToggle">☰</button><h1>📦 نظام إدارة الصيدلية</h1><div><span class="userinfo" id="userinfo"></span><button id="logoutBtn" style="margin-right:8px">خروج</button></div></header>
<nav><a href="inventory.html">المخزون</a><a href="sales.html">المبيعات</a><a href="invoices.html" class="active">🧾 الفواتير</a><a href="shortages.html">النواقص</a><a href="expenses.html">المصروفات</a><a href="profit.html">الأرباح</a><a href="search.html">🔍 بحث الأدوية</a><a href="users.html">الإعدادات</a></nav><div id="sidebarOverlay" class="sidebar-overlay"></div>
<div class="main-content"><div class="card"><h2>🧾 الفواتير</h2><div class="invoice-toolbar"><div class="invoice-search"><input id="searchBox" type="text" placeholder="ابحث في الفواتير..."></div><div class="filter-tools">
<div class="filter-anchor" id="employeeAnchor"><button class="filter-btn" id="employeeBtn" type="button"><svg class="filter-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16l-6.2 7.2v5.3l-3.6 1.8v-7.1z"/></svg><span>الموظف</span><span class="badge" id="employeeBadge" style="display:none"></span></button><div class="filter-menu" id="employeeMenu"><div class="filter-menu-head"><div><strong>الموظفون</strong><small>يمكنك اختيار أكثر من موظف</small></div><button class="menu-close" data-close="employeeMenu" type="button">×</button></div><div class="employee-box"><input class="employee-search" id="employeeSearch" type="text" placeholder="🔍 بحث عن موظف..."><div class="employee-list" id="employeeList"></div></div><div class="menu-actions"><button id="applyEmployee" type="button">تطبيق</button><button id="clearEmployee" class="secondary" type="button">مسح</button></div></div></div>
<div class="filter-anchor"><button class="filter-btn" id="dateBtn" type="button"><svg class="filter-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16l-6.2 7.2v5.3l-3.6 1.8v-7.1z"/></svg><span id="dateFilterLabel">الشهر الجاري</span><span class="badge" id="dateBadge" style="display:none"></span></button><div class="filter-menu" id="dateMenu"><div class="filter-menu-head"><div><strong>الفترة الزمنية</strong><small>اختر الفترة التي تريد عرضها</small></div><button class="menu-close" data-close="dateMenu" type="button">×</button></div><div class="quick-list"><button class="quick-option" data-preset="today" type="button"><span>اليوم</span><span class="check">✓</span></button><button class="quick-option" data-preset="yesterday" type="button"><span>أمس</span><span class="check">✓</span></button><button class="quick-option" data-preset="7days" type="button"><span>آخر أسبوع</span><span class="check">✓</span></button><button class="quick-option" data-preset="month" type="button"><span>الشهر الجاري</span><span class="check">✓</span></button><button class="quick-option" data-preset="clear" type="button"><span>كل الوقت</span><span class="check">✓</span></button></div><div class="extra-entry"><button id="extraOptionsBtn" type="button"><span>خيارات إضافية</span><span>›</span></button></div></div></div>
<div class="filter-menu extra-panel" id="extraMenu"><div class="filter-menu-head"><div><strong>خيارات إضافية</strong><small>حدد التاريخ والوقت بدقة</small></div><button class="menu-close" data-close="extraMenu" type="button">×</button></div><div class="date-time-grid"><div class="date-time-field"><label>من تاريخ</label><input id="dateFrom" type="date"></div><div class="date-time-field"><label>إلى تاريخ</label><input id="dateTo" type="date"></div><div class="range-divider"></div><div class="date-time-field"><label>من الساعة</label><input id="timeFrom" type="time"></div><div class="date-time-field"><label>إلى الساعة</label><input id="timeTo" type="time"></div></div><div class="menu-actions"><button id="applyDate" type="button">تطبيق</button><button id="clearDate" class="secondary" type="button">مسح</button></div></div>
</div></div><div id="filterBackdrop" class="filter-backdrop"></div><div id="appliedChips" class="applied-chips"></div><div class="summary-grid"><div class="summary-card"><div class="summary-label">إجمالي الفواتير</div><div class="summary-value" id="invoiceCount">0</div></div><div class="summary-card"><div class="summary-label">إجمالي المبيعات</div><div class="summary-value money" id="salesTotal">0.00 ج.م</div></div></div><div id="invoicesWrap"><p class="loading">جاري التحميل...</p></div></div></div><div id="invoiceModal" class="invoice-modal hidden"><div class="invoice-paper" id="invoicePaperContent"></div></div>
<script src="config.js"></script><script>
const UNIT_LABELS={box:'علبة',strip:'شريط',piece:'قطعة',ampoule:'أمبولة',sachet:'كيس',other:'أخرى'};let allInvoices=[];let isAdmin=false;let dateFilterTouched=false;let applied={employees:[],dateFrom:'',dateTo:'',timeFrom:'',timeTo:'',preset:'month'};function monthStartCairo(){const d=todayCairo();return d.slice(0,8)+'01'}
(async()=>{const auth=await requireAuth();if(!auth)return;if(!guardPageAccess(auth.profile,'sales'))return;isAdmin=auth.profile.role==='admin';document.getElementById('userinfo').textContent=auth.profile.full_name+' ('+(isAdmin?'أدمن':'موظف')+')';if(!isAdmin)document.getElementById('employeeAnchor').style.display='none';else await loadEmployees();setDefaultMonth();await loadInvoices()})();document.getElementById('logoutBtn').addEventListener('click',async()=>{await sb.auth.signOut();location.href='index.html'});function esc(s){const d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML}
function setDefaultMonth(){const a=monthStartCairo(),b=todayCairo();dateFilterTouched=false;applied.dateFrom=a;applied.dateTo=b;applied.timeFrom='';applied.timeTo='';applied.preset='month';document.getElementById('dateFrom').value=a;document.getElementById('dateTo').value=b;document.getElementById('timeFrom').value='';document.getElementById('timeTo').value='';syncBadges();syncQuickOptions();updateChips()}
async function loadEmployees(){const el=document.getElementById('employeeList');const {data,error}=await sb.from('profiles').select('id,full_name').order('full_name',{ascending:true});if(error){el.innerHTML='<div style="padding:10px;color:#dc2626">تعذر تحميل الموظفين</div>';return}el.innerHTML=(data||[]).map(p=>'<label class="employee-item"><input type="checkbox" value="'+esc(p.id)+'" data-name="'+esc(p.full_name)+'"><span>'+esc(p.full_name)+'</span></label>').join('')}
function selectedEmployees(){return Array.from(document.querySelectorAll('#employeeList input:checked')).map(x=>({id:x.value,name:x.dataset.name}))}function syncEmployeeChecks(){document.querySelectorAll('#employeeList input').forEach(x=>x.checked=applied.employees.includes(String(x.value)))}
async function loadInvoices(){const wrap=document.getElementById('invoicesWrap');wrap.innerHTML='<p class="loading">جاري التحميل...</p>';let q=sb.from('sales').select('id,sale_group_id,quantity,unit_sold,sale_price,created_at,employee_id,products(name,name_en),profiles(full_name),customers(name)').order('created_at',{ascending:false}).limit(5000);const {data,error}=await q;if(error){wrap.innerHTML='<p class="msg error">تعذر تحميل الفواتير: '+esc(error.message)+'</p>';return}allInvoices=data||[];renderInvoices()}
function inRange(inv){const f=applied;if(f.employees.length&&!f.employees.includes(String(inv.employee_id||'')))return false;const d=new Date(inv.created_at);if(f.dateFrom){const x=new Date(f.dateFrom+'T00:00:00+03:00');if(d<x)return false}if(f.dateTo){const x=new Date(f.dateTo+'T23:59:59+03:00');if(d>x)return false}if(f.timeFrom||f.timeTo){const hh=d.toLocaleTimeString('en-GB',{timeZone:'Africa/Cairo',hour:'2-digit',minute:'2-digit',hour12:false});if(f.timeFrom&&hh<f.timeFrom)return false;if(f.timeTo&&hh>f.timeTo)return false}return true}
function renderInvoices(){const term=(document.getElementById('searchBox').value||'').trim().toLowerCase();let rows=allInvoices.filter(inRange).filter(inv=>{const p=inv.products||{};const c=inv.customers||{};const pr=inv.profiles||{};return !term||String(p.name||'').toLowerCase().includes(term)||String(p.name_en||'').toLowerCase().includes(term)||String(c.name||'').toLowerCase().includes(term)||String(pr.full_name||'').toLowerCase().includes(term)||String(inv.sale_group_id||'').toLowerCase().includes(term)});const groups={};rows.forEach(x=>{const k=x.sale_group_id||x.id;(groups[k]??=[]).push(x)});const keys=Object.keys(groups);document.getElementById('invoiceCount').textContent=keys.length;document.getElementById('salesTotal').textContent=rows.reduce((s,x)=>s+Number(x.sale_price||0)*Number(x.quantity||0),0).toFixed(2)+' ج.م';if(!keys.length){document.getElementById('invoicesWrap').innerHTML='<p class="loading">لا توجد فواتير مطابقة.</p>';return}document.getElementById('invoicesWrap').innerHTML='<table><thead><tr><th>التاريخ</th><th>المنتج</th><th>الكمية</th><th>السعر</th>'+(isAdmin?'<th>الموظف</th>':'')+'</tr></thead><tbody>'+rows.map(x=>'<tr class="invoice-row" data-group="'+esc(x.sale_group_id||x.id)+'"><td>'+esc(new Date(x.created_at).toLocaleString('ar-EG',{timeZone:'Africa/Cairo'}))+'</td><td>'+esc((x.products||{}).name||'')+'</td><td>'+esc(x.quantity)+' '+esc(UNIT_LABELS[x.unit_sold]||x.unit_sold||'')+'</td><td>'+esc((Number(x.sale_price||0)*Number(x.quantity||0)).toFixed(2))+' ج.م</td>'+(isAdmin?'<td>'+esc((x.profiles||{}).full_name||'')+'</td>':'')+'</tr>').join('')+'</tbody></table>';document.querySelectorAll('.invoice-row').forEach(r=>r.addEventListener('click',()=>showInvoice(r.dataset.group)))}
function updateChips(){const box=document.getElementById('appliedChips'),parts=[];if(applied.employees.length)parts.push('<span class="chip">👤 '+applied.employees.length+' موظف <button data-clear="employees">×</button></span>');if(dateFilterTouched&&(applied.dateFrom||applied.dateTo))parts.push('<span class="chip">📅 '+esc(applied.dateFrom||'البداية')+' → '+esc(applied.dateTo||'النهاية')+' <button data-clear="dates">×</button></span>');if(dateFilterTouched&&(applied.timeFrom||applied.timeTo))parts.push('<span class="chip">🕐 '+esc(applied.timeFrom||'00:00')+' → '+esc(applied.timeTo||'23:59')+' <button data-clear="times">×</button></span>');box.innerHTML=parts.join('');box.querySelectorAll('button[data-clear]').forEach(b=>b.addEventListener('click',()=>clearOne(b.dataset.clear)))}
function clearOne(type){dateFilterTouched=true;if(type==='employees'){applied.employees=[];document.querySelectorAll('#employeeList input').forEach(x=>x.checked=false)}if(type==='dates'){applied.dateFrom='';applied.dateTo='';document.getElementById('dateFrom').value='';document.getElementById('dateTo').value=''}if(type==='times'){applied.timeFrom='';applied.timeTo='';document.getElementById('timeFrom').value='';document.getElementById('timeTo').value=''}applied.preset='';syncBadges();syncQuickOptions();updateChips();renderInvoices()}
function syncBadges(){const db=document.getElementById('dateBadge');const dn=dateFilterTouched&&!!(applied.dateFrom||applied.dateTo||applied.timeFrom||applied.timeTo);db.textContent=dn?'✓':'';db.style.display=dn?'inline-flex':'none';const eb=document.getElementById('employeeBadge');eb.textContent=applied.employees.length?applied.employees.length:'';eb.style.display=applied.employees.length?'inline-flex':'none'}function syncQuickOptions(){document.querySelectorAll('.quick-option').forEach(b=>b.classList.toggle('active',dateFilterTouched&&b.dataset.preset===applied.preset));const labels={today:'اليوم',yesterday:'أمس','7days':'آخر أسبوع',month:'الشهر الجاري',clear:'كل الوقت'};document.getElementById('dateFilterLabel').textContent=labels[applied.preset]||'خيارات إضافية'}
function closeMenus(){document.querySelectorAll('.filter-menu.open').forEach(x=>x.classList.remove('open'));document.getElementById('filterBackdrop').classList.remove('open')}function openMenu(id){closeMenus();document.getElementById(id).classList.add('open');if(id!=='extraMenu')document.getElementById('filterBackdrop').classList.add('open')}
document.getElementById('employeeBtn').addEventListener('click',()=>{syncEmployeeChecks();openMenu('employeeMenu')});document.getElementById('dateBtn').addEventListener('click',()=>openMenu('dateMenu'));document.getElementById('extraOptionsBtn').addEventListener('click',()=>openMenu('extraMenu'));document.getElementById('filterBackdrop').addEventListener('click',closeMenus);document.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',closeMenus));document.getElementById('applyEmployee').addEventListener('click',()=>{applied.employees=selectedEmployees().map(x=>String(x.id));syncBadges();updateChips();renderInvoices();closeMenus()});document.getElementById('clearEmployee').addEventListener('click',()=>{applied.employees=[];document.querySelectorAll('#employeeList input').forEach(x=>x.checked=false);syncBadges();updateChips();renderInvoices()});document.getElementById('employeeSearch').addEventListener('input',e=>{const t=e.target.value.toLowerCase();document.querySelectorAll('#employeeList .employee-item').forEach(x=>x.style.display=x.textContent.toLowerCase().includes(t)?'flex':'none')});document.getElementById('applyDate').addEventListener('click',()=>{dateFilterTouched=true;applied.dateFrom=document.getElementById('dateFrom').value;applied.dateTo=document.getElementById('dateTo').value;applied.timeFrom=document.getElementById('timeFrom').value;applied.timeTo=document.getElementById('timeTo').value;applied.preset='';syncBadges();syncQuickOptions();updateChips();renderInvoices();closeMenus()});document.getElementById('clearDate').addEventListener('click',()=>{dateFilterTouched=true;applied.dateFrom=applied.dateTo=applied.timeFrom=applied.timeTo='';['dateFrom','dateTo','timeFrom','timeTo'].forEach(id=>document.getElementById(id).value='');applied.preset='clear';syncBadges();syncQuickOptions();updateChips();renderInvoices();closeMenus()});document.querySelectorAll('.quick-option').forEach(b=>b.addEventListener('click',()=>{dateFilterTouched=true;const p=b.dataset.preset;if(p==='clear'){applied.dateFrom=applied.dateTo=applied.timeFrom=applied.timeTo='';applied.preset='clear'}else{const t=todayCairo();if(p==='today'){applied.dateFrom=t;applied.dateTo=t}else if(p==='yesterday'){const d=new Date(t+'T00:00:00+03:00');d.setDate(d.getDate()-1);const y=d.toISOString().slice(0,10);applied.dateFrom=y;applied.dateTo=y}else if(p==='7days'){const d=new Date(t+'T00:00:00+03:00');d.setDate(d.getDate()-6);applied.dateFrom=d.toISOString().slice(0,10);applied.dateTo=t}else if(p==='month'){applied.dateFrom=monthStartCairo();applied.dateTo=t}applied.timeFrom='';applied.timeTo='';applied.preset=p;document.getElementById('dateFrom').value=applied.dateFrom;document.getElementById('dateTo').value=applied.dateTo;document.getElementById('timeFrom').value='';document.getElementById('timeTo').value=''}syncBadges();syncQuickOptions();updateChips();renderInvoices();closeMenus()}));document.getElementById('searchBox').addEventListener('input',renderInvoices);document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMenus()});
function showInvoice(group){const items=allInvoices.filter(x=>(x.sale_group_id||x.id)===group);const total=items.reduce((s,x)=>s+Number(x.sale_price||0)*Number(x.quantity||0),0);document.getElementById('invoicePaperContent').innerHTML='<div class="invoice-header"><h2>فاتورة بيع</h2><div>'+esc(new Date(items[0].created_at).toLocaleString('ar-EG',{timeZone:'Africa/Cairo'}))+'</div></div><div class="invoice-meta"><span>الموظف: '+esc((items[0].profiles||{}).full_name||'')+'</span><span>عدد الأصناف: '+items.length+'</span></div><table class="invoice-table"><thead><tr><th>الصنف</th><th>الكمية</th><th>الإجمالي</th></tr></thead><tbody>'+items.map(x=>'<tr><td>'+esc((x.products||{}).name||'')+'</td><td>'+esc(x.quantity)+' '+esc(UNIT_LABELS[x.unit_sold]||x.unit_sold||'')+'</td><td>'+esc((Number(x.sale_price||0)*Number(x.quantity||0)).toFixed(2))+' ج.م</td></tr>').join('')+'</tbody></table><div class="invoice-total-row"><span>الإجمالي</span><span>'+total.toFixed(2)+' ج.م</span></div><div class="invoice-actions"><button type="button" id="closeInvoice">إغلاق</button><button type="button" class="secondary" id="printInvoice">طباعة</button></div>';document.getElementById('invoiceModal').classList.remove('hidden');document.getElementById('closeInvoice').addEventListener('click',()=>document.getElementById('invoiceModal').classList.add('hidden'));document.getElementById('printInvoice').addEventListener('click',()=>window.print())}document.getElementById('invoiceModal').addEventListener('click',e=>{if(e.target.id==='invoiceModal')e.currentTarget.classList.add('hidden')});
</script></body></html>
