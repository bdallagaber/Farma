<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>الفواتير - نظام إدارة الصيدلية</title><script src="supabase-lib.js"></script><link rel="stylesheet" href="style.css">
<style>
.invoice-toolbar{display:flex;gap:10px;align-items:center;justify-content:space-between;margin:18px 0 14px;flex-wrap:wrap}.invoice-search{flex:1;min-width:220px}.invoice-search input{margin:0;width:100%}
.filter-wrap{position:relative}.filter-btn{min-width:125px;margin:0}.filter-panel{display:none;position:absolute;z-index:50;top:calc(100% + 8px);right:0;width:min(470px,calc(100vw - 32px));background:#fff;border:1px solid var(--border);border-radius:14px;box-shadow:0 18px 45px rgba(15,23,42,.16);padding:16px}.filter-panel.open{display:block}.filter-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.filter-head strong{font-size:15px}.filter-close{border:0;background:none;font-size:20px;cursor:pointer;padding:0;margin:0}.filter-section{border-top:1px solid var(--border);padding-top:13px;margin-top:13px}.filter-section:first-of-type{border-top:0;padding-top:0;margin-top:0}.filter-label{font-size:12px;font-weight:700;color:var(--text-muted);margin-bottom:8px;display:block}.presets{display:flex;gap:6px;flex-wrap:wrap}.preset{border:1px solid var(--border);background:#fff;border-radius:8px;padding:7px 10px;font-size:12px;cursor:pointer}.preset.active,.preset:hover{border-color:var(--primary);background:var(--primary-light);color:var(--primary-dark)}
.employee-box{border:1px solid var(--border);border-radius:10px;overflow:hidden}.employee-search{border:0!important;border-bottom:1px solid var(--border)!important;border-radius:0!important}.employee-list{max-height:170px;overflow:auto;padding:5px}.employee-item{display:flex;align-items:center;gap:8px;padding:8px;border-radius:7px;cursor:pointer;font-size:13px}.employee-item:hover{background:var(--bg)}.employee-item input{margin:0}.employee-count{font-size:11px;color:var(--text-muted);margin-top:6px}.date-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.date-field{position:relative}.date-field label{font-size:11px;color:var(--text-muted);display:block;margin-bottom:4px}.date-field input{margin:0;width:100%;height:40px}.filter-footer{display:flex;gap:8px;margin-top:15px}.filter-footer button{flex:1;margin:0}.applied-chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 15px}.chip{display:inline-flex;align-items:center;gap:5px;background:var(--primary-light);color:var(--primary-dark);border-radius:20px;padding:5px 9px;font-size:11px}.chip button{border:0;background:none;color:inherit;cursor:pointer;padding:0;margin:0;font-size:14px}.summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}.summary-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:13px 15px}.summary-label{font-size:11px;color:var(--text-muted);margin-bottom:5px}.summary-value{font-size:20px;font-weight:800;color:var(--primary-dark)}.summary-value.money{font-size:22px}.invoice-row{cursor:pointer}.invoice-row:hover{background:var(--bg)}
.invoice-modal{position:fixed;inset:0;background:rgba(15,23,27,.5);display:flex;align-items:flex-start;justify-content:center;z-index:1000;padding:20px;overflow-y:auto}.invoice-paper{background:#fff;border-radius:10px;padding:28px;max-width:480px;width:100%;margin-top:20px;box-shadow:0 20px 50px rgba(0,0,0,.25)}.invoice-header{text-align:center;margin-bottom:18px;padding-bottom:14px;border-bottom:2px solid var(--border)}.invoice-header h2{font-size:18px;color:var(--primary-dark);margin-bottom:4px}.invoice-meta{display:flex;justify-content:space-between;font-size:12px;color:var(--text-muted);margin-bottom:16px}.invoice-table{width:100%;border-collapse:collapse;margin-bottom:14px}.invoice-table th,.invoice-table td{padding:8px 4px;text-align:right;font-size:13px;border-bottom:1px solid var(--border)}.invoice-total-row{display:flex;justify-content:space-between;font-size:15px;font-weight:700;padding-top:10px;border-top:2px solid var(--border);color:var(--primary-dark)}.invoice-actions{display:flex;gap:8px;margin-top:18px}.invoice-actions button{flex:1;margin:0}
@media(max-width:600px){.invoice-toolbar{align-items:stretch}.invoice-search{min-width:100%}.filter-wrap{width:100%}.filter-btn{width:100%}.filter-panel{position:fixed;right:16px;left:16px;bottom:16px;top:auto;width:auto;max-height:82vh;overflow:auto}.summary-grid{grid-template-columns:1fr 1fr}.summary-value{font-size:17px}.summary-value.money{font-size:19px}.date-grid{grid-template-columns:1fr 1fr}}
@media print{body *{visibility:hidden}.invoice-paper,.invoice-paper *{visibility:visible}.invoice-paper{position:absolute;top:0;right:0;left:0;box-shadow:none;max-width:100%}.invoice-actions{display:none!important}}
</style></head>
<body class="has-sidebar">
<header><button id="menuToggle">☰</button><h1>📦 نظام إدارة الصيدلية</h1><div><span class="userinfo" id="userinfo"></span><button id="logoutBtn" style="margin-right:8px">خروج</button></div></header>
<nav><a href="inventory.html">المخزون</a><a href="sales.html">المبيعات</a><a href="invoices.html" class="active">🧾 الفواتير</a><a href="shortages.html">النواقص</a><a href="expenses.html">المصروفات</a><a href="profit.html">الأرباح</a><a href="search.html">🔍 بحث الأدوية</a><a href="users.html">الإعدادات</a></nav><div id="sidebarOverlay" class="sidebar-overlay"></div>
<div class="main-content"><div class="card"><h2>🧾 الفواتير</h2>
<div class="invoice-toolbar"><div class="invoice-search"><input id="searchBox" type="text" placeholder="🔍 ابحث باسم العميل أو المنتج أو الموظف..."></div><div class="filter-wrap"><button id="filterBtn" class="filter-btn" type="button">☷ الفلاتر <span id="filterBadge"></span></button>
<div id="filterPanel" class="filter-panel"><div class="filter-head"><strong>تصفية الفواتير</strong><button class="filter-close" id="closeFilters" type="button">×</button></div>
<div class="filter-section"><span class="filter-label">فترة سريعة</span><div class="presets"><button class="preset" data-preset="today" type="button">اليوم</button><button class="preset" data-preset="yesterday" type="button">أمس</button><button class="preset" data-preset="7days" type="button">آخر 7 أيام</button><button class="preset" data-preset="month" type="button">هذا الشهر</button><button class="preset" data-preset="clear" type="button">كل الفواتير</button></div></div>
<div class="filter-section" id="employeeSection"><span class="filter-label">الموظفون <span id="employeeCountLabel"></span></span><div class="employee-box"><input class="employee-search" id="employeeSearch" type="text" placeholder="🔍 ابحث عن موظف..."><div class="employee-list" id="employeeList"></div></div><div class="employee-count">يمكنك اختيار أكثر من موظف في نفس الوقت.</div></div>
<div class="filter-section"><span class="filter-label">التاريخ والوقت</span><div class="date-grid"><div class="date-field"><label for="dateFrom">من تاريخ</label><input id="dateFrom" type="date"></div><div class="date-field"><label for="dateTo">إلى تاريخ</label><input id="dateTo" type="date"></div><div class="date-field"><label for="timeFrom">من الساعة</label><input id="timeFrom" type="time"></div><div class="date-field"><label for="timeTo">إلى الساعة</label><input id="timeTo" type="time"></div></div></div>
<div class="filter-footer"><button id="applyFilters" type="button">تطبيق الفلاتر</button><button id="clearFilters" class="secondary" type="button">مسح</button></div></div></div></div>
<div id="appliedChips" class="applied-chips"></div>
<div class="summary-grid"><div class="summary-card"><div class="summary-label">إجمالي الفواتير</div><div class="summary-value" id="invoiceCount">0</div></div><div class="summary-card"><div class="summary-label">إجمالي المبيعات</div><div class="summary-value money" id="salesTotal">0.00 ج.م</div></div></div>
<div id="invoicesWrap"><p class="loading">جاري التحميل...</p></div></div></div>
<div id="invoiceModal" class="invoice-modal hidden"><div class="invoice-paper" id="invoicePaperContent"></div></div>
<script src="config.js"></script><script>
const UNIT_LABELS={box:'علبة',strip:'شريط',piece:'قطعة',ampoule:'أمبولة',sachet:'كيس',other:'أخرى'};let allInvoices=[];let isAdmin=false;let applied={employees:[],dateFrom:'',dateTo:'',timeFrom:'',timeTo:''};
(async()=>{const auth=await requireAuth();if(!auth)return;if(!guardPageAccess(auth.profile,'sales'))return;isAdmin=auth.profile.role==='admin';document.getElementById('userinfo').textContent=auth.profile.full_name+' ('+(isAdmin?'أدمن':'موظف')+')';if(!isAdmin)document.getElementById('employeeSection').style.display='none';else await loadEmployees();await loadInvoices()})();
document.getElementById('logoutBtn').addEventListener('click',async()=>{await sb.auth.signOut();location.href='index.html'});
function esc(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML}
async function loadEmployees(){const el=document.getElementById('employeeList');const {data,error}=await sb.from('profiles').select('id,full_name').order('full_name',{ascending:true});if(error){el.innerHTML='<div style="padding:10px;color:#dc2626">تعذر تحميل الموظفين</div>';return}el.innerHTML=(data||[]).map(p=>'<label class="employee-item"><input type="checkbox" value="'+esc(p.id)+'" data-name="'+esc(p.full_name||'بدون اسم')+'"> <span>'+esc(p.full_name||'بدون اسم')+'</span></label>').join('');el.querySelectorAll('input').forEach(x=>x.addEventListener('change',()=>updateEmployeeLabel()))}
function selectedEmployees(){return Array.from(document.querySelectorAll('#employeeList input:checked')).map(x=>({id:x.value,name:x.dataset.name}))}
function updateEmployeeLabel(){const n=selectedEmployees().length;document.getElementById('employeeCountLabel').textContent=n?'('+n+' محدد)':''}
async function loadInvoices(){const wrap=document.getElementById('invoicesWrap');const {data,error}=await sb.from('sales').select('id,sale_group_id,quantity,unit_sold,sale_price,created_at,products(name,name_en),profiles(id,full_name),customers(name)').order('created_at',{ascending:false}).limit(5000);if(error){wrap.innerHTML='<p style="color:#dc2626">تعذّر تحميل الفواتير: '+esc(error.message)+'</p>';return}const groups={};(data||[]).forEach(s=>{const key=s.sale_group_id||('single-'+s.id);if(!groups[key])groups[key]={key,created_at:s.created_at,customer:s.customers?s.customers.name:'كاش',employee:s.profiles?s.profiles.full_name:'—',employee_id:s.profiles?s.profiles.id:null,items:[],total:0};groups[key].items.push(s);groups[key].total+=Number(s.sale_price||0)});allInvoices=Object.values(groups).sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));renderInvoices()}
function cairoDate(v){return new Date(v).toLocaleDateString('en-CA',{timeZone:'Africa/Cairo'})}function cairoTime(v){return new Date(v).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',hour12:false,timeZone:'Africa/Cairo'})}
function renderInvoices(){const wrap=document.getElementById('invoicesWrap');const term=document.getElementById('searchBox').value.trim().toLowerCase();const f=applied;if(f.dateFrom&&f.dateTo&&f.dateFrom>f.dateTo){wrap.innerHTML='<p style="color:#dc2626">تاريخ البداية لا يمكن أن يكون بعد النهاية.</p>';return}if(f.timeFrom&&f.timeTo&&f.timeFrom>f.timeTo){wrap.innerHTML='<p style="color:#dc2626">وقت البداية لا يمكن أن يكون بعد النهاية.</p>';return}const filtered=allInvoices.filter(inv=>{const date=cairoDate(inv.created_at),time=cairoTime(inv.created_at);if(f.employees.length&&!f.employees.includes(inv.employee_id))return false;if(f.dateFrom&&date<f.dateFrom)return false;if(f.dateTo&&date>f.dateTo)return false;if(f.timeFrom&&time<f.timeFrom)return false;if(f.timeTo&&time>f.timeTo)return false;if(!term)return true;const hay=(inv.customer+' '+inv.employee+' '+inv.items.map(i=>i.products?i.products.name+' '+(i.products.name_en||''):'').join(' ')).toLowerCase();return hay.includes(term)});const total=filtered.reduce((sum,i)=>sum+i.total,0);document.getElementById('invoiceCount').textContent=filtered.length.toLocaleString('ar-EG');document.getElementById('salesTotal').textContent=total.toLocaleString('ar-EG',{minimumFractionDigits:2,maximumFractionDigits:2})+' ج.م';updateChips();if(!filtered.length){wrap.innerHTML='<p class="loading">مفيش فواتير مطابقة للفلاتر الحالية</p>';return}let h='<table><thead><tr><th>التاريخ</th><th>العميل</th><th>عدد الأصناف</th><th>الإجمالي</th>'+(isAdmin?'<th>البائع</th>':'')+'</tr></thead><tbody>';filtered.forEach(i=>{h+='<tr class="invoice-row" data-key="'+esc(i.key)+'"><td>'+dFormat(i.created_at)+'</td><td>'+esc(i.customer)+'</td><td>'+i.items.length+'</td><td>'+i.total.toFixed(2)+' ج</td>'+(isAdmin?'<td>'+esc(i.employee)+'</td>':'')+'</tr>'});h+='</tbody></table>';wrap.innerHTML=h;wrap.querySelectorAll('.invoice-row').forEach(r=>r.addEventListener('click',()=>showInvoice(r.dataset.key)))}
function updateChips(){const box=document.getElementById('appliedChips'),parts=[];if(applied.employees.length)parts.push('<span class="chip">'+applied.employees.length+' موظف <button data-clear="employees">×</button></span>');if(applied.dateFrom||applied.dateTo)parts.push('<span class="chip">📅 '+esc(applied.dateFrom||'البداية')+' → '+esc(applied.dateTo||'النهاية')+' <button data-clear="dates">×</button></span>');if(applied.timeFrom||applied.timeTo)parts.push('<span class="chip">⏰ '+(applied.timeFrom||'00:00')+' → '+(applied.timeTo||'23:59')+' <button data-clear="times">×</button></span>');box.innerHTML=parts.join('');box.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{const k=b.dataset.clear;if(k==='employees'){applied.employees=[];document.querySelectorAll('#employeeList input').forEach(x=>x.checked=false);updateEmployeeLabel()}if(k==='dates'){applied.dateFrom=applied.dateTo='';document.getElementById('dateFrom').value=document.getElementById('dateTo').value=''}if(k==='times'){applied.timeFrom=applied.timeTo='';document.getElementById('timeFrom').value=document.getElementById('timeTo').value=''}renderInvoices()}));document.getElementById('filterBadge').textContent=parts.length?' ('+parts.length+')':''}
function setDates(a,b){document.getElementById('dateFrom').value=a;document.getElementById('dateTo').value=b;document.querySelectorAll('.preset').forEach(x=>x.classList.remove('active'))}
function today(){return new Date().toLocaleDateString('en-CA',{timeZone:'Africa/Cairo'})}
document.querySelectorAll('.preset').forEach(btn=>btn.addEventListener('click',()=>{const p=btn.dataset.preset;const now=new Date();const t=today();if(p==='clear'){document.getElementById('dateFrom').value=document.getElementById('dateTo').value=document.getElementById('timeFrom').value=document.getElementById('timeTo').value=''}else if(p==='today')setDates(t,t);else if(p==='yesterday'){const d=new Date(now);d.setDate(d.getDate()-1);const y=d.toLocaleDateString('en-CA',{timeZone:'Africa/Cairo'});setDates(y,y)}else if(p==='7days'){const d=new Date(now);d.setDate(d.getDate()-6);setDates(d.toLocaleDateString('en-CA',{timeZone:'Africa/Cairo'}),t)}else if(p==='month'){const d=new Date(now);const first=new Date(d.getFullYear(),d.getMonth(),1);setDates(first.toLocaleDateString('en-CA',{timeZone:'Africa/Cairo'}),t)}document.querySelectorAll('.preset').forEach(x=>x.classList.remove('active'));btn.classList.add('active')}));
document.getElementById('filterBtn').addEventListener('click',()=>document.getElementById('filterPanel').classList.toggle('open'));document.getElementById('closeFilters').addEventListener('click',()=>document.getElementById('filterPanel').classList.remove('open'));document.addEventListener('click',e=>{const w=document.querySelector('.filter-wrap');if(!w.contains(e.target))document.getElementById('filterPanel').classList.remove('open')});document.getElementById('employeeSearch').addEventListener('input',e=>{const q=e.target.value.toLowerCase();document.querySelectorAll('.employee-item').forEach(x=>x.style.display=x.textContent.toLowerCase().includes(q)?'flex':'none')});document.getElementById('applyFilters').addEventListener('click',()=>{applied={employees:selectedEmployees().map(x=>x.id),dateFrom:document.getElementById('dateFrom').value,dateTo:document.getElementById('dateTo').value,timeFrom:document.getElementById('timeFrom').value,timeTo:document.getElementById('timeTo').value};document.getElementById('filterPanel').classList.remove('open');renderInvoices()});document.getElementById('clearFilters').addEventListener('click',()=>{applied={employees:[],dateFrom:'',dateTo:'',timeFrom:'',timeTo:''};document.querySelectorAll('#employeeList input').forEach(x=>x.checked=false);document.getElementById('dateFrom').value=document.getElementById('dateTo').value=document.getElementById('timeFrom').value=document.getElementById('timeTo').value='';document.getElementById('employeeSearch').value='';document.querySelectorAll('.preset').forEach(x=>x.classList.remove('active'));updateEmployeeLabel();renderInvoices()});document.getElementById('searchBox').addEventListener('input',renderInvoices);
function dFormat(v){return new Intl.DateTimeFormat('ar-EG',{dateStyle:'short',timeStyle:'short',timeZone:'Africa/Cairo'}).format(new Date(v))}window.showInvoice=function(key){const inv=allInvoices.find(i=>i.key===key);if(!inv)return;let rows='';inv.items.forEach(it=>{const n=it.products?(it.products.name_en||it.products.name):'—';rows+='<tr><td>'+esc(n)+'</td><td>'+it.quantity+' '+(UNIT_LABELS[it.unit_sold]||it.unit_sold)+'</td><td>'+Number(it.sale_price||0).toFixed(2)+' ج</td></tr>'});document.getElementById('invoicePaperContent').innerHTML='<div class="invoice-header"><h2>🧾 فاتورة بيع</h2><div style="font-size:12px;color:var(--text-muted)">نظام إدارة الصيدلية</div></div><div class="invoice-meta"><span>رقم: '+esc(key.replace('single-','').split('-')[0].toUpperCase())+'</span><span>'+dFormat(inv.created_at)+'</span></div><div class="invoice-meta"><span>العميل: '+esc(inv.customer)+'</span>'+(isAdmin?'<span>البائع: '+esc(inv.employee)+'</span>':'')+'</div><table class="invoice-table"><thead><tr><th>الصنف</th><th>الكمية</th><th>السعر</th></tr></thead><tbody>'+rows+'</tbody></table><div class="invoice-total-row"><span>الإجمالي</span><span>'+inv.total.toFixed(2)+' ج</span></div><div class="invoice-actions"><button onclick="print()">🖨️ طباعة</button><button class="secondary" onclick="closeInvoice()">إغلاق</button></div>';document.getElementById('invoiceModal').classList.remove('hidden')};window.closeInvoice=function(){document.getElementById('invoiceModal').classList.add('hidden')};document.getElementById('invoiceModal').addEventListener('click',e=>{if(e.target.id==='invoiceModal')closeInvoice()});
</script></body></html>
