<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الفواتير - نظام إدارة الصيدلية</title>
<script src="supabase-lib.js"></script>
<link rel="stylesheet" href="style.css">
<style>
  .invoice-filters{display:grid;grid-template-columns:2fr 1fr 1fr 1fr auto;gap:10px;align-items:end;margin-bottom:16px}
  .filter-group{display:flex;flex-direction:column;gap:5px}.filter-group label{font-size:12px;color:var(--text-muted);font-weight:700}
  .filter-group input,.filter-group select{margin:0;width:100%;box-sizing:border-box}.employee-select{min-height:42px}
  .filter-actions{display:flex;gap:7px}.filter-actions button{margin:0;white-space:nowrap}.filter-summary{font-size:12px;color:var(--text-muted);margin:-6px 0 12px}
  .invoice-row { cursor: pointer; }
  .invoice-modal {position: fixed; inset: 0; background: rgba(15,23,27,0.5);display: flex; align-items: flex-start; justify-content: center;z-index: 1000; padding: 20px; overflow-y: auto;}
  .invoice-paper {background: #fff; border-radius: 10px; padding: 28px;max-width: 480px; width: 100%; margin-top: 20px;box-shadow: 0 20px 50px rgba(0,0,0,0.25);}
  .invoice-header { text-align: center; margin-bottom: 18px; padding-bottom: 14px; border-bottom: 2px solid var(--border); }
  .invoice-header h2 { font-size: 18px; color: var(--primary-dark); margin-bottom: 4px; }
  .invoice-meta { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-muted); margin-bottom: 16px; }
  .invoice-table { width: 100%; border-collapse: collapse; margin-bottom: 14px; }
  .invoice-table th, .invoice-table td { padding: 8px 4px; text-align: right; font-size: 13px; border-bottom: 1px solid var(--border); }
  .invoice-total-row { display: flex; justify-content: space-between; font-size: 15px; font-weight: 700; padding-top: 10px; border-top: 2px solid var(--border); color: var(--primary-dark); }
  .invoice-actions { display: flex; gap: 8px; margin-top: 18px; }
  @media(max-width:850px){.invoice-filters{grid-template-columns:1fr 1fr}.filter-group.search-group{grid-column:1/-1}.filter-actions{grid-column:1/-1}}
  @media(max-width:520px){.invoice-filters{grid-template-columns:1fr}.filter-group.search-group{grid-column:auto}.filter-actions{grid-column:auto}.filter-actions button{flex:1}.invoice-paper{padding:20px}}
  @media print {body * { visibility: hidden; }.invoice-paper, .invoice-paper * { visibility: visible; }.invoice-paper { position: absolute; top: 0; right: 0; left: 0; box-shadow: none; max-width: 100%; }.invoice-actions { display: none !important; }}
</style>
</head>
<body class="has-sidebar">
<header><button id="menuToggle">☰</button><h1>📦 نظام إدارة الصيدلية</h1><div><span class="userinfo" id="userinfo"></span><button id="logoutBtn" style="margin-right:8px;">خروج</button></div></header>
<nav><a href="inventory.html">المخزون</a><a href="sales.html">المبيعات</a><a href="invoices.html" class="active">🧾 الفواتير</a><a href="shortages.html">النواقص</a><a href="expenses.html">المصروفات</a><a href="profit.html">الأرباح</a><a href="search.html">🔍 بحث الأدوية</a><a href="users.html">الإعدادات</a></nav>
<div id="sidebarOverlay" class="sidebar-overlay"></div>
<div class="main-content">
<div class="card">
  <h2>🧾 الفواتير</h2>
  <div class="invoice-filters">
    <div class="filter-group search-group"><label for="searchBox">بحث</label><input type="text" id="searchBox" placeholder="🔍 اسم العميل أو المنتج..."></div>
    <div class="filter-group"><label for="employeeFilter">الموظفون — يمكنك اختيار أكثر من موظف</label><select id="employeeFilter" class="employee-select" multiple></select></div>
    <div class="filter-group"><label for="dateFrom">من تاريخ</label><input type="date" id="dateFrom"></div>
    <div class="filter-group"><label for="dateTo">إلى تاريخ</label><input type="date" id="dateTo"></div>
    <div class="filter-actions"><button type="button" id="applyFilters">تطبيق</button><button type="button" id="clearFilters" class="secondary">مسح</button></div>
  </div>
  <div class="invoice-filters" style="grid-template-columns:1fr 1fr 1fr;">
    <div class="filter-group"><label for="timeFrom">من الساعة</label><input type="time" id="timeFrom"></div>
    <div class="filter-group"><label for="timeTo">إلى الساعة</label><input type="time" id="timeTo"></div>
    <div class="filter-group"><label>الفترة الحالية</label><div id="filterSummary" class="filter-summary" style="margin:0;padding:11px 0;">كل الفواتير</div></div>
  </div>
  <div id="invoicesWrap"><p class="loading">جاري التحميل...</p></div>
</div>
</div>
<div id="invoiceModal" class="invoice-modal hidden"><div class="invoice-paper" id="invoicePaperContent"></div></div>
<script src="config.js"></script>
<script>
  window.onerror = function(msg,url,line){document.body.insertAdjacentHTML('beforeend','<div style="position:fixed;bottom:0;left:0;right:0;background:#f28b82;color:#000;padding:12px;font-size:12px;direction:ltr;text-align:left;">JS Error: '+msg+' (line '+line+')</div>');};
  window.onunhandledrejection = function(e){document.body.insertAdjacentHTML('beforeend','<div style="position:fixed;bottom:0;left:0;right:0;background:#f28b82;color:#000;padding:12px;font-size:12px;direction:ltr;text-align:left;">Promise Error: '+(e.reason&&e.reason.message?e.reason.message:e.reason)+'</div>');};
  const UNIT_LABELS={box:'علبة',strip:'شريط',piece:'قطعة',ampoule:'أمبولة',sachet:'كيس',other:'أخرى'};
  let allInvoices=[]; let isAdmin=false;
  (async()=>{const auth=await requireAuth();if(!auth)return;if(!guardPageAccess(auth.profile,'sales'))return;isAdmin=auth.profile.role==='admin';document.getElementById('userinfo').textContent=auth.profile.full_name+' ('+(isAdmin?'أدمن':'موظف')+')';if(isAdmin)await loadEmployees();else document.getElementById('employeeFilter').closest('.filter-group').style.display='none';await loadInvoices();})();
  document.getElementById('logoutBtn').addEventListener('click',async()=>{await sb.auth.signOut();window.location.href='index.html';});
  async function loadEmployees(){const select=document.getElementById('employeeFilter');const {data,error}=await sb.from('profiles').select('id,full_name').order('full_name',{ascending:true});if(error){select.innerHTML='<option disabled>تعذر تحميل الموظفين</option>';return;}select.innerHTML=(data||[]).map(p=>'<option value="'+escapeHtml(p.id)+'">'+escapeHtml(p.full_name||'بدون اسم')+'</option>').join('');}
  function getSelectedEmployees(){return Array.from(document.getElementById('employeeFilter').selectedOptions).map(o=>o.value);}
  async function loadInvoices(){const wrap=document.getElementById('invoicesWrap');const {data,error}=await sb.from('sales').select('id,sale_group_id,quantity,unit_sold,sale_price,created_at,products(name,name_en),profiles(id,full_name),customers(name)').order('created_at',{ascending:false}).limit(5000);if(error){wrap.innerHTML='<p style="color:#dc2626;">تعذّر تحميل الفواتير: '+escapeHtml(error.message)+'</p>';return;}const groups={};(data||[]).forEach(s=>{const key=s.sale_group_id||('single-'+s.id);if(!groups[key])groups[key]={key,created_at:s.created_at,customer:s.customers?s.customers.name:'كاش',employee:s.profiles?s.profiles.full_name:'—',employee_id:s.profiles?s.profiles.id:null,items:[],total:0};groups[key].items.push(s);groups[key].total+=Number(s.sale_price||0);});allInvoices=Object.values(groups).sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));renderInvoices();}
  ['searchBox','dateFrom','dateTo','timeFrom','timeTo'].forEach(id=>document.getElementById(id).addEventListener('input',renderInvoices));
  document.getElementById('employeeFilter').addEventListener('change',renderInvoices);document.getElementById('applyFilters').addEventListener('click',renderInvoices);document.getElementById('clearFilters').addEventListener('click',()=>{document.getElementById('searchBox').value='';document.getElementById('employeeFilter').selectedIndex=-1;document.getElementById('dateFrom').value='';document.getElementById('dateTo').value='';document.getElementById('timeFrom').value='';document.getElementById('timeTo').value='';renderInvoices();});
  function renderInvoices(){const wrap=document.getElementById('invoicesWrap');const term=document.getElementById('searchBox').value.trim().toLowerCase();const employees=getSelectedEmployees();const dateFrom=document.getElementById('dateFrom').value;const dateTo=document.getElementById('dateTo').value;const timeFrom=document.getElementById('timeFrom').value;const timeTo=document.getElementById('timeTo').value;
    if(dateFrom&&dateTo&&dateFrom>dateTo){wrap.innerHTML='<p style="color:#dc2626;">تاريخ البداية لا يمكن أن يكون بعد تاريخ النهاية.</p>';return;}
    if(timeFrom&&timeTo&&timeFrom>timeTo){wrap.innerHTML='<p style="color:#dc2626;">وقت البداية لا يمكن أن يكون بعد وقت النهاية.</p>';return;}
    const filtered=allInvoices.filter(inv=>{const d=new Date(inv.created_at);const date=d.toLocaleDateString('en-CA',{timeZone:'Africa/Cairo'});const time=d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',hour12:false,timeZone:'Africa/Cairo'});if(employees.length&&!employees.includes(inv.employee_id))return false;if(dateFrom&&date<dateFrom)return false;if(dateTo&&date>dateTo)return false;if(timeFrom&&time<timeFrom)return false;if(timeTo&&time>timeTo)return false;if(!term)return true;const hay=(inv.customer+' '+inv.employee+' '+inv.items.map(i=>(i.products?i.products.name+' '+(i.products.name_en||''):'')).join(' ')).toLowerCase();return hay.includes(term);});
    updateSummary(filtered.length);if(!filtered.length){wrap.innerHTML='<p class="loading">مفيش فواتير مطابقة للفلاتر الحالية</p>';return;}
    let html='<table><thead><tr><th>التاريخ</th><th>العميل</th><th>عدد الأصناف</th><th>الإجمالي</th>'+(isAdmin?'<th>البائع</th>':'')+'</tr></thead><tbody>';filtered.forEach(inv=>{html+='<tr class="invoice-row" data-key="'+escapeHtml(inv.key)+'" onclick="showInvoice(\''+String(inv.key).replace(/'/g,"\\'")+'\')"><td>'+dFormat(inv.created_at)+'</td><td>'+escapeHtml(inv.customer)+'</td><td>'+inv.items.length+'</td><td>'+inv.total.toFixed(2)+' ج</td>'+(isAdmin?'<td>'+escapeHtml(inv.employee)+'</td>':'')+'</tr>';});html+='</tbody></table>';wrap.innerHTML=html;}
  function dFormat(value){return new Intl.DateTimeFormat('ar-EG',{dateStyle:'short',timeStyle:'short',timeZone:'Africa/Cairo'}).format(new Date(value));}
  function updateSummary(count){const parts=[];const employees=getSelectedEmployees();if(employees.length)parts.push(employees.length+' موظف محدد');const from=document.getElementById('dateFrom').value,to=document.getElementById('dateTo').value,tf=document.getElementById('timeFrom').value,tt=document.getElementById('timeTo').value;if(from||to)parts.push('التاريخ: '+(from||'بداية')+' → '+(to||'نهاية'));if(tf||tt)parts.push('الوقت: '+(tf||'00:00')+' → '+(tt||'23:59'));document.getElementById('filterSummary').textContent=(parts.length?parts.join(' · ')+' · ':'')+count+' فاتورة';}
  window.showInvoice=function(key){const inv=allInvoices.find(i=>i.key===key);if(!inv)return;const shortId=key.replace('single-','').split('-')[0].toUpperCase();let itemsHtml='';inv.items.forEach(it=>{const name=it.products?(it.products.name_en||it.products.name):'—';const unit=UNIT_LABELS[it.unit_sold]||it.unit_sold;itemsHtml+='<tr><td>'+escapeHtml(name)+'</td><td>'+it.quantity+' '+unit+'</td><td>'+Number(it.sale_price||0).toFixed(2)+' ج</td></tr>';});document.getElementById('invoicePaperContent').innerHTML='<div class="invoice-header"><h2>🧾 فاتورة بيع</h2><div style="font-size:12px;color:var(--text-muted);">نظام إدارة الصيدلية</div></div><div class="invoice-meta"><span>رقم: '+shortId+'</span><span>'+dFormat(inv.created_at)+'</span></div><div class="invoice-meta"><span>العميل: '+escapeHtml(inv.customer)+'</span>'+(isAdmin?'<span>البائع: '+escapeHtml(inv.employee)+'</span>':'')+'</div><table class="invoice-table"><thead><tr><th>الصنف</th><th>الكمية</th><th>السعر</th></tr></thead><tbody>'+itemsHtml+'</tbody></table><div class="invoice-total-row"><span>الإجمالي</span><span>'+inv.total.toFixed(2)+' ج</span></div><div class="invoice-actions"><button onclick="window.print()">🖨️ طباعة</button><button class="secondary" onclick="closeInvoice()">إغلاق</button></div>';document.getElementById('invoiceModal').classList.remove('hidden');};
  window.closeInvoice=function(){document.getElementById('invoiceModal').classList.add('hidden');};document.getElementById('invoiceModal').addEventListener('click',e=>{if(e.target.id==='invoiceModal')closeInvoice();});
  function escapeHtml(str){const div=document.createElement('div');div.textContent=str||'';return div.innerHTML;}
</script>
</body>
</html>
