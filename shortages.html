<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>النواقص - نظام إدارة الصيدلية</title>
<script src="supabase-lib.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: #0f1b16;
    color: #eef2ef;
    padding: 16px;
    padding-bottom: 60px;
  }
  header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 20px; flex-wrap: wrap; gap: 10px;
  }
  header h1 { font-size: 18px; color: #6fcf97; }
  header .userinfo { font-size: 12px; color: #9fb3a8; }
  nav { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
  nav a {
    padding: 8px 14px; background: #16261e; border: 1px solid #23392c;
    border-radius: 8px; color: #eef2ef; text-decoration: none; font-size: 13px;
  }
  nav a.active { background: #6fcf97; color: #0f1b16; font-weight: 600; }
  nav a.disabled { opacity: 0.4; pointer-events: none; }
  .card {
    background: #16261e; border: 1px solid #23392c; border-radius: 14px;
    padding: 20px; margin-bottom: 20px;
  }
  .card h2 { font-size: 16px; margin-bottom: 6px; color: #6fcf97; }
  .card p.sub { font-size: 12px; color: #9fb3a8; margin-bottom: 16px; }
  button { padding: 6px 12px; font-size: 12px; background: #23392c; color: #eef2ef; border: none; border-radius: 8px; cursor: pointer; text-decoration: none; display: inline-block; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { padding: 10px 8px; text-align: right; border-bottom: 1px solid #23392c; }
  th { color: #9fb3a8; font-weight: 600; }
  .critical { color: #f28b82; font-weight: 600; }
  .warning { color: #f2c94c; font-weight: 600; }
  .loading { text-align: center; color: #9fb3a8; padding: 20px; }
  .empty-ok { text-align: center; color: #6fcf97; padding: 20px; }
  .status-btn { padding: 6px 10px; font-size: 12px; border-radius: 6px; cursor: pointer; border: 1px solid #2a4536; background: #16261e; color: #eef2ef; }
  .status-btn.ordered-btn.active { background: #6fcf97; color: #0f1b16; border-color: #6fcf97; }
  .status-btn.unavailable-btn.active { background: #a63a3a; color: #fff; border-color: #a63a3a; }
</style>
</head>
<body>

<header>
  <h1>📦 نظام إدارة الصيدلية</h1>
  <div>
    <span class="userinfo" id="userinfo"></span>
    <button id="logoutBtn" style="margin-right:8px;">خروج</button>
  </div>
</header>

<nav>
  <a href="inventory.html">المخزون</a>
  <a href="sales.html">المبيعات</a>
  <a href="shortages.html" class="active">النواقص</a>
  <a href="expenses.html">المصروفات</a>
  <a href="profit.html">الأرباح</a>
  <a href="search.html">🔍 بحث الأدوية</a>
  <a href="users.html">الإعدادات</a>
</nav>

<div class="card">
  <h2>⚠️ أصناف وصلت للحد الأدنى</h2>
  <p class="sub">وانت بتكلم المورد بالتليفون: دوس على الزرار جنب كل صنف يتغيّر (اتطلب / مش متوفر)</p>
  <div id="lowStockWrap"><p class="loading">جاري التحميل...</p></div>
</div>

<div class="card">
  <h2>⏳ أصناف قربت تنتهي صلاحيتها</h2>
  <p class="sub">تنبيه قبل انتهاء الصلاحية بـ 5 شهور</p>
  <div id="expiryWrap"><p class="loading">جاري التحميل...</p></div>
</div>

<script src="config.js"></script>
<script>
  window.onerror = function(msg, url, line) {
    document.body.insertAdjacentHTML('beforeend',
      '<div style="position:fixed;bottom:0;left:0;right:0;background:#f28b82;color:#000;padding:12px;font-size:12px;direction:ltr;text-align:left;">JS Error: ' + msg + ' (line ' + line + ')</div>');
  };
  window.onunhandledrejection = function(e) {
    document.body.insertAdjacentHTML('beforeend',
      '<div style="position:fixed;bottom:0;left:0;right:0;background:#f28b82;color:#000;padding:12px;font-size:12px;direction:ltr;text-align:left;">Promise Error: ' + (e.reason && e.reason.message ? e.reason.message : e.reason) + '</div>');
  };

  const UNIT_LABELS = {
    box: 'علبة', strip: 'شريط', piece: 'قطعة',
    ampoule: 'أمبولة', sachet: 'كيس', other: 'أخرى'
  };

  let currentUserId = null;

  (async () => {
    const auth = await requireAuth();
    if (!auth) return;
    if (!guardPageAccess(auth.profile, 'shortages')) return;
    currentUserId = auth.user.id;
    document.getElementById('userinfo').textContent =
      auth.profile.full_name + ' (' + (auth.profile.role === 'admin' ? 'أدمن' : 'موظف') + ')';

    await loadLowStock();
    await loadExpiring();
  })();

  document.getElementById('logoutBtn').addEventListener('click', async () => {
    await sb.auth.signOut();
    window.location.href = 'index.html';
  });

  async function loadLowStock() {
    const wrap = document.getElementById('lowStockWrap');
    // الـ view "shortages" بيقارن المخزون بالحد الأدنى تلقائيًا من قاعدة البيانات
    const { data, error } = await sb
      .from('shortages')
      .select('product_id, name, quantity_smallest_unit, min_stock_threshold');

    if (error) {
      wrap.innerHTML = '<p style="color:#f28b82;">تعذّر تحميل النواقص: ' + error.message + '</p>';
      return;
    }
    if (!data || data.length === 0) {
      wrap.innerHTML = '<p class="empty-ok">✅ مفيش أصناف ناقصة دلوقتي</p>';
      window._checklistCache = [];
      return;
    }

    const { data: checklist } = await sb.from('order_checklist').select('product_id, supplier, status');
    const checklistMap = {};
    (checklist || []).forEach(c => { checklistMap[c.product_id] = c; });

    window._shortagesCache = data;
    window._checklistCache = data.map(s => ({ ...s, ...(checklistMap[s.product_id] || { status: 'pending', supplier: null }) }));

    let html = '<table><thead><tr><th>المنتج</th><th>المتاح</th><th>الحد الأدنى</th><th>الحالة</th></tr></thead><tbody>';
    for (const s of data) {
      const isZero = s.quantity_smallest_unit <= 0;
      const c = checklistMap[s.product_id];
      const status = c ? c.status : 'pending';

      const btnLabel = status === 'ordered' ? '✅ اتطلب' : (status === 'unavailable' ? '❌ مش متوفر' : '⚪ لسه محددتش');
      const btnClass = status === 'ordered' ? 'ordered-btn active' : (status === 'unavailable' ? 'unavailable-btn active' : '');

      html += '<tr>' +
        '<td>' + escapeHtml(s.name) + '</td>' +
        '<td class="' + (isZero ? 'critical' : 'warning') + '">' + s.quantity_smallest_unit + (isZero ? ' (خلص!)' : '') + '</td>' +
        '<td>' + s.min_stock_threshold + '</td>' +
        '<td><button type="button" class="status-btn ' + btnClass + '" onclick="cycleStatus(\'' + s.product_id + '\', \'' + status + '\')">' + btnLabel + '</button></td>' +
        '</tr>';
    }
    html += '</tbody></table>';
    wrap.innerHTML = html;
  }

  window.cycleStatus = async function(productId, currentStatus) {
    // فاضي -> اتطلب -> مش متوفر -> فاضي
    const next = currentStatus === 'pending' ? 'ordered' : (currentStatus === 'ordered' ? 'unavailable' : 'pending');

    if (next === 'pending') {
      const { error } = await sb.from('order_checklist').delete().eq('product_id', productId);
      if (error) { alert('حصل خطأ: ' + error.message); return; }
    } else {
      const { error } = await sb.from('order_checklist').upsert({
        product_id: productId,
        status: next,
        updated_at: new Date().toISOString(),
        updated_by: currentUserId
      });
      if (error) { alert('حصل خطأ: ' + error.message); return; }
    }
    await loadLowStock();
  };

  async function loadExpiring() {
    const wrap = document.getElementById('expiryWrap');
    const fiveMonthsFromNow = new Date();
    fiveMonthsFromNow.setMonth(fiveMonthsFromNow.getMonth() + 5);
    const cutoff = fiveMonthsFromNow.toISOString().split('T')[0];

    const { data, error } = await sb
      .from('products')
      .select('id, name, expiry_date')
      .not('expiry_date', 'is', null)
      .lte('expiry_date', cutoff)
      .order('expiry_date');

    if (error) {
      wrap.innerHTML = '<p style="color:#f28b82;">تعذّر تحميل بيانات الصلاحية: ' + error.message + '</p>';
      return;
    }
    if (!data || data.length === 0) {
      wrap.innerHTML = '<p class="empty-ok">✅ مفيش أصناف قربت تنتهي صلاحيتها</p>';
      return;
    }

    const today = new Date();
    let html = '<table><thead><tr><th>المنتج</th><th>تاريخ الانتهاء</th><th>الحالة</th></tr></thead><tbody>';
    for (const p of data) {
      const expiry = new Date(p.expiry_date);
      const isExpired = expiry < today;
      html += '<tr>' +
        '<td>' + escapeHtml(p.name) + '</td>' +
        '<td>' + p.expiry_date + '</td>' +
        '<td class="' + (isExpired ? 'critical' : 'warning') + '">' + (isExpired ? 'منتهي بالفعل ❌' : 'قربت تنتهي ⏳') + '</td>' +
        '</tr>';
    }
    html += '</tbody></table>';
    wrap.innerHTML = html;
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }
</script>

</body>
</html>
